tags:
- name: Operations
  description: '`/health`는 adapter process liveness, `/ready`는 detector vLLM dependency 상태를 확인합니다.'
- name: Monitoring
  description: Risk Adapter와 detector별 signal metric입니다. 운영 환경에서는 admin token 또는 내부망으로 보호합니다.
- name: Risk Signal
  description: '내부 detector 호출 결과를 signal-only response로 정규화합니다. 최종 정책 결정 필드는 반환하지 않습니다.


    **Prompt detector** — Prompt Injection / Leaking 탐지:

    지시 무시, system prompt 탈취, roleplay jailbreak, 간접 injection, tool abuse


    Siren detector는 retired 상태이며, aggregate는 enabled detector registry 기준으로 동작합니다.'
