tags:
- name: Operations
  description: '`/health`는 프로세스가 살아 있는지, `/ready`는 탐지기 vLLM이 준비됐는지 확인합니다.'
- name: Monitoring
  description: Risk Adapter와 탐지기별 신호 지표입니다. 운영 환경에서는 admin 토큰 또는 내부망으로 보호합니다.
- name: Risk Signal
  description: '내부 탐지기 호출 결과를 신호 전용 응답으로 정규화합니다. 최종 정책 결정 필드는 반환하지 않습니다.


    HTTP 200 응답의 `status=failed` 또는 `assessment_complete=false`는 탐지기가 실패했다는 뜻이며, `risk_detected=false`만
    보고 안전하다고 판단하면 안 됩니다.


    **Sensitive Data Protection**:

    - **PII Protection** (D1, D2, D5) — 로컬 정규식 기반 개인정보 탐지

    - **Secret Exposure** (D4, D5) — regex/entropy 기반 시크릿·자격증명 탐지


    **Prompt 탐지기** — Prompt Injection / Leaking 탐지:

    지시 무시, system prompt 탈취, roleplay jailbreak, 간접 injection, tool abuse'
