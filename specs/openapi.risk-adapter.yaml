      summary: 통합 risk signal
      description: '활성화된 탐지기를 등록 순서(pii → secret → prompt)대로 호출하고 결과를 합칩니다.


        어느 하나라도 신호를 찾으면 `risk_detected: true`를 반환합니다. 탐지기가 실패하면 정책 판단 없이 시스템 신호로만
