openapi: 3.1.0
info:
  title: AI Model Serving Gateway
  description: '

    ## 빠른 시작


    1. `GET /health` — Gateway process liveness

    2. `GET /ready` — vLLM, Risk Adapter 전체 dependency readiness

    3. `GET /v1/models` — logical model id, capability, 사용자 조정 가능 parameter 목록

    4. `POST /v1/chat/completions` — chat completion (`local-main`)

    5. `POST /v1/embeddings` — embedding 생성 (`local-embed`, `local-embed-ko`)

    6. `POST /v1/retrieval/*` — 문서 관련도 재순위·점수 계산 (`local-embed-ko` 기본)

    7. `POST /v1/risk/*` — prompt risk signal


    ## 인증


    - **bearerAuth** — `/v1/*` 사용자 API: `Authorization: Bearer <API_KEY>`

    - **adminBearerAuth** — `/ready`, `/metrics`: `Authorization: Bearer <ADMIN_API_KEY>`


    ## 모델별 파라미터 확인


    모델별 사용자 조정 가능 parameter는 `/v1/models[].request_parameters`가 source of truth입니다.

    이 API docs는 contract reference이며, 모델별 form UI는 `/v1/models` 기반으로 구성해야 합니다.


    | 모델 | 기능 |

    |---|---|

    | `local-main` | chat, vision, tools, structured outputs, logprobs |

    | `local-embed` | embeddings (`dimensions`, `truncate_prompt_tokens`) |

    | `local-embed-ko` | Korean dense retrieval default, embeddings fixed at 1024
    dimensions |

    | `risk-prompt` | prompt risk signal — 사용자 sampling parameter 없음 |


    ## Readiness


    - `/health` — process liveness (인증 없음)

    - `/ready` — 전체 dependency readiness (admin auth 필요)

    - **HTTP 200** `status: ready` — serving 가능

    - **HTTP 503** `status: not_ready` — 로딩 중 또는 dependency 불가 (`not_ready_dependencies`
    필드 참고)

    '
  contact:
    name: AI Model Serving Platform 운영
  version: 0.0.1
paths:
  /health:
    get:
      tags:
      - Operations
      summary: Liveness 확인
      operationId: getGatewayHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Getgatewayhealth
  /ready:
    get:
      tags:
      - Operations
      summary: Dependency readiness 확인
      description: 내부 readiness endpoint입니다. Gateway가 의존하는 vLLM runtime과 Risk Adapter의
        준비 상태를 확인합니다. 모델 로딩 중에는 HTTP 503을 반환하며, body의 `not_ready_dependencies`에 아직
        준비되지 않은 dependency 목록과 `message`가 포함됩니다.
      operationId: getGatewayReadiness
      responses:
        '200':
          description: 모든 dependency 준비 완료
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: ReadinessResponse
                type: object
                required:
                - status
                - service
                - phase
                - not_ready_dependencies
                - required_not_ready_dependencies
                - optional_not_ready_dependencies
                - dependencies
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum:
                    - ready
                    - degraded
                    - not_ready
                  service:
                    type: string
                    minLength: 1
                  phase:
                    type: string
                    enum:
                    - serving
                    - waiting_for_dependencies
                  not_ready_dependencies:
                    type: array
                    items:
                      type: string
                      minLength: 1
                  required_not_ready_dependencies:
                    type: array
                    items:
                      type: string
                      minLength: 1
                  optional_not_ready_dependencies:
                    type: array
                    items:
                      type: string
                      minLength: 1
                  dependencies:
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      - status
                      additionalProperties: false
                      properties:
                        name:
                          type: string
                          minLength: 1
                        status:
                          type: string
                          enum:
                          - ready
                          - degraded
                          - not_ready
                          - unknown
                        endpoint:
                          type:
                          - string
                          - 'null'
                        message:
                          type:
                          - string
                          - 'null'
              example:
                status: ready
                service: gateway
                phase: serving
                not_ready_dependencies: []
                required_not_ready_dependencies: []
                optional_not_ready_dependencies: []
                dependencies:
                - name: main_llm_vllm
                  status: ready
                  endpoint: http://main-llm-vllm:9401/v1/models
                - name: embedding_vllm
                  status: ready
                  endpoint: http://embedding-vllm:9402/v1/models
                - name: risk_adapter
                  status: ready
                  endpoint: http://risk-adapter:9405/ready
        '401':
          description: Admin Bearer token 필요
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: CommonErrorResponse
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    - retryable
                    - request_id
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        enum:
                        - VALIDATION_ERROR
                        - UNAUTHORIZED
                        - FORBIDDEN
                        - NOT_FOUND
                        - MODEL_UNAVAILABLE
                        - MODEL_PARKED
                        - MODEL_CAPABILITY_MISMATCH
                        - UPSTREAM_TIMEOUT
                        - UPSTREAM_ERROR
                        - UPSTREAM_SCHEMA_ERROR
                        - RATE_LIMITED
                        - PARSE_ERROR
                        - INTERNAL_ERROR
                        - QUEUE_TIMEOUT
                        - CIRCUIT_OPEN
                        - REQUEST_TOO_LARGE
                        - RUNTIME_NOT_READY
                        - DETECTOR_RETIRED
                        - DETECTOR_DISABLED
                        - STREAM_LIMIT_EXCEEDED
                        - MAIN_MODEL_CONTROL_UNAVAILABLE
                        - MAIN_MODEL_SWITCH_IN_PROGRESS
                      message:
                        type: string
                      retryable:
                        type: boolean
                      request_id:
                        type: string
                      operation_id:
                        type:
                        - string
                        - 'null'
                      operation_status:
                        type:
                        - string
                        - 'null'
        '503':
          description: 일부 dependency 로딩 중 또는 불가
          content:
            application/json:
              example:
                status: not_ready
                service: gateway
                phase: waiting_for_dependencies
                not_ready_dependencies:
                - risk_adapter
                required_not_ready_dependencies:
                - risk_adapter
                optional_not_ready_dependencies: []
                dependencies:
                - name: main_llm_vllm
                  status: ready
                  endpoint: http://main-llm-vllm:9401/v1/models
                - name: risk_adapter
                  status: not_ready
                  endpoint: http://risk-adapter:9405/ready
                  message: 'waiting for risk adapter dependencies: risk_prompt_vllm'
      security:
      - adminBearerAuth: []
      x-response-contract-schema: readiness_response.schema.json
  /metrics:
    get:
      tags:
      - Monitoring
      summary: Prometheus metrics 조회
      description: Prometheus가 scrape하는 Gateway metric 엔드포인트입니다. 운영 환경에서는 admin token
        또는 내부망으로 보호합니다.
      operationId: getGatewayMetrics
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: Admin Bearer token 필요
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: CommonErrorResponse
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    - retryable
                    - request_id
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        enum:
                        - VALIDATION_ERROR
                        - UNAUTHORIZED
                        - FORBIDDEN
                        - NOT_FOUND
                        - MODEL_UNAVAILABLE
                        - MODEL_PARKED
                        - MODEL_CAPABILITY_MISMATCH
                        - UPSTREAM_TIMEOUT
                        - UPSTREAM_ERROR
                        - UPSTREAM_SCHEMA_ERROR
                        - RATE_LIMITED
                        - PARSE_ERROR
                        - INTERNAL_ERROR
                        - QUEUE_TIMEOUT
                        - CIRCUIT_OPEN
                        - REQUEST_TOO_LARGE
                        - RUNTIME_NOT_READY
                        - DETECTOR_RETIRED
                        - DETECTOR_DISABLED
                        - STREAM_LIMIT_EXCEEDED
                        - MAIN_MODEL_CONTROL_UNAVAILABLE
                        - MAIN_MODEL_SWITCH_IN_PROGRESS
                      message:
                        type: string
                      retryable:
                        type: boolean
                      request_id:
                        type: string
                      operation_id:
                        type:
                        - string
                        - 'null'
                      operation_status:
                        type:
                        - string
                        - 'null'
      security:
      - adminBearerAuth: []
  /v1/models:
    get:
      tags:
      - Models
      summary: 사용 가능한 모델 목록
      description: Gateway가 외부 호출자에게 노출하는 logical model id, capability, 사용자 조정 가능
        request parameter 목록입니다. catalog 성격의 엔드포인트이므로 vLLM 로딩 상태와 무관하게 항상 목록을 반환합니다.
        현재 serving 가능 여부는 `/ready`의 `status`와 `not_ready_dependencies`를 확인하세요. 클라이언트
        UI는 각 item의 `request_parameters`를 읽어 모델별 입력 form을 구성할 수 있습니다.
      operationId: listModels
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: GatewayModelListResponse
                type: object
                required:
                - object
                - data
                additionalProperties: false
                properties:
                  object:
                    const: list
                  data:
                    type: array
                    minItems: 4
                    items:
                      type: object
                      required:
                      - id
                      - object
                      - backend
                      - capabilities
                      - request_parameters
                      additionalProperties: true
                      properties:
                        id:
                          enum:
                          - local-main
                          - local-embed
                          - local-embed-ko
                          - risk-prompt
                        object:
                          const: model
                        backend:
                          type: string
                          minLength: 1
                        capabilities:
                          type: array
                          minItems: 1
                          items:
                            enum:
                            - chat.completions
                            - chat.completions.vision
                            - chat.completions.tools
                            - embeddings
                            - retrieval_rerank
                            - retrieval_score
                            - risk.prompt_attack_signal
                        request_parameters:
                          type: object
                          description: 모델별 사용자 조정 가능 request parameter와 제약 조건입니다.
                            prompt/messages/input 같은 필수 입력 본문은 여기에 포함하지 않습니다.
                          additionalProperties:
                            type: object
                            additionalProperties: true
                        fixed_parameters:
                          type: object
                          description: 사용자 요청에는 노출하지 않고 adapter/runtime이 고정하는 내부 parameter입니다.
                          additionalProperties: true
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: CommonErrorResponse
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    - retryable
                    - request_id
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        enum:
                        - VALIDATION_ERROR
                        - UNAUTHORIZED
                        - FORBIDDEN
                        - NOT_FOUND
                        - MODEL_UNAVAILABLE
                        - MODEL_PARKED
                        - MODEL_CAPABILITY_MISMATCH
                        - UPSTREAM_TIMEOUT
                        - UPSTREAM_ERROR
                        - UPSTREAM_SCHEMA_ERROR
                        - RATE_LIMITED
                        - PARSE_ERROR
                        - INTERNAL_ERROR
                        - QUEUE_TIMEOUT
                        - CIRCUIT_OPEN
                        - REQUEST_TOO_LARGE
                        - RUNTIME_NOT_READY
                        - DETECTOR_RETIRED
                        - DETECTOR_DISABLED
                        - STREAM_LIMIT_EXCEEDED
                        - MAIN_MODEL_CONTROL_UNAVAILABLE
                        - MAIN_MODEL_SWITCH_IN_PROGRESS
                      message:
                        type: string
                      retryable:
                        type: boolean
                      request_id:
                        type: string
                      operation_id:
                        type:
                        - string
                        - 'null'
                      operation_status:
                        type:
                        - string
                        - 'null'
      security:
      - bearerAuth: []
      x-response-contract-schema: model_list_response.schema.json
  /v1/chat/completions:
    post:
      tags:
      - Chat
      summary: Chat completion 생성
      description: "`local-main`을 통한 chat completion API입니다. OpenAI 호환 bounded subset을\
        \ 제공합니다.\n\nGateway가 model id, 입력 modality, token limit, tool-call 지원, parameter\
        \ allowlist를 검증합니다.\n\n- `stream=true` — vLLM SSE chunk를 버퍼링 없이 `text/event-stream`으로\
        \ relay\n- `response_format`\n  - `json_object` — JSON mode. messages에 명시적\
        \ JSON 지시문 필요, schema 일치 미보장\n  - `json_schema` — Structured Outputs. root\
        \ `object` 필수, `additionalProperties: false` 필수, optional field는 nullable\
        \ union(`[\"type\", \"null\"]`) 으로 표현, external `$ref` 불가\n- `logprobs`, `top_logprobs`,\
        \ `logit_bias` — Gateway policy 안에서 upstream에 전달"
      operationId: createChatCompletion
      requestBody:
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              title: GatewayChatCompletionRequest
              type: object
              required:
              - model
              - messages
              additionalProperties: false
              properties:
                model:
                  const: local-main
                messages:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                    - role
                    additionalProperties: false
                    properties:
                      role:
                        type: string
                        enum:
                        - system
                        - user
                        - assistant
                        - tool
                      content:
                        oneOf:
                        - type: string
                        - type: 'null'
                        - type: array
                          minItems: 1
                          items:
                            oneOf:
                            - type: object
                              required:
                              - type
                              - text
                              additionalProperties: false
                              properties:
                                type:
                                  const: text
                                text:
                                  type: string
                            - type: object
                              required:
                              - type
                              - image_url
                              additionalProperties: false
                              properties:
                                type:
                                  const: image_url
                                image_url:
                                  type: object
                                  required:
                                  - url
                                  additionalProperties: false
                                  properties:
                                    url:
                                      type: string
                                      pattern: ^data:image/(png|jpeg|webp);base64,
                                    detail:
                                      type: string
                                      enum:
                                      - auto
                                      - low
                                      - high
                      tool_calls:
                        type: array
                        minItems: 1
                        items:
                          type: object
                          required:
                          - id
                          - type
                          - function
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              minLength: 1
                            type:
                              const: function
                            function:
                              type: object
                              required:
                              - name
                              - arguments
                              additionalProperties: false
                              properties:
                                name:
                                  type: string
                                  minLength: 1
                                arguments:
                                  type: string
                      tool_call_id:
                        type: string
                        minLength: 1
                      name:
                        type: string
                        minLength: 1
                temperature:
                  type: number
                  minimum: 0
                  maximum: 2
                max_tokens:
                  type: integer
                  minimum: 1
                  maximum: 8192
                top_p:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 1
                top_k:
                  type: integer
                  minimum: -1
                min_p:
                  type: number
                  minimum: 0
                  maximum: 1
                presence_penalty:
                  type: number
                  minimum: -2
                  maximum: 2
                frequency_penalty:
                  type: number
                  minimum: -2
                  maximum: 2
                repetition_penalty:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 2
                seed:
                  type: integer
                  minimum: 0
                n:
                  type: integer
                  minimum: 1
                  maximum: 1
                stop:
                  oneOf:
                  - type: string
                  - type: array
                    minItems: 1
                    maxItems: 8
                    items:
                      type: string
                stream:
                  type: boolean
                  description: When true, Gateway relays the upstream vLLM/OpenAI-compatible
                    SSE response as text/event-stream without buffering or rewriting
                    standard chat.completion.chunk events.
                stream_options:
                  type: object
                  description: OpenAI-compatible streaming options. include_usage
                    asks the upstream to include a final usage chunk when supported.
                  additionalProperties: false
                  properties:
                    include_usage:
                      type: boolean
                tools:
                  type: array
                  minItems: 1
                  maxItems: 16
                  items:
                    type: object
                    required:
                    - type
                    - function
                    additionalProperties: false
                    properties:
                      type:
                        const: function
                      function:
                        type: object
                        required:
                        - name
                        additionalProperties: false
                        properties:
                          name:
                            type: string
                            minLength: 1
                            maxLength: 64
                          description:
                            type: string
                          parameters:
                            type: object
                          strict:
                            type: boolean
                tool_choice:
                  oneOf:
                  - type: string
                    enum:
                    - auto
                    - none
                    - required
                  - type: object
                    required:
                    - type
                    - function
                    properties:
                      type:
                        const: function
                      function:
                        type: object
                        required:
                        - name
                        properties:
                          name:
                            type: string
                            minLength: 1
                        additionalProperties: false
                    additionalProperties: false
                parallel_tool_calls:
                  type: boolean
                  const: false
                reasoning:
                  type: boolean
                  description: When true, Gateway enables Gemma4 thinking for this
                    request by forwarding chat_template_kwargs.enable_thinking=true
                    to vLLM. Defaults to false when omitted.
                response_format:
                  type: object
                  additionalProperties: false
                  required:
                  - type
                  properties:
                    type:
                      type: string
                      enum:
                      - text
                      - json_object
                      - json_schema
                    json_schema:
                      type: object
                      additionalProperties: false
                      required:
                      - name
                      - schema
                      properties:
                        name:
                          type: string
                          pattern: ^[A-Za-z0-9_-]{1,64}$
                          maxLength: 64
                        description:
                          type: string
                        strict:
                          type: boolean
                        schema:
                          type: object
                  allOf:
                  - if:
                      properties:
                        type:
                          enum:
                          - text
                          - json_object
                    then:
                      not:
                        required:
                        - json_schema
                  - if:
                      properties:
                        type:
                          const: json_schema
                      required:
                      - type
                    then:
                      required:
                      - json_schema
                logprobs:
                  type: boolean
                top_logprobs:
                  type: integer
                  minimum: 0
                  maximum: 10
                  description: Requires logprobs=true. OpenAI allows up to 20; this
                    Gateway caps at 10 for response-size and latency control.
                logit_bias:
                  type: object
                  maxProperties: 256
                  propertyNames:
                    pattern: ^[0-9]+$
                  additionalProperties:
                    type: number
                    minimum: -100
                    maximum: 100
                  description: Token ids are interpreted by the served vLLM model
                    tokenizer, not OpenAI/tiktoken ids.
              $defs:
                tool:
                  type: object
                  required:
                  - type
                  - function
                  additionalProperties: false
                  properties:
                    type:
                      const: function
                    function:
                      type: object
                      required:
                      - name
                      additionalProperties: false
                      properties:
                        name:
                          type: string
                          minLength: 1
                          maxLength: 64
                        description:
                          type: string
                        parameters:
                          type: object
                        strict:
                          type: boolean
                tool_call:
                  type: object
                  required:
                  - id
                  - type
                  - function
                  additionalProperties: false
                  properties:
                    id:
                      type: string
                      minLength: 1
                    type:
                      const: function
                    function:
                      type: object
                      required:
                      - name
                      - arguments
                      additionalProperties: false
                      properties:
                        name:
                          type: string
                          minLength: 1
                        arguments:
                          type: string
              allOf:
              - if:
                  required:
                  - stream_options
                then:
                  required:
                  - stream
                  properties:
                    stream:
                      const: true
              - if:
                  required:
                  - top_logprobs
                then:
                  required:
                  - logprobs
                  properties:
                    logprobs:
                      const: true
            examples:
              basic:
                summary: 최소 요청 (runtime 기본 sampling)
                value:
                  model: local-main
                  messages:
                  - role: user
                    content: 안녕하세요. 한 문장으로 인사해주세요.
              deterministic_smoke:
                summary: 짧은 결정적 smoke 요청
                value:
                  model: local-main
                  messages:
                  - role: user
                    content: Say OK only.
                  max_tokens: 1
                  temperature: 0
                  n: 1
              balanced_sampling:
                summary: 일반 대화용 sampling 예시
                value:
                  model: local-main
                  messages:
                  - role: user
                    content: Gemma 4 모델의 특징을 세 문장으로 설명해주세요.
                  max_tokens: 512
                  temperature: 0.7
                  top_p: 0.9
              streaming:
                summary: 스트리밍 요청 (stream=true)
                value:
                  model: local-main
                  messages:
                  - role: user
                    content: 안녕하세요.
                  stream: true
              streaming_with_usage:
                summary: 스트리밍 + usage 추적
                value:
                  model: local-main
                  messages:
                  - role: user
                    content: 안녕하세요.
                  stream: true
                  stream_options:
                    include_usage: true
              with_system_prompt:
                summary: 시스템 프롬프트 + 샘플링 파라미터
                value:
                  model: local-main
                  messages:
                  - role: system
                    content: You are a helpful assistant. Answer concisely in Korean.
                  - role: user
                    content: 오늘 날씨가 좋네요. 가볍게 대화해봐요.
                  max_tokens: 256
                  temperature: 0.8
                  top_p: 0.9
              json_object:
                summary: JSON mode (json_object)
                value:
                  model: local-main
                  messages:
                  - role: system
                    content: You are a helpful assistant. Always respond with valid
                      JSON only.
                  - role: user
                    content: Return a JSON object with keys 'name' and 'score'. Name
                      is 'test', score is 42.
                  response_format:
                    type: json_object
                  max_tokens: 128
                  temperature: 0
              with_tools:
                summary: Tool calling (함수 호출)
                value:
                  model: local-main
                  messages:
                  - role: user
                    content: 서울의 현재 날씨가 어때요?
                  tools:
                  - type: function
                    function:
                      name: get_weather
