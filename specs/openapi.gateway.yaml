                    - local-embed
                  query:
                    type: string
                  score_mode:
                    type: string
                    enum:
                    - dense_cosine
                  results:
                    type: array
                    minItems: 0
                    items:
                      type: object
                      required:
                      - index
                      - document
                      - score
                      additionalProperties: false
                      properties:
                        index:
                          type: integer
                          minimum: 0
                        document:
                          type: string
                        score:
                          type: number
