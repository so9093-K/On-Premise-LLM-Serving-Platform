openapi: 3.1.0
info:
  title: AI Model Serving Gateway
  description: '

    ## 빠른 시작


    1. `/health` — Gateway process liveness 확인

    2. `/ready` — vLLM, Risk Adapter 전체 dependency readiness 확인

    3. `/v1/models` — 사용 가능한 logical model id, capability, 사용자 조정 가능 parameter 확인

    4. `/v1/chat/completions`, `/v1/embeddings`, `/v1/risk/*` — 실제 요청 호출


    **Streaming:** `stream: true`를 추가하면 `text/event-stream` SSE로 응답한다. curl에서는 `-N`
    옵션이 필요하다. proxy를 거칠 경우 `proxy_buffering off` 설정이 필요하다.


    ## 사용자 조정 가능 파라미터


    `/v1/models`의 각 item은 `request_parameters`를 포함합니다. 클라이언트 UI는 이 값을 읽어 모델별 입력 폼을
    동적으로 구성할 수 있습니다.


    - `local-main`: `temperature`, `max_tokens`, `top_p`, `top_k`, `min_p`, penalty,
    `seed`, `n`, tool 관련 parameter를 Gateway 제약 안에서 조정할 수 있습니다. `stream=true`는 vLLM
    SSE 응답을 Gateway가 실시간 relay하는 fast path로 지원합니다.

    - `local-embed`: `dimensions`, `encoding_format`, `truncate_prompt_tokens`를 조정할
    수 있습니다.

    - `risk-prompt`: 사용자가 조정할 수 있는 sampling parameter는 없습니다. risk API는 `prompt` 입력만
    받고 detector 호출 parameter는 adapter가 고정합니다.


    ## Readiness


    - **HTTP 200** + `status: ready` — 모든 dependency 준비 완료, serving 가능

    - **HTTP 503** + `status: not_ready` — 로딩 중 또는 일부 dependency 불가 (`not_ready_dependencies`
    필드 참고)

    '
  contact:
    name: AI Model Serving Platform 운영
  version: 0.0.1
paths:
  /health:
    get:
      tags:
      - Operations
      summary: Liveness 확인
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /ready:
    get:
      tags:
      - Operations
      summary: Dependency readiness 확인
      description: 내부 readiness endpoint입니다. Gateway가 의존하는 vLLM runtime과 Risk Adapter의
        준비 상태를 확인합니다. 모델 로딩 중에는 HTTP 503을 반환하며, body의 `not_ready_dependencies`에 아직
        준비되지 않은 dependency 목록과 `message`가 포함됩니다.
      operationId: ready_ready_get
      responses:
        '200':
          description: 모든 dependency 준비 완료
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: ReadinessResponse
                type: object
                required:
                - status
                - service
                - phase
                - not_ready_dependencies
                - dependencies
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum:
                    - ready
                    - degraded
                    - not_ready
                  service:
                    type: string
                    minLength: 1
                  phase:
                    type: string
                    enum:
                    - serving
                    - waiting_for_dependencies
                  not_ready_dependencies:
                    type: array
                    items:
                      type: string
                      minLength: 1
                  dependencies:
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      - status
                      additionalProperties: false
                      properties:
                        name:
                          type: string
                          minLength: 1
                        status:
                          type: string
                          enum:
                          - ready
                          - degraded
                          - not_ready
                          - unknown
                        endpoint:
                          type:
                          - string
                          - 'null'
                        message:
                          type:
                          - string
                          - 'null'
              example:
                status: ready
                service: gateway
                phase: serving
                not_ready_dependencies: []
                dependencies:
                - name: main_llm_vllm
                  status: ready
                  endpoint: http://main-llm-vllm:9401/v1/models
                - name: embedding_vllm
                  status: ready
                  endpoint: http://embedding-vllm:9402/v1/models
                - name: risk_adapter
                  status: ready
                  endpoint: http://risk-adapter:9405/ready
        '401':
          description: Admin Bearer token 필요
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: CommonErrorResponse
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    - retryable
                    - request_id
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        enum:
                        - VALIDATION_ERROR
                        - UNAUTHORIZED
                        - FORBIDDEN
                        - NOT_FOUND
                        - MODEL_UNAVAILABLE
                        - UPSTREAM_TIMEOUT
                        - UPSTREAM_ERROR
                        - UPSTREAM_SCHEMA_ERROR
                        - RATE_LIMITED
                        - PARSE_ERROR
                        - INTERNAL_ERROR
                        - QUEUE_TIMEOUT
                        - CIRCUIT_OPEN
                        - REQUEST_TOO_LARGE
                        - RUNTIME_NOT_READY
                      message:
                        type: string
                      retryable:
                        type: boolean
                      request_id:
                        type: string
        '503':
          description: 일부 dependency 로딩 중 또는 불가
          content:
            application/json:
              example:
                status: not_ready
                service: gateway
                phase: waiting_for_dependencies
                not_ready_dependencies:
                - risk_adapter
                dependencies:
                - name: main_llm_vllm
                  status: ready
                  endpoint: http://main-llm-vllm:9401/v1/models
                - name: risk_adapter
                  status: not_ready
                  endpoint: http://risk-adapter:9405/ready
                  message: 'waiting for risk adapter dependencies: risk_prompt_vllm'
      security:
      - adminBearerAuth: []
      x-response-contract-schema: readiness_response.schema.json
  /metrics:
    get:
      tags:
      - Monitoring
      summary: Prometheus metrics 조회
      description: Prometheus가 scrape하는 Gateway metric 엔드포인트입니다. 운영 환경에서는 admin token
        또는 내부망으로 보호합니다.
      operationId: metrics_endpoint_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: Admin Bearer token 필요
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: CommonErrorResponse
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    - retryable
                    - request_id
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        enum:
                        - VALIDATION_ERROR
                        - UNAUTHORIZED
                        - FORBIDDEN
                        - NOT_FOUND
                        - MODEL_UNAVAILABLE
                        - UPSTREAM_TIMEOUT
                        - UPSTREAM_ERROR
                        - UPSTREAM_SCHEMA_ERROR
                        - RATE_LIMITED
                        - PARSE_ERROR
                        - INTERNAL_ERROR
                        - QUEUE_TIMEOUT
                        - CIRCUIT_OPEN
                        - REQUEST_TOO_LARGE
                        - RUNTIME_NOT_READY
                      message:
                        type: string
                      retryable:
                        type: boolean
                      request_id:
                        type: string
      security:
      - adminBearerAuth: []
  /v1/models:
    get:
      tags:
      - Models
      summary: 사용 가능한 모델 목록
      description: Gateway가 외부 호출자에게 노출하는 logical model id, capability, 사용자 조정 가능
        request parameter 목록입니다. catalog 성격의 엔드포인트이므로 vLLM 로딩 상태와 무관하게 항상 목록을 반환합니다.
        현재 serving 가능 여부는 `/ready`의 `status`와 `not_ready_dependencies`를 확인하세요. 클라이언트
        UI는 각 item의 `request_parameters`를 읽어 모델별 입력 form을 구성할 수 있습니다.
      operationId: models_v1_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: GatewayModelListResponse
                type: object
                required:
                - object
                - data
                additionalProperties: false
                properties:
                  object:
                    const: list
                  data:
                    type: array
                    minItems: 3
                    items:
                      type: object
                      required:
                      - id
                      - object
                      - backend
                      - capabilities
                      - request_parameters
                      additionalProperties: true
                      properties:
                        id:
                          enum:
                          - local-main
                          - local-embed
                          - risk-prompt
                        object:
                          const: model
                        backend:
                          type: string
                          minLength: 1
                        capabilities:
                          type: array
                          minItems: 1
                          items:
                            enum:
                            - chat.completions
                            - chat.completions.vision
                            - chat.completions.tools
                            - embeddings
                            - risk.prompt_attack_signal
                        request_parameters:
                          type: object
                          description: 모델별 사용자 조정 가능 request parameter와 제약 조건입니다.
                            prompt/messages/input 같은 필수 입력 본문은 여기에 포함하지 않습니다.
                          additionalProperties:
                            type: object
                            additionalProperties: true
                        fixed_parameters:
                          type: object
                          description: 사용자 요청에는 노출하지 않고 adapter/runtime이 고정하는 내부 parameter입니다.
                          additionalProperties: true
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: CommonErrorResponse
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    - retryable
                    - request_id
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        enum:
                        - VALIDATION_ERROR
                        - UNAUTHORIZED
                        - FORBIDDEN
                        - NOT_FOUND
                        - MODEL_UNAVAILABLE
                        - UPSTREAM_TIMEOUT
                        - UPSTREAM_ERROR
                        - UPSTREAM_SCHEMA_ERROR
                        - RATE_LIMITED
                        - PARSE_ERROR
                        - INTERNAL_ERROR
                        - QUEUE_TIMEOUT
                        - CIRCUIT_OPEN
                        - REQUEST_TOO_LARGE
                        - RUNTIME_NOT_READY
                      message:
                        type: string
                      retryable:
                        type: boolean
                      request_id:
                        type: string
      security:
      - bearerAuth: []
      x-response-contract-schema: model_list_response.schema.json
  /v1/chat/completions:
    post:
      tags:
      - Chat
      summary: Chat completion 생성
      description: '`local-main`을 통해 chat completion을 생성합니다. Gateway가 model id, 입력
        modality, 최대 토큰 수, tool-call 지원 범위를 먼저 검증합니다. stream=true 요청은 vLLM SSE chunk를
        버퍼링하지 않고 text/event-stream으로 즉시 relay합니다. OpenAI 호환 형식을 따르며, 지원하지 않는 파라미터는
        Gateway contract에서 차단합니다.'
      operationId: chat_completions_v1_chat_completions_post
      requestBody:
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              title: GatewayChatCompletionRequest
              type: object
              required:
              - model
              - messages
              additionalProperties: false
              properties:
                model:
                  const: local-main
                messages:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                    - role
                    additionalProperties: false
                    properties:
                      role:
                        type: string
                        enum:
                        - system
                        - user
                        - assistant
                        - tool
                      content:
                        oneOf:
                        - type: string
                        - type: 'null'
                        - type: array
                          minItems: 1
                          items:
                            oneOf:
                            - type: object
                              required:
                              - type
                              - text
                              additionalProperties: false
                              properties:
                                type:
                                  const: text
                                text:
                                  type: string
                            - type: object
                              required:
                              - type
                              - image_url
                              additionalProperties: false
                              properties:
                                type:
                                  const: image_url
                                image_url:
                                  type: object
                                  required:
                                  - url
                                  additionalProperties: false
                                  properties:
                                    url:
                                      type: string
                                      pattern: ^data:image/(png|jpeg|webp);base64,
                                    detail:
                                      type: string
                                      enum:
                                      - auto
                                      - low
                                      - high
                      tool_calls:
                        type: array
                        minItems: 1
                        items:
                          type: object
                          required:
                          - id
                          - type
                          - function
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              minLength: 1
                            type:
                              const: function
                            function:
                              type: object
                              required:
                              - name
                              - arguments
                              additionalProperties: false
                              properties:
                                name:
                                  type: string
                                  minLength: 1
                                arguments:
                                  type: string
                      tool_call_id:
                        type: string
                        minLength: 1
                      name:
                        type: string
                        minLength: 1
                temperature:
                  type: number
                  minimum: 0
                  maximum: 2
                max_tokens:
                  type: integer
                  minimum: 1
                  maximum: 1024
                top_p:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 1
                top_k:
                  type: integer
                  minimum: -1
                min_p:
                  type: number
                  minimum: 0
                  maximum: 1
                presence_penalty:
                  type: number
                  minimum: -2
                  maximum: 2
                frequency_penalty:
                  type: number
                  minimum: -2
                  maximum: 2
                repetition_penalty:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 2
                seed:
                  type: integer
                  minimum: 0
                n:
                  type: integer
                  minimum: 1
                  maximum: 1
                stop:
                  oneOf:
                  - type: string
                  - type: array
                    minItems: 1
                    maxItems: 8
                    items:
                      type: string
                stream:
                  type: boolean
                  description: When true, Gateway relays the upstream vLLM/OpenAI-compatible
                    SSE response as text/event-stream without buffering or rewriting
                    standard chat.completion.chunk events.
                stream_options:
                  type: object
                  description: OpenAI-compatible streaming options. include_usage
                    asks the upstream to include a final usage chunk when supported.
                  additionalProperties: false
                  properties:
                    include_usage:
                      type: boolean
                tools:
                  type: array
                  minItems: 1
                  maxItems: 16
                  items:
                    type: object
                    required:
                    - type
                    - function
                    additionalProperties: false
                    properties:
                      type:
                        const: function
                      function:
                        type: object
                        required:
                        - name
                        additionalProperties: false
                        properties:
                          name:
                            type: string
                            minLength: 1
                            maxLength: 64
                          description:
                            type: string
                          parameters:
                            type: object
                          strict:
                            type: boolean
                tool_choice:
                  oneOf:
                  - type: string
                    enum:
                    - auto
                    - none
                    - required
                  - type: object
                    required:
                    - type
                    - function
                    properties:
                      type:
                        const: function
                      function:
                        type: object
                        required:
                        - name
                        properties:
                          name:
                            type: string
                            minLength: 1
                        additionalProperties: false
                    additionalProperties: false
                parallel_tool_calls:
                  type: boolean
                  const: false
              $defs:
                tool:
                  type: object
                  required:
                  - type
                  - function
                  additionalProperties: false
                  properties:
                    type:
                      const: function
                    function:
                      type: object
                      required:
                      - name
                      additionalProperties: false
                      properties:
                        name:
                          type: string
                          minLength: 1
                          maxLength: 64
                        description:
                          type: string
                        parameters:
                          type: object
                        strict:
                          type: boolean
                tool_call:
                  type: object
                  required:
                  - id
                  - type
                  - function
                  additionalProperties: false
                  properties:
                    id:
                      type: string
                      minLength: 1
                    type:
                      const: function
                    function:
                      type: object
                      required:
                      - name
                      - arguments
                      additionalProperties: false
                      properties:
                        name:
                          type: string
                          minLength: 1
                        arguments:
                          type: string
              allOf:
              - if:
                  required:
                  - stream_options
                then:
                  required:
                  - stream
                  properties:
                    stream:
                      const: true
            examples:
              basic:
                summary: 기본 요청
                value:
                  model: local-main
                  messages:
                  - role: user
                    content: 안녕하세요. 간단히 자기소개를 해주세요.
                  max_tokens: 512
                  temperature: 0.7
              streaming:
                summary: 스트리밍 요청 (stream=true)
                value:
                  model: local-main
                  messages:
                  - role: user
                    content: 안녕하세요.
                  stream: true
              streaming_with_usage:
                summary: 스트리밍 + usage 추적
                value:
                  model: local-main
                  messages:
                  - role: user
                    content: 안녕하세요.
                  stream: true
                  stream_options:
                    include_usage: true
              with_system_prompt:
                summary: 시스템 프롬프트 + 샘플링 파라미터
                value:
                  model: local-main
                  messages:
                  - role: system
                    content: You are a helpful assistant. Answer concisely in Korean.
                  - role: user
                    content: 오늘 날씨가 좋네요. 가볍게 대화해봐요.
                  max_tokens: 256
                  temperature: 0.8
                  top_p: 0.9
              with_tools:
                summary: Tool calling (함수 호출)
                value:
                  model: local-main
                  messages:
                  - role: user
                    content: 서울의 현재 날씨가 어때요?
                  tools:
                  - type: function
                    function:
                      name: get_weather
                      description: 특정 위치의 날씨 정보를 조회합니다.
                      parameters:
                        type: object
                        properties:
                          location:
                            type: string
                            description: '도시 이름 (예: 서울)'
                        required:
                        - location
                  tool_choice: auto
              with_image:
                summary: Vision 요청 (이미지 + 텍스트)
                value:
                  model: local-main
                  messages:
                  - role: user
                    content:
                    - type: text
                      text: 이 이미지가 무엇인지 설명해주세요.
                    - type: image_url
                      image_url:
                        url: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI6QAAAABJRU5ErkJggg==
                  max_tokens: 256
        required: true
      responses:
        '200':
          description: Main LLM runtime에서 반환한 OpenAI 호환 chat completion 응답. stream=true일
            때는 text/event-stream SSE 응답을 반환한다.
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: GatewayChatCompletionResponse
                type: object
                required:
                - id
                - object
                - created
                - model
                - choices
                additionalProperties: true
                properties:
                  id:
                    type: string
                    minLength: 1
                  object:
                    const: chat.completion
                  created:
                    type: integer
                    minimum: 0
                  model:
                    const: local-main
                  choices:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      required:
                      - index
                      - message
                      - finish_reason
                      additionalProperties: true
                      properties:
                        index:
                          type: integer
                          minimum: 0
                        message:
                          type: object
                          required:
                          - role
                          additionalProperties: true
                          properties:
                            role:
                              const: assistant
                            content:
                              type:
                              - string
                              - 'null'
                            tool_calls:
                              type: array
                              minItems: 1
                              items:
                                type: object
                                required:
                                - id
                                - type
                                - function
                                additionalProperties: false
                                properties:
                                  id:
                                    type: string
                                    minLength: 1
                                  type:
                                    const: function
                                  function:
                                    type: object
                                    required:
                                    - name
                                    - arguments
                                    additionalProperties: false
                                    properties:
                                      name:
                                        type: string
                                        minLength: 1
                                      arguments:
                                        type: string
                        finish_reason:
                          type:
                          - string
                          - 'null'
                  usage:
                    type: object
            text/event-stream:
              schema:
                type: string
                description: 'OpenAI-compatible SSE stream. On streaming transport
                  failures, Gateway emits an SSE error event followed by data: [DONE].'
        '401':
          description: API Bearer token 필요
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: CommonErrorResponse
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    - retryable
                    - request_id
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        enum:
                        - VALIDATION_ERROR
                        - UNAUTHORIZED
                        - FORBIDDEN
                        - NOT_FOUND
                        - MODEL_UNAVAILABLE
                        - UPSTREAM_TIMEOUT
                        - UPSTREAM_ERROR
                        - UPSTREAM_SCHEMA_ERROR
                        - RATE_LIMITED
                        - PARSE_ERROR
                        - INTERNAL_ERROR
                        - QUEUE_TIMEOUT
                        - CIRCUIT_OPEN
                        - REQUEST_TOO_LARGE
                        - RUNTIME_NOT_READY
                      message:
                        type: string
                      retryable:
                        type: boolean
                      request_id:
                        type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: CommonErrorResponse
                type: object
                required:
                - error
                additionalProperties: false
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    - retryable
                    - request_id
                    additionalProperties: false
                    properties:
                      code:
                        type: string
                        enum:
                        - VALIDATION_ERROR
                        - UNAUTHORIZED
                        - FORBIDDEN
                        - NOT_FOUND
                        - MODEL_UNAVAILABLE
                        - UPSTREAM_TIMEOUT
                        - UPSTREAM_ERROR
                        - UPSTREAM_SCHEMA_ERROR
                        - RATE_LIMITED
                        - PARSE_ERROR
                        - INTERNAL_ERROR
