  /admin/runtimes:
    get:
      tags:
      - Runtime Control
      summary: 런타임 상태 조회
      description: '공유 GPU 예산 위의 모든 vLLM 런타임(보조: embedding, embedding_ko, risk_prompt;
        메인: `local-main`)의 현재 상태와 VRAM 점유를 반환합니다.


        `state`: 런타임 상태 — `active`(서비스 중) / `stopped`(컨테이너 중지, VRAM 회수) / `starting`(전환
        중, 일시적).


        `vram_fraction`: 각 런타임의 GPU VRAM 점유율(gpu_memory_utilization).


        `budget`: `{ceiling, used, free}` — 활성 런타임 점유율 합과 천장.


        `container_status`: 실제 Docker 컨테이너 상태(참고용). 정지/시작은 보조·메인 모두 `PATCH /admin/runtimes/{service_key}`(메인은
        `service_key=main`)로, 메인 프로필 교체만 `POST /admin/main-model/switch`로 수행합니다.'
      operationId: listRuntimes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
              examples:
                all_active:
                  summary: 전체 활성
                  value:
                    runtimes:
                    - service_key: embedding
                      container: embedding-vllm
                      state: active
                      container_status: running
                      vram_fraction: 0.04
                      criticality: retrieval_support_path
                    - service_key: embedding_ko
                      container: embedding-ko-vllm
                      state: active
                      container_status: running
                      vram_fraction: 0.06
                      criticality: retrieval_support_path
                    - service_key: risk_prompt
                      container: risk-prompt-vllm
                      state: active
                      container_status: running
                      vram_fraction: 0.065
                      criticality: risk_signal_path
                    - service_key: main
                      container: main-llm-vllm
                      state: active
                      container_status: running
                      vram_fraction: 0.76
                      criticality: primary_user_path
                      gate: open
                      active_profile: gemma4-26b-a4b-fp8
                    budget:
                      ceiling: 0.93
                      used: 0.925
                      free: 0.005
                mixed_state:
                  summary: 중지/시작 중 포함
                  value:
                    runtimes:
                    - service_key: embedding
                      container: embedding-vllm
                      state: stopped
                      container_status: exited
                      vram_fraction: 0.04
                      criticality: retrieval_support_path
                    - service_key: risk_prompt
                      container: risk-prompt-vllm
                      state: active
                      container_status: running
                      vram_fraction: 0.065
                      criticality: risk_signal_path
                    - service_key: main
                      container: main-llm-vllm
                      state: stopped
                      container_status: exited
                      vram_fraction: 0.76
                      criticality: primary_user_path
                      gate: closed
                      active_profile: gemma4-26b-a4b-fp8
                    budget:
                      ceiling: 0.93
                      used: 0.065
                      free: 0.865
        '401':
          description: Admin Bearer token 필요
          content:
            application/json:
              schema:
                $ref: ./schemas/common_error.schema.json
      security:
      - adminBearerAuth: []
  /admin/runtimes/{service_key}:
    patch:
      tags:
      - Runtime Control
      summary: 런타임 상태 전환
      description: '`desired_state`에 지정한 목표 상태로 런타임을 전환합니다. `service_key`는 보조 런타임(embedding,
        embedding_ko, risk_prompt)과 메인 모델(`main`)을 모두 받습니다 — 함대 전체를 같은 동사로 제어합니다.


        - **`active`** — 컨테이너를 시작하고 gateway 라우팅을 복구합니다. 이미 `active`면 no-op.

        - **`stopped`** — 컨테이너를 중지하고 GPU VRAM을 회수합니다. 이미 `stopped`면 no-op.


        `main`은 정지 시 드레인 후 gate를 닫고, 시작 시 GPU 예산 admission과 canary 검증을 거칩니다(프로필 교체는
        `POST /admin/main-model/switch`).


        GPU 예산을 초과하면 409와 정지 계획(`plan.stop`)을 반환하며, `force: true`로 우선순위 낮은 보조를 자동
        축출할 수 있습니다. Scalar UI 드롭다운에서 선택 후 Execute만 누르면 됩니다.'
      operationId: transitionRuntime
      security:
      - adminBearerAuth: []
      parameters:
      - name: service_key
        in: path
        required: true
        schema:
          type: string
          title: Service Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
              examples:
                to_stopped:
                  summary: 보조 중지 (VRAM 회수)
                  value:
                    service_key: embedding_ko
                    state: stopped
                    containers_stopped:
                    - embedding-ko-vllm
                to_stopped_prereq:
                  summary: 보조 중지 — 실제 컨테이너 상태 재확인
                  value:
                    service_key: risk_prompt
                    state: stopped
                    containers_stopped:
                    - risk-prompt-vllm
                to_active:
                  summary: 보조 시작 (서비스 복구)
                  value:
                    service_key: embedding_ko
                    state: active
                    containers_started:
                    - embedding-ko-vllm
                to_active_prereq:
                  summary: 보조 시작 — 선행 컨테이너 포함
                  value:
                    service_key: risk_prompt
                    state: active
                    containers_started:
                    - embedding-vllm
                    - risk-prompt-vllm
                noop:
                  summary: 이미 목표 상태 (no-op)
                  value:
                    service_key: embedding
                    state: active
                    changed: false
                main_stopped:
                  summary: 메인 정지 (key=main, VRAM 회수)
                  value:
                    service_key: main
                    state: stopped
                    evicted: []
                main_active:
                  summary: 메인 시작 (key=main)
                  value:
                    service_key: main
                    state: active
                    evicted: []
                main_active_force:
                  summary: 메인 시작 + 보조 축출 (force)
                  value:
                    service_key: main
                    state: active
                    evicted:
                    - risk-prompt-vllm
                    - embedding-ko-vllm
        '404':
          content:
            application/json:
              example:
                error:
                  code: NOT_FOUND
                  message: 'runtime endpoint not found: embedding_ko'
                  retryable: false
                  request_id: req_00000000000000000000000000000000
          description: Not Found
        '409':
          description: GPU 예산 초과. 표준 error.code=GPU_BUDGET_EXCEEDED와 error.details.plan.stop을
            반환한다. force=true로 자동 축출.
          content:
            application/json:
              examples:
                budget_exceeded:
                  summary: GPU 예산 초과 + 정지 계획
                  value:
                    error:
                      code: GPU_BUDGET_EXCEEDED
                      message: GPU budget does not allow this activation.
                      retryable: false
                      request_id: req_00000000000000000000000000000000
                      details:
                        feasible: true
                        required: 0.85
                        available: 0.765
                        ceiling: 0.93
                        plan:
                          stop:
                          - risk-prompt-vllm
                          - embedding-ko-vllm
        '503':
          content:
            application/json:
              examples:
                no_sidecar:
                  summary: sidecar 미설정
                  value:
                    detail: admin sidecar is not configured (ADMIN_SIDECAR_URL missing)
                sidecar_unavailable:
                  summary: sidecar 연결 실패
                  value:
                    error:
                      code: MAIN_MODEL_CONTROL_UNAVAILABLE
                      message: 'sidecar unavailable: Connection refused http://admin-sidecar:8080'
                      retryable: true
                      request_id: req_00000000000000000000000000000000
                in_progress:
                  summary: 전환 중 (재시도 가능)
                  value:
                    detail: runtime is currently starting; wait and retry
              schema:
                $ref: ./schemas/common_error.schema.json
          description: Service Unavailable
        '401':
          description: Admin Bearer token 필요
          content:
            application/json:
              schema:
                $ref: ./schemas/common_error.schema.json
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: ./schemas/common_error.schema.json
        '413':
          description: 요청 body가 너무 큼
          content:
            application/json:
              schema:
                $ref: ./schemas/common_error.schema.json
        '429':
          description: Upstream rate limit 또는 local admission timeout
          content:
            application/json:
              schema:
                $ref: ./schemas/common_error.schema.json
        '500':
          description: 내부 서버 오류
          content:
            application/json:
              schema:
                $ref: ./schemas/common_error.schema.json
        '502':
          description: Upstream 오류 또는 유효하지 않은 upstream 응답
          content:
            application/json:
              schema:
                $ref: ./schemas/common_error.schema.json
        '504':
          description: Upstream timeout
          content:
            application/json:
              schema:
                $ref: ./schemas/common_error.schema.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - desired_state
              properties:
                desired_state:
                  type: string
                  enum:
                  - active
                  - stopped
                  description: '목표 상태: active(서비스 시작) 또는 stopped(컨테이너 중지, VRAM 회수)'
                force:
                  type: boolean
                  default: false
                  description: active 전환 시 GPU 예산이 부족하면 우선순위가 낮은 런타임을 자동 정지해 공간을 확보합니다.
                    기본값은 false로, 부족하면 409와 정지 계획을 반환합니다.
            examples:
              to_stopped:
                summary: 중지 (VRAM 회수)
                value:
                  desired_state: stopped
              to_active:
                summary: 시작 (서비스 복구)
                value:
                  desired_state: active
              to_active_force:
                summary: 시작 + 자동 축출
                value:
                  desired_state: active
                  force: true
  /admin/main-model:
    get:
      tags:
      - Runtime Control
      summary: 활성 메인 모델 조회
      description: 'control-plane ledger가 기록한 상태와 Docker에서 방금 관측한 실제 런타임을 함께 반환합니다.
        메인 모델을 디버깅할 때 가장 먼저 보는 엔드포인트입니다.


        - `active_profile` — 지금 `local-main`으로 서빙 중인 프로필 전체(`capabilities.deployed_input`,
        `gateway_policy` 포함). chat 요청 검증에 실제로 적용되는 값이 이것입니다.

        - `gate` — `open`이면 요청을 받고, `closed`면 전환·정지 중이라 `/v1/chat/completions`가 `503
        MAIN_MODEL_SWITCH_IN_PROGRESS` + `Retry-After`로 fail-closed 응답합니다.

        - `runtime_state` — ledger가 기록한 목표 상태(`active` / `stopped`).

        - `last_operation` — 가장 최근 전환 작업 요약(`status`, `stage`, `error`).

        - `observed_runtime` — Docker inspect 결과(`container_state`, `health`, `observed_at`).
        ledger와 어긋나면 drift이며, 이 값이 `null`이면 관측 자체가 실패한 것입니다.


        Docker 관측은 이 라우트에서만 수행합니다. 요청 경로(`/v1/chat/completions`, `/v1/models`)는 ledger만
        읽으므로 추론이 Docker daemon 상태에 묶이지 않습니다.'
      operationId: getMainModel
      responses:
