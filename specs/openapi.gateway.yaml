  /v1/retrieval/rerank:
    post:
      tags:
      - Retrieval
      summary: 문서 관련도 재순위 정렬
      description: 'query와 documents 목록을 받아 관련도 점수로 내림차순 정렬한 결과를 반환합니다.


        - `score_mode=dense_cosine` — `local-embed-ko` 기본, `local-embed`도 명시 사용 가능


        모델이 요청한 `score_mode`를 지원하지 않으면 422를 반환합니다. `top_n`은 상위 n개만 반환합니다(1–32).'
      operationId: rerankDocuments
      requestBody:
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              title: GatewayRetrievalRerankRequest
              type: object
              required:
              - query
              - documents
              additionalProperties: false
              properties:
                model:
                  type: string
                  enum:
                  - local-embed-ko
                  - local-embed
                query:
                  type: string
                  minLength: 1
                documents:
                  type: array
                  minItems: 1
                  maxItems: 32
                  items:
                    type: string
                    minLength: 1
                score_mode:
                  type: string
                  enum:
                  - dense_cosine
                top_n:
                  type: integer
                  minimum: 1
                  maximum: 32
                truncate_prompt_tokens:
                  type: integer
                  oneOf:
                  - const: -1
                  - minimum: 1
                    maximum: 2048
            examples:
              dense_rerank:
                summary: Dense cosine 재순위 정렬
                value:
                  model: local-embed-ko
                  query: 검색어
                  documents:
                  - 문서1
                  - 문서2
        required: true
      responses:
