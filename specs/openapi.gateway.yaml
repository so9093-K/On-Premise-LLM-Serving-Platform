  /v1/risk/detectors/pii/assessments:
    post:
      tags:
      - Risk
      summary: PII Protection 탐지 신호
      description: '**PII Protection detector** — Presidio Analyzer(optional) + Korean
        custom recognizer 기반 로컬 탐지.


        탐지 코드:

        - **D1** Personal Identifier: KR_RRN, KR_FRN, KR_PASSPORT, KR_DRIVER_LICENSE,
        PERSON

        - **D2** Contact and Location: EMAIL_ADDRESS, PHONE_NUMBER, ADDRESS

        - **D3** Financial Identifier: CREDIT_CARD

        - **D5** Network/Infrastructure: IP_ADDRESS, URL


        원문 PII 값은 응답에 포함되지 않습니다. `span_count`로 entity별 탐지 개수를 제공합니다.

        탐지 결과는 최종 정책 판단이 아닌 진단 signal로 취급합니다.'
      operationId: assessPIIRisk
      requestBody:
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              title: RiskAssessmentRequest
              type: object
              additionalProperties: false
              required:
              - prompt
              properties:
                prompt:
                  type: string
                  minLength: 1
                  maxLength: 20000
            examples:
              email_and_phone:
                summary: 이메일·전화번호 노출 (D2)
                value:
                  prompt: 담당자 이메일은 hong@example.com이고 연락처는 010-1234-5678입니다.
              korean_rrn:
                summary: 주민등록번호 노출 (D1)
                value:
                  prompt: '주민등록번호: 901201-1234567 로 조회해주세요.'
              credit_card:
                summary: 신용카드 번호 노출 (D3)
                value:
                  prompt: 카드 번호 4111-1111-1111-1111 로 결제해주세요.
              ip_address:
                summary: IP 주소 노출 (D5)
                value:
                  prompt: 서버 IP 192.168.1.100에 접속하세요.
              safe:
                summary: PII 없음 (safe)
                value:
                  prompt: 오늘 날씨가 맑습니다.
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                title: RiskAssessmentResponse
                type: object
                additionalProperties: false
                required:
                - assessment_id
                - status
                - risk_detected
                - attention_required
                - model_risk_detected
                - system_signal_detected
                - assessment_complete
                - strongest_code
                - message
                - categories
                - system_signals
                properties:
                  assessment_id:
                    type: string
                    minLength: 1
                  status:
                    enum:
                    - completed
                    - partial
                    - failed
                  risk_detected:
                    type: boolean
                  attention_required:
                    type: boolean
                  model_risk_detected:
                    type: boolean
                  system_signal_detected:
                    type: boolean
                  assessment_complete:
                    type: boolean
                  strongest_code:
                    type:
                    - string
                    - 'null'
                    pattern: ^(A[12]|I[1-4]|D[1-5]|PARSE_ERROR|INFERENCE_ERROR|INFERENCE_TIMEOUT|TRUNCATED_INPUT|INFERENCE_QUEUE_TIMEOUT|GPU_MEMORY_PRESSURE)$
                  message:
                    type: string
                  categories:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - code
                      - family
                      - detected
                      - confidence
                      properties:
                        code:
                          type:
                          - string
                          - 'null'
                          pattern: ^(A[12]|I[1-4]|D[1-5])$
                        family:
                          type: string
                          enum:
                          - prompt_attack
                          - policy_risk
                          - data_exposure
                        detected:
                          type: boolean
                        confidence:
                          type:
                          - number
                          - 'null'
                          minimum: 0
                          maximum: 1
                        source_model:
                          type:
                          - string
                          - 'null'
                        label:
                          type:
                          - string
                          - 'null'
                        span_count:
                          type:
                          - integer
                          - 'null'
                          minimum: 0
                      allOf:
                      - if:
                          properties:
                            code:
                              type: string
                              pattern: ^A[12]$
                          required:
                          - code
                        then:
                          properties:
                            family:
                              const: prompt_attack
                      - if:
                          properties:
                            code:
                              type: string
                              pattern: ^I[1-4]$
                          required:
                          - code
                        then:
                          properties:
                            family:
                              const: policy_risk
                      - if:
                          properties:
                            code:
                              type: string
                              pattern: ^D[1-5]$
                          required:
                          - code
                        then:
                          properties:
                            family:
                              const: data_exposure
                  system_signals:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - code
                      - detected
                      - retryable
                      properties:
                        code:
                          type: string
                          enum:
                          - PARSE_ERROR
                          - INFERENCE_ERROR
                          - INFERENCE_TIMEOUT
                          - TRUNCATED_INPUT
                          - INFERENCE_QUEUE_TIMEOUT
                          - GPU_MEMORY_PRESSURE
                        detected:
                          type: boolean
                        retryable:
                          type: boolean
                        message:
                          type:
                          - string
                          - 'null'
                        source:
                          type:
                          - string
                          - 'null'
                not:
                  anyOf:
                  - required:
                    - allow
                  - required:
                    - review
                  - required:
                    - block
                  - required:
                    - decision
                  - required:
                    - action
                  - required:
                    - safe_to_send
                  - required:
                    - final_decision
                  - required:
                    - final_decision_owner
                  - required:
                    - policy_overrides
                allOf:
                - if:
                    properties:
                      status:
                        const: completed
                    required:
                    - status
                  then:
                    properties:
                      assessment_complete:
                        const: true
                - if:
                    properties:
                      status:
                        enum:
                        - partial
                        - failed
                    required:
                    - status
                  then:
                    properties:
                      assessment_complete:
                        const: false
                - if:
                    properties:
                      risk_detected:
                        const: true
                    required:
                    - risk_detected
                  then:
                    properties:
                      categories:
                        contains:
                          type: object
                          properties:
                            detected:
                              const: true
                          required:
                          - detected
                - if:
                    properties:
                      model_risk_detected:
                        const: true
                    required:
                    - model_risk_detected
                  then:
                    properties:
                      categories:
                        contains:
                          type: object
                          properties:
                            detected:
                              const: true
                          required:
                          - detected
                - if:
                    properties:
                      system_signal_detected:
                        const: true
                    required:
                    - system_signal_detected
                  then:
                    properties:
                      system_signals:
                        contains:
                          type: object
                          properties:
                            detected:
                              const: true
                          required:
                          - detected
