tags:
- name: Operations
  description: '`/health`는 process liveness, `/ready`는 vLLM과 Risk Adapter 전체 dependency
    상태를 확인합니다.'
- name: Monitoring
  description: Prometheus scrape용 metric 엔드포인트입니다. 운영 환경에서는 admin token 또는 내부망으로 보호합니다.
- name: Models
  description: Gateway가 외부 호출자에게 노출하는 logical model catalog입니다. `/v1/models` 응답은 모델별
    `capabilities`와 사용자 조정 가능 `request_parameters`를 함께 제공합니다.
- name: Chat
  description: OpenAI 호환 chat completions API입니다. `stream`, `tools`, structured outputs,
    `reasoning`, `logprobs` 등 고급 기능을 지원합니다.
- name: Embeddings
  description: '`local-embed`와 `local-embed-ko`를 통한 embedding API입니다. 요청 파라미터는 Gateway
    contract로 검증합니다.'
- name: Retrieval
  description: '`local-embed-ko` 기본, `local-embed` 선택 dense cosine 문서 관련도 평가 API입니다.'
- name: Risk
  description: 'signal-only risk assessment API입니다. `allow`, `block`, `decision`,
    `action` 같은 정책 판단 필드는 반환하지 않습니다. 최종 허용·차단 결정은 Gateway 밖 product policy layer가
    담당합니다.


    **Sensitive Data Protection** — PII Protection + Secret Exposure Signal:

    - **PII Protection** (D1-D3, D5): 주민등록번호, 이메일, 전화번호, 신용카드, IP 주소 탐지

    - **Secret Exposure** (D4, D5): API 키, JWT, private key, 비밀번호, DB URL 탐지


    **Prompt detector** (`risk-prompt`) — Prompt Injection / Prompt Leaking 탐지:

    - system/developer instruction 무시 유도

    - 숨겨진 system prompt 출력 요구

    - 역할극(DAN, unrestricted AI 등) jailbreak

    - 문서·웹페이지 안에 숨겨진 간접 prompt injection

    - 연결된 도구로 시크릿·파일·메일 탈취 유도'
