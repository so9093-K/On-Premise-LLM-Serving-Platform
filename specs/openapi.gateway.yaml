components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            properties:
              loc:
                items:
                  anyOf:
                  - type: string
                  - type: integer
                type: array
                title: Location
              msg:
                type: string
                title: Message
              type:
                type: string
                title: Error Type
              input:
                title: Input
              ctx:
                type: object
                title: Context
            type: object
            required:
            - loc
            - msg
            - type
            title: ValidationError
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    adminBearerAuth:
      type: http
      description: /ready, /metrics 같은 운영자 endpoint에 사용하는 admin Bearer token입니다.
      scheme: bearer
    bearerAuth:
      type: http
      description: Gateway API 또는 내부 Risk Adapter 호출에 사용하는 Bearer token입니다.
      scheme: bearer
tags:
- name: Operations
  description: '`/health`는 process liveness, `/ready`는 vLLM과 Risk Adapter 전체 dependency
    상태를 확인합니다.'
- name: Monitoring
  description: Prometheus scrape용 metric 엔드포인트입니다. 운영 환경에서는 admin token 또는 내부망으로 보호합니다.
- name: Models
  description: Gateway가 외부 호출자에게 노출하는 logical model catalog입니다. `/v1/models` 응답은 모델별
    `capabilities`와 사용자 조정 가능 `request_parameters`를 함께 제공합니다.
- name: Chat
  description: '`local-main`을 통한 chat completion API입니다. OpenAI 호환 형식을 따르며, 지원 파라미터는
    Gateway contract로 제한합니다.'
- name: Embeddings
  description: '`local-embed`를 통한 embedding API입니다. 요청 파라미터는 Gateway contract로 검증합니다.'
- name: Risk
  description: 'signal-only risk assessment API입니다. `allow`, `block`, `decision`,
    `action` 같은 정책 판단 필드는 반환하지 않습니다. 최종 허용·차단 결정은 Gateway 밖 product policy layer가
    담당합니다.


    **Prompt detector** (`risk-prompt`) — Prompt Injection / Prompt Leaking 탐지:

    - system/developer instruction 무시 유도

    - 숨겨진 system prompt 출력 요구

    - 역할극(DAN, unrestricted AI 등) jailbreak

    - 문서·웹페이지 안에 숨겨진 간접 prompt injection

    - 연결된 도구로 시크릿·파일·메일 탈취 유도


    `risk-siren`은 retired 상태이며 aggregate는 enabled detector registry 기준으로 동작합니다.'
