    post:
      tags:
      - Embeddings
      summary: Embedding vector 생성
      description: '`local-embed` 및 `local-embed-ko`를 통해 텍스트의 embedding vector를 생성합니다.
        요청 파라미터는 Gateway contract로 검증하며, 지원하지 않는 파라미터는 차단합니다.'
      operationId: createEmbedding
      requestBody:
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              title: GatewayEmbeddingRequest
              type: object
              required:
              - model
              - input
              additionalProperties: false
              properties:
                model:
                  enum:
                  - local-embed
                  - local-embed-ko
                input:
                  oneOf:
                  - type: string
                  - type: array
                    minItems: 1
                    items:
                      type: string
                dimensions:
                  type: integer
                  oneOf:
                  - enum:
                    - 768
                    - 512
                    - 256
                    - 128
                  - const: 1024
                encoding_format:
                  type: string
                  const: float
                truncate_prompt_tokens:
                  type: integer
                  oneOf:
                  - const: -1
                  - minimum: 1
                    maximum: 2048
                user:
                  description: OpenAI API compatibility용 optional 식별자. Gateway에서 accept하되
                    upstream에 전달 여부는 runtime profile에 따른다. metric label로 사용하지 않는다.
                    response에 영향 없음.
                  type: string
              allOf:
              - if:
                  properties:
                    model:
                      const: local-embed-ko
                  required:
                  - model
                then:
                  properties:
                    dimensions:
                      const: 1024
              - if:
                  properties:
                    model:
                      const: local-embed
                  required:
                  - model
                then:
                  properties:
                    dimensions:
                      enum:
                      - 768
                      - 512
                      - 256
                      - 128
            examples:
              basic:
                summary: 기본 요청 (단일 입력)
                value:
                  model: local-embed
                  input:
                  - 임베딩할 텍스트 예시입니다.
              with_dimensions:
                summary: dimension 지정
                value:
                  model: local-embed
                  input:
                  - 임베딩할 텍스트입니다.
                  dimensions: 256
              truncate_prompt_tokens:
                summary: 긴 입력 truncation
                value:
                  model: local-embed
                  input:
                  - 매우 긴 문서 텍스트를 임베딩할 때 truncate_prompt_tokens로 최대 토큰 수를 제한합니다.
                  truncate_prompt_tokens: 512
        required: true
