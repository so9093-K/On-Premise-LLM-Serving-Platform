  /admin/runtimes:
    get:
      tags:
      - Runtime Control
      summary: 런타임 상태 조회
      description: '공유 GPU 예산 위의 모든 vLLM 런타임(보조: embedding, embedding_ko, risk_prompt
        + 메인 `local-main`)의 현재 상태와 VRAM 점유를 반환합니다.


        `state`: 런타임 상태 — `active`(서비스 중) / `stopped`(컨테이너 중지, VRAM 회수) / `starting`(전환
        중, 일시적).


        `vram_fraction`: 각 런타임의 GPU VRAM 점유율(gpu_memory_utilization).


        `budget`: `{ceiling, used, free}` — 활성 런타임 점유율 합과 천장.


        `container_status`: 실제 Docker 컨테이너 상태(참고용). 정지/시작은 보조·메인 모두 `PATCH /admin/runtimes/{service_key}`(메인은
        `service_key=main`)로, 메인 프로필 교체만 `POST /admin/main-model/switch`로 수행합니다.'
      operationId: listRuntimes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
              examples:
                all_active:
                  summary: 전체 활성
                  value:
                    runtimes:
                    - service_key: embedding
                      container: embedding-vllm
                      state: active
                      container_status: running
                      vram_fraction: 0.04
                    - service_key: embedding_ko
                      container: embedding-ko-vllm
                      state: active
                      container_status: running
                      vram_fraction: 0.06
                    - service_key: risk_prompt
                      container: risk-prompt-vllm
                      state: active
                      container_status: running
                      vram_fraction: 0.065
                    - service_key: main
                      container: main-llm-vllm
                      state: active
                      container_status: running
                      vram_fraction: 0.76
                      gate: open
                      active_profile: gemma4-26b-a4b-fp8
                    budget:
                      ceiling: 0.93
                      used: 0.925
                      free: 0.005
                mixed_state:
                  summary: 중지/시작 중 포함
                  value:
                    runtimes:
                    - service_key: embedding
                      container: embedding-vllm
                      state: stopped
                      container_status: exited
                      vram_fraction: 0.04
                    - service_key: risk_prompt
                      container: risk-prompt-vllm
                      state: active
                      container_status: running
                      vram_fraction: 0.065
                    - service_key: main
                      container: main-llm-vllm
                      state: stopped
                      container_status: exited
                      vram_fraction: 0.76
                      gate: closed
                      active_profile: gemma4-26b-a4b-fp8
                    budget:
                      ceiling: 0.93
                      used: 0.065
                      free: 0.865
