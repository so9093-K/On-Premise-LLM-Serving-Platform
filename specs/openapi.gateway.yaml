  /admin/runtimes/{service_key}:
    patch:
      tags:
      - Runtime Control
      summary: 런타임 상태 전환
      description: '`desired_state`에 지정한 목표 상태로 런타임을 전환합니다. `service_key`는 보조 런타임(embedding,
        embedding_ko, risk_prompt)과 메인 모델(`main`)을 모두 받습니다 — 함대 전체를 같은 동사로 제어합니다.


        - **`active`** — 컨테이너를 시작하고 gateway 라우팅을 복구합니다. 이미 `active`면 no-op.

        - **`stopped`** — 컨테이너를 중지하고 GPU VRAM을 회수합니다. 이미 `stopped`면 no-op.


        `main`은 정지 시 드레인 후 gate를 닫고, 시작 시 GPU 예산 admission과 canary 검증을 거칩니다(프로필 교체는
        `POST /admin/main-model/switch`).


        GPU 예산을 초과하면 409와 정지 계획(`plan.stop`)을 반환하며, `force: true`로 우선순위 낮은 보조를 자동 축출할
        수 있습니다. Scalar UI 드롭다운에서 선택 후 Execute만 누르면 됩니다.'
      operationId: transitionRuntime
      security:
      - adminBearerAuth: []
      parameters:
      - name: service_key
        in: path
        required: true
        schema:
          type: string
          title: Service Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
              examples:
                to_stopped:
                  summary: 보조 중지 (VRAM 회수)
                  value:
                    service_key: embedding_ko
                    state: stopped
                    containers_stopped:
                    - embedding-ko-vllm
                to_stopped_prereq:
                  summary: 보조 중지 — 선행 컨테이너 포함
                  value:
                    service_key: risk_prompt
                    state: stopped
                    containers_stopped:
                    - risk-prompt-vllm
                    - embedding-vllm
                to_active:
                  summary: 보조 시작 (서비스 복구)
                  value:
                    service_key: embedding_ko
                    state: active
                    containers_started:
                    - embedding-ko-vllm
                to_active_prereq:
                  summary: 보조 시작 — 선행 컨테이너 포함
                  value:
                    service_key: risk_prompt
                    state: active
                    containers_started:
                    - embedding-vllm
                    - risk-prompt-vllm
                noop:
                  summary: 이미 목표 상태 (no-op)
                  value:
                    service_key: embedding
                    state: active
                    changed: false
                main_stopped:
                  summary: 메인 정지 (key=main, VRAM 회수)
                  value:
                    service_key: main
                    state: stopped
                    evicted: []
                main_active:
                  summary: 메인 시작 (key=main)
                  value:
                    service_key: main
                    state: active
                    evicted: []
                main_active_force:
                  summary: 메인 시작 + 보조 축출 (force)
                  value:
                    service_key: main
                    state: active
                    evicted:
                    - risk-prompt-vllm
                    - embedding-ko-vllm
        '404':
          content:
            application/json:
              example:
                detail: 'runtime endpoint not found: embedding_ko'
          description: Not Found
        '409':
          description: 런타임이 전환 중이거나 GPU 예산 초과(정지 계획 반환). force=true로 자동 축출.
          content:
            application/json:
              examples:
                budget_exceeded:
                  summary: GPU 예산 초과 + 정지 계획
                  value:
                    detail:
                      code: GPU_BUDGET_EXCEEDED
                      feasible: true
                      required: 0.85
                      available: 0.765
                      ceiling: 0.93
