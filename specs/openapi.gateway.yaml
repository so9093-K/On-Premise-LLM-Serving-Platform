  /admin/main-model/profiles:
    get:
      tags:
      - Runtime Control
      summary: 메인 모델 프로필 조회
      description: '이 배포에서 전환할 수 있는 메인 모델 프로필과 각 프로필의 근거를 반환합니다. `active: true`가 현재
        서빙 중인 프로필입니다.


        - `compatibility.status` — `verified`만 추가 확인 없이 전환됩니다. 그 외 상태는 `switch` 요청에
        `confirm_unverified: true`가 필요합니다.

        - `capabilities.deployed_input` — 그 프로필로 전환했을 때 받을 수 있는 입력 modality입니다. 전환이
        완료되면 `/v1/models`의 `input_modalities`와 chat validator에 즉시 반영됩니다.

        - `upstream_model_id`, `revision` — 실제로 로딩되는 가중치 pin입니다.


        프로필 목록의 source of truth는 `configs/main_model_profiles.yaml`이며, 여기 없는 ID로는
        전환할 수 없습니다.'
      operationId: listMainModelProfiles
      responses:
        '200':
          description: 허용된 프로필 목록
          content:
            application/json:
              schema: {}
              example:
                profiles:
                - id: gemma4-26b-a4b-fp8
                  display_name: Gemma 4 26B A4B FP8
                  served_model_name: local-main
                  upstream_model_id: RedHatAI/gemma-4-26B-A4B-it-FP8-Dynamic
                  revision: 8edbb9269ec9c3faad538ee1208a07eb46051f34
                  compatibility:
