  /admin/main-model/switch:
    post:
      tags:
      - Runtime Control
      summary: 메인 모델 전환
      description: '메인 모델 프로필을 비동기로 전환합니다(`202` + `operation_id`). 전환 도중 gate가 닫히고
        진행 중인 요청을 drain한 뒤 컨테이너를 교체하므로, 완료까지 chat 요청은 `503 MAIN_MODEL_SWITCH_IN_PROGRESS`를
        받습니다.


        - `profile` — `GET /admin/main-model/profiles`가 반환한 ID만 허용합니다. 그 외 필드(model
        id, command 등)는 `422`로 거부되며 임의 실행 인자를 넣을 수 없습니다.

        - `confirm_unverified` — `compatibility.status`가 `verified`가 아닌 프로필로 전환할 때
        필요합니다.

        - `request_id` — 선택적 멱등 키입니다. 진행 중이거나 방금 끝난 동일 작업이 있으면 새 전환을 시작하지 않고 그 작업을
        반환하며 응답에 `reused: true`로 표시합니다(재시도 안전용이라 일정 시간 뒤 만료됩니다). 매번 새 전환을 원하면 고유한
        값을 쓰거나 생략합니다.


        진행 상황은 `GET /admin/main-model/operations/{operation_id}` 또는 `GET /admin/main-model`의
        `last_operation`으로 확인합니다. 검증 단계에서 실패하면 이전 프로필로 자동 rollback합니다.'
      operationId: switchMainModel
      requestBody:
        content:
          application/json:
            schema:
              properties:
                profile:
                  type: string
                  description: configs/main_model_profiles.yaml의 profile ID
                confirm_unverified:
                  type: boolean
                  default: false
                request_id:
                  type: string
                  maxLength: 128
                  minLength: 1
              additionalProperties: false
              type: object
              required:
              - profile
            examples:
              gemma4_26b_a4b_fp8:
                summary: Gemma 4 26B A4B FP8 (verified)
                value:
                  profile: gemma4-26b-a4b-fp8
              gemma4_12b_unified_fp8:
                summary: Gemma 4 12B Unified FP8 (verified)
                value:
                  profile: gemma4-12b-unified-fp8
              gemma4_e4b_it:
                summary: Gemma 4 E4B IT (verified)
                value:
                  profile: gemma4-e4b-it
              qwen2_5_omni_7b_thinker:
                summary: Qwen 2.5 Omni 7B (Thinker) (verified)
                value:
                  profile: qwen2.5-omni-7b-thinker
        required: true
      responses:
        '202':
          description: 전환 작업 접수
          content:
            application/json:
              schema:
                properties:
                  operation_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    description: 'operation 현재 stage/status. 새 전환은 pending으로 시작하고,
                      동일 request_id 재생 시 기존 작업의 status(예: completed)를 그대로 반환한다.'
                  reused:
                    type: boolean
                    description: true면 동일 request_id의 기존 작업을 반환한 것이며 새 전환은 시작되지 않았다.
                  message:
                    type: string
                    description: 운영자용 설명 — 재생 여부와 진행 상황 조회 위치를 안내한다.
                type: object
                required:
                - operation_id
                - status
                - reused
        '409':
          description: 전환 중, locked, confirmation 필요 또는 request_id 충돌
        '422':
          description: 잘못된 profile 또는 request
          content:
            application/json:
              schema:
                $ref: ./schemas/common_error.schema.json
        '503':
          description: Admin Sidecar 연결 실패
          content:
            application/json:
              schema:
                $ref: ./schemas/common_error.schema.json
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: ./schemas/common_error.schema.json
        '413':
          description: 요청 body가 너무 큼
          content:
            application/json:
              schema:
                $ref: ./schemas/common_error.schema.json
        '429':
          description: Upstream rate limit 또는 local admission timeout
          content:
            application/json:
              schema:
                $ref: ./schemas/common_error.schema.json
        '500':
          description: 내부 서버 오류
          content:
            application/json:
              schema:
                $ref: ./schemas/common_error.schema.json
        '502':
          description: Upstream 오류 또는 유효하지 않은 upstream 응답
          content:
            application/json:
              schema:
                $ref: ./schemas/common_error.schema.json
        '504':
          description: Upstream timeout
          content:
            application/json:
              schema:
                $ref: ./schemas/common_error.schema.json
      security:
      - adminBearerAuth: []
  /admin/main-model/operations/{operation_id}:
    get:
      tags:
      - Runtime Control
      summary: 메인 모델 전환 작업 조회
      description: '비동기 전환 작업의 현재 단계와 실패 원인을 조회합니다. `operation_id`는 `POST /admin/main-model/switch`의
        `202` 응답에서 받은 값이며, `completed`·`failed`·`rollback_failed`에 도달할 때까지 폴링합니다.
        각 stage의 의미는 Runtime Control 태그 설명에 있습니다.


        - `stage` — 지금 수행 중인 단계, `status` — 같은 값(터미널 상태에서 확정).

        - `error` — 전환을 실패시킨 원인 문자열. `rollback_error`가 함께 있으면 이전 프로필 복구까지 실패한 것이며(`rollback_failed`),
        이때는 수동 개입이 필요합니다.

        - `client_request_id` — 요청에 넣은 멱등 키.


        가장 최근 작업은 `GET /admin/main-model`의 `last_operation`으로도 볼 수 있고, 진행 상태는 Grafana
        `Main-model Control` 대시보드의 Latest Operation State 패널에서 실시간으로 확인합니다.'
      operationId: getMainModelOperation
      security:
      - adminBearerAuth: []
      responses:
        '200':
          description: 전환 작업 상태
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - requested_profile
                - status
                - stage
                - created_at
                - updated_at
                properties:
                  id:
                    type: string
                    format: uuid
                  requested_profile:
                    type: string
                  previous_profile:
                    type:
                    - string
                    - 'null'
                  client_request_id:
                    type:
                    - string
                    - 'null'
                  status:
                    type: string
                    enum:
                    - pending
                    - preparing
                    - draining
                    - stopping
                    - starting
                    - validating
                    - rolling_back
                    - completed
                    - failed
                    - rollback_failed
                  stage:
                    type: string
                    enum:
                    - pending
                    - preparing
                    - draining
                    - stopping
                    - starting
                    - validating
                    - rolling_back
                    - completed
                    - failed
                    - rollback_failed
                  error:
                    type:
                    - string
                    - 'null'
                  rollback_error:
                    type:
                    - string
                    - 'null'
                  created_at:
                    type: number
                  updated_at:
                    type: number
              examples:
                in_progress:
                  summary: 진행 중 (validating)
                  value:
                    id: 41cf50bb-60b2-4dbc-b38a-7dd07da91d97
                    requested_profile: gemma4-12b-unified-fp8
                    previous_profile: gemma4-26b-a4b-fp8
                    client_request_id: ops-20260622-12b
                    status: validating
                    stage: validating
                    created_at: 1782086105.78
                    updated_at: 1782086230.12
                completed:
                  summary: 완료
                  value:
                    id: 41cf50bb-60b2-4dbc-b38a-7dd07da91d97
                    requested_profile: gemma4-12b-unified-fp8
                    previous_profile: gemma4-26b-a4b-fp8
                    client_request_id: ops-20260622-12b
                    status: completed
                    stage: completed
                    created_at: 1782086105.78
                    updated_at: 1782086258.2
                failed:
                  summary: 실패 후 이전 프로필로 rollback
                  value:
                    id: 41cf50bb-60b2-4dbc-b38a-7dd07da91d97
                    requested_profile: gemma4-12b-unified-fp8
                    previous_profile: gemma4-26b-a4b-fp8
                    client_request_id: ops-20260622-12b
                    status: failed
                    stage: validating
                    error: 'runtime validation failed: /v1/models did not report local-main'
                    created_at: 1782086105.78
                    updated_at: 1782086240.55
        '404':
          description: operation 없음 (id 오타이거나 만료/미존재)
        '503':
          description: Admin Sidecar 연결 실패
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: ./schemas/common_error.schema.json
      parameters:
      - name: operation_id
        in: path
        required: true
        description: switch 202 응답의 `operation_id` (UUID).
        schema:
          type: string
          format: uuid
        example: 41cf50bb-60b2-4dbc-b38a-7dd07da91d97
components:
  schemas: {}
  securitySchemes:
    adminBearerAuth:
      type: http
      description: /ready, /metrics 같은 운영자 endpoint에 사용하는 admin Bearer token입니다.
      scheme: bearer
    bearerAuth:
      type: http
      description: Gateway API 또는 내부 Risk Adapter 호출에 사용하는 Bearer token입니다.
      scheme: bearer
tags:
- name: Operations
  description: '`/health`는 process liveness, `/ready`는 vLLM과 Risk Adapter 전체 dependency
    상태를 확인합니다.'
- name: Monitoring
  description: Prometheus scrape용 metric 엔드포인트입니다. 운영 환경에서는 admin token 또는 내부망으로 보호합니다.
- name: Models
  description: 'Gateway가 외부 호출자에게 노출하는 logical model catalog입니다. 아래 표는 이 배포의 설정에서
    생성되며, 런타임 권위는 `GET /v1/models` 응답입니다.


    | 모델 | backend | 입력 modality | capability | 조정 가능 파라미터 |

    |---|---|---|---|---|

    | `local-main` | `main_llm_vllm` | `text`, `image`, `audio`, `video` | `chat.completions`,
    `chat.completions.vision`, `chat.completions.tools` | 21개 — `request_parameters`
    참고 |

    | `local-embed` | `embedding_vllm` | `text` | `embeddings`, `retrieval_rerank`,
    `retrieval_score` | 3개 — `request_parameters` 참고 |

    | `local-embed-ko` | `embedding_ko_vllm` | `text` | `embeddings`, `retrieval_rerank`,
    `retrieval_score` | 3개 — `request_parameters` 참고 |

    | `risk-prompt` | `risk_adapter` | `text` | `risk.prompt_attack_signal` | 없음 (고정값
    사용) |

    | | | | 고정 파라미터 | `max_tokens=1`, `temperature=0` |


    `request_parameters`는 파라미터마다 타입과 허용 범위(`min`, `max`, `max_items`, `allowed` 등)를
    함께 반환합니다. 모델별 입력 form UI는 이 값을 읽어 구성해야 하며, 이 문서 화면의 예시 값은 client preset일 뿐 Gateway
    기본값이 아닙니다.


    ### `local-main`은 프로필 façade입니다


    `local-main`은 고정된 하나의 모델이 아니라 현재 활성화된 메인 모델 프로필의 공개 이름입니다. 프로필을 전환하면 입력 modality,
    토큰 한도, 파라미터 allowlist가 함께 바뀌고 `/v1/models` 응답이 즉시 그 값을 반영합니다.


    | 프로필 ID | 이름 | 호환성 |

    |---|---|---|

    | `gemma4-26b-a4b-fp8` | Gemma 4 26B A4B FP8 | `verified` |

    | `gemma4-12b-unified-fp8` | Gemma 4 12B Unified FP8 | `verified` |

    | `gemma4-e4b-it` | Gemma 4 E4B IT | `verified` |

    | `qwen2.5-omni-7b-thinker` | Qwen 2.5 Omni 7B (Thinker) | `verified` |


    호환성이 `verified`가 아닌 프로필로 전환하려면 `POST /admin/main-model/switch`에 `confirm_unverified:
    true`가 필요합니다. 각 프로필의 근거는 `GET /admin/main-model/profiles`가 반환합니다.'
- name: Chat
  description: "OpenAI 호환 chat completions API입니다. Gateway는 upstream으로 넘기기 전에 model\
    \ id, 입력 modality, 토큰 한도, 파라미터 allowlist, 구조화 출력 스키마를 직접 검증합니다.\n\n아래 값은 이 배포의\
    \ **기본 프로필** 정책입니다. 프로필을 전환하면 값이 달라지므로, 실행 시점의 권위는 `GET /v1/models`(사용자용)와 `GET\
    \ /admin/main-model`의 `active_profile.gateway_policy`(운영자용)입니다.\n\n### 요청 파라미터\
    \ allowlist\n\n- 허용 파라미터: `stream`, `stream_options`, `temperature`, `max_tokens`,\
    \ `top_p`, `top_k`, `min_p`, `presence_penalty`, `frequency_penalty`, `repetition_penalty`,\
    \ `stop`, `seed`, `n`, `tools`, `tool_choice`, `parallel_tool_calls`, `reasoning`,\
    \ `response_format`, `logprobs`, `top_logprobs`, `logit_bias`, `user`\n- 목록에 없는\
    \ 파라미터는 upstream에 전달되지 않고 `422 VALIDATION_ERROR`로 거부됩니다. 응답 `error.param`이 문제가\
    \ 된 필드명을 가리킵니다.\n- `max_completion_tokens`는 OpenAI가 `max_tokens`를 대체한 이름입니다. 같은\
    \ 한도를 가리키므로 요청은 두 이름 중 하나만 담아야 하고, upstream 전에 `max_tokens`로 접힙니다.\n- 다음 파라미터는\
    \ Gateway 계약에서만 쓰이고 런타임에는 전달되지 않습니다: `user`. 응답과 metric label에 영향이 없습니다.\n- 메시지\
    \ 역할은 `system`, `developer`, `user`, `assistant`(+ tool 지원 시 `tool`)입니다. `developer`는\
    \ OpenAI가 `system`을 대체한 이름이며 동일하게 처리됩니다.\n\n### 토큰 한도\n\n- `max_model_len` 50,000\
    \ — 입력과 출력 토큰의 합에 대한 상한입니다.\n- `max_tokens` 상한 13,000 — 요청이 이 값을 넘으면 `422 VALIDATION_ERROR`(`error.param:\
    \ max_tokens`)입니다.\n- `n` 최대 1 — 한 요청이 만들 수 있는 choice 개수입니다.\n- 요청 본문 자체의 상한은\
    \ 100,000,000 bytes (95.4 MiB)입니다(base64 미디어 포함). 초과하면 `413 REQUEST_TOO_LARGE`입니다.\n\
    \n### 스트리밍\n\n- `stream: true` — upstream SSE chunk를 버퍼링 없이 `text/event-stream`으로\
    \ 중계합니다.\n- `stream_options.include_usage: true` — 마지막 chunk에 token usage를 포함합니다.\n\
    - 스트림 상한: 최대 300초, 20,000 chunk, 104,857,600 bytes (100.0 MiB).\n- 전송 도중 오류가 나면\
    \ 이미 `200`으로 헤더가 나간 뒤이므로 상태 코드를 바꿀 수 없습니다. Gateway는 SSE `error` 이벤트를 먼저 보내고 `data:\
    \ [DONE]`으로 스트림을 닫으므로, 클라이언트는 마지막 이벤트를 반드시 확인해야 합니다.\n\n### 도구 호출 (tools)\n\n\
    - 지원 여부: `true` — 비활성 프로필에서는 `tools`를 보내면 거부됩니다.\n- `tools` 최대 64개.\n- `parallel_tool_calls`\
    \ 허용: `false` — 허용되지 않으면 `true`를 보낼 수 없습니다.\n- `tool_choice`: `auto`, `none`,\
    \ `required` 또는 함수 지정 객체.\n- 프로필이 tool calling을 지원하지 않으면 `/v1/models`의 capability\
    \ 목록에서 `chat.completions.tools`가 빠집니다.\n\n### 구조화 출력 (response_format)\n\n- 허용\
    \ 타입: `text`, `json_object`, `json_schema`\n- `json_object` — JSON mode입니다. `messages`에\
    \ JSON으로 답하라는 명시적 지시문이 있어야 하며, 특정 스키마와의 일치는 보장하지 않습니다.\n- `json_schema` — Structured\
    \ Outputs입니다. 다음 제약을 Gateway가 미리 검사하고, 위반하면 upstream 호출 없이 `422`로 거부합니다.\n  -\
    \ root는 `object`여야 함: `true`\n  - `additionalProperties: false` 필수: `true`\n \
    \ - 스키마 크기 16,384 bytes, 최대 깊이 8, 전체 property 64개\n  - optional 필드는 nullable union(`[\"\
    type\", \"null\"]`)으로 표현하고, external `$ref`는 쓸 수 없습니다.\n- **열린 값 타입에는 경계를 주세요.**\
    \ `integer`/`number`에 `minimum`·`maximum`, 자유 `string`에 `maxLength` 또는 `pattern`이\
    \ 없으면 문법상 값이 무한히 이어질 수 있어, 모델이 닫는 토큰을 내지 못하고 `max_tokens`에서 잘립니다(자릿수·소수점 반복).\
    \ 경계가 있으면 문법 자체가 닫히므로 이 실패가 생기지 않습니다.\n- 생성 결과가 스키마를 만족하지 못하면 `UPSTREAM_SCHEMA_ERROR`(retryable)입니다.\
    \ 위 경계를 먼저 확인하고, 그다음 스키마를 단순화하거나 `max_tokens`를 늘리세요.\n\n### 추론 (reasoning)\n\n\
    - 지원 여부: `true`, 기본값 `false`, 방식 `request_opt_in`.\n- 요청마다 `reasoning: true`로\
    \ 켜는 opt-in이며, 켜면 출력 토큰을 더 씁니다 — `max_tokens` 여유를 함께 늘려야 답변이 잘리지 않습니다.\n\n###\
    \ 진단용 파라미터\n\n- `logprobs` / `top_logprobs` — 토큰별 확률을 응답에 포함합니다. `top_logprobs`는\
    \ `logprobs: true`가 전제입니다.\n- `logit_bias` — token id 기준으로 편향을 겁니다. token id는\
    \ **활성 프로필의 tokenizer 기준**이므로, 프로필을 전환하면 같은 id가 다른 토큰을 가리킬 수 있습니다.\n- `seed` —\
    \ 같은 입력·같은 프로필에서 재현성을 높입니다(완전 결정성을 보장하지는 않습니다).\n\n### 멀티모달 입력\n\n현재 기본 프로필이 받는\
    \ 입력: `text`, `image`, `audio`, `video`. 선언되지 않은 modality의 content part를 보내면 `422\
    \ VALIDATION_ERROR`로 거부되고, `error.param`이 어떤 part였는지 알려줍니다(`messages.content`,\
    \ `image_url`, `input_audio`, `video_url`).\n\n| 항목 | 이미지 | 오디오 | 비디오 |\n|---|---|---|---|\n\
    | 최대 개수 | 1 | 1 | 1 |\n| 최대 크기 | 25,000,000 bytes (23.8 MiB) | 25,000,000 bytes\
    \ (23.8 MiB) | 50,000,000 bytes (47.7 MiB) |\n| 허용 형식 | `image/jpeg`, `image/png`,\
    \ `image/webp`, `image/avif`, `image/jp2`, `image/gif`, `image/bmp`, `image/tiff`,\
    \ `image/x-tiff` | `wav`, `mp3`, `flac`, `ogg`, `m4a`, `mp4`, `aac` | `video/mp4`,\
    \ `video/webm`, `video/x-matroska`, `video/quicktime`, `video/jpeg`, `video/x-msvideo`,\
    \ `video/avi`, `video/gif` |\n| URL scheme | `data` | 인라인 base64 | `data` |\n\n\
    - 이미지 픽셀 상한 12,845,056px — 압축 폭탄을 막기 위해 디코딩 전에 헤더에서 해상도를 읽어 검사하며, 해상도를 읽지 못하면\
    \ 거부합니다(fail-closed).\n- 비디오는 최대 60 프레임, 60초, 프레임당 12,845,056px까지 허용합니다.\n- 크기·형식\
    \ 위반도 같은 방식으로 `error.param`이 원인을 가리킵니다(예: `input_audio.format`은 형식 문제, `image_url`은\
    \ 이미지 자체의 문제)."
- name: Embeddings
  description: '텍스트 embedding API입니다. 모델마다 출력 차원이 고정되어 있고, Gateway가 요청 차원과 응답 차원이
    일치하는지 확인합니다.


    | 모델 | 기본 차원 | 허용 차원 | encoding_format |

    |---|---|---|---|

    | `local-embed` | `768` | `768` | `float`, `base64` |

    | `local-embed-ko` | `1024` | `1024` | `float`, `base64` |


    - `base64`는 little-endian float32 배열을 인코딩한 문자열로 반환됩니다. openai-python은 numpy가 설치되어
    있으면 이 형식을 기본으로 요청하므로, 형식을 지정하지 않은 공식 SDK 호출도 그대로 동작합니다.

    - `input`은 문자열 또는 비어 있지 않은 문자열 배열입니다. token id 배열 입력은 받지 않습니다.'
- name: Retrieval
  description: '`local-embed-ko` 기본, `local-embed` 선택 dense cosine 문서 관련도 평가 API입니다.'
- name: Risk
  description: 'signal-only risk assessment API입니다. `allow`, `block`, `decision`,
    `action` 같은 정책 판단 필드는 반환하지 않습니다. 최종 허용·차단 결정은 Gateway 밖 product policy layer가
    담당합니다.


    응답이 HTTP 200이어도 `status=failed` 또는 `assessment_complete=false`이면 detector 실패입니다.
    이 경우 `risk_detected=false`를 안전 판정으로 해석하지 마세요.


    **Sensitive Data Protection** — PII Protection + Secret Exposure Signal:

    - **PII Protection** (D1, D2, D5): 주민등록번호, 이메일, 전화번호, IP 주소 탐지

    - **Secret Exposure** (D4, D5): API 키, JWT, private key, 비밀번호, DB URL 탐지


    **Prompt detector** (`risk-prompt`) — Prompt Injection / Prompt Leaking 탐지:

    - system/developer instruction 무시 유도

    - 숨겨진 system prompt 출력 요구

    - 역할극(DAN, unrestricted AI 등) jailbreak

    - 문서·웹페이지 안에 숨겨진 간접 prompt injection

    - 연결된 도구로 시크릿·파일·메일 탈취 유도'
- name: Runtime Control
  description: 'GPU 예산을 공유하는 vLLM 런타임 함대를 제어하는 관리자 API입니다. admin token이 필요합니다.


    ### 제어 모델


    - **정지·시작**은 보조 런타임과 메인 모델 모두 `PATCH /admin/runtimes/{service_key}`의 `desired_state`(`active`
    / `stopped`) 하나로 수행합니다. 메인 모델의 `service_key`는 `main`입니다.

    - **메인 모델의 프로필 교체**만 `POST /admin/main-model/switch`로 따로 수행합니다.

    - 모든 런타임은 같은 VRAM 예산(`budget: {ceiling, used, free}`)을 나눠 씁니다. 시작 요청이 천장을 넘으면
    `409 GPU_BUDGET_EXCEEDED`와 함께 `error.details.plan.stop`에 정지 후보를 돌려주며, `force:
    true`로 우선순위가 낮은 보조 런타임을 자동 축출할 수 있습니다.


    ### gate — 요청 경로와의 관계


    - `gate: open`이어야 `/v1/chat/completions`가 요청을 받습니다.

    - 전환·정지 중에는 gate가 닫히고 chat 요청은 `503 MAIN_MODEL_SWITCH_IN_PROGRESS` + `Retry-After:
    5`로 fail-closed 응답합니다(요청이 조용히 잘못된 모델로 가지 않습니다).

    - 요청 경로는 gate와 활성 프로필을 control-plane ledger에서만 읽습니다. Docker 관측은 `GET /admin/main-model`에서만
    수행하므로, 추론 트래픽이 Docker daemon 상태에 묶이지 않습니다.


    ### 전환 작업 stage


    `POST /admin/main-model/switch`는 즉시 `202`와 `operation_id`를 돌려주고 아래 순서로 진행합니다.
    `GET /admin/main-model/operations/{operation_id}`로 폴링합니다.


    | stage | 의미 |

    |---|---|

    | `pending` | 작업 접수, 아직 시작 전 |

    | `preparing` | 이미지·가중치 등 사전 준비 |

    | `draining` | gate를 닫고 진행 중인 요청이 끝나기를 대기 |

    | `stopping` | 이전 런타임 컨테이너 정지 |

    | `starting` | 새 프로필 컨테이너 기동 |

    | `validating` | 기동한 런타임에 canary 요청으로 계약 확인 |

    | `rolling_back` | 검증 실패로 이전 프로필 복구 중 |

    | `completed` | 전환 성공, gate 재개방 (터미널) |

    | `failed` | 전환 실패, 이전 프로필로 복구됨 (터미널) |

    | `rollback_failed` | 복구까지 실패 — 수동 개입 필요 (터미널) |


    `stopping` 이후는 이전 런타임이 이미 해체된 뒤라, 실패하면 gate를 그냥 다시 여는 대신 이전 프로필로 rollback합니다.
    rollback까지 실패하면 `rollback_failed`로 남고 이때만 수동 개입이 필요합니다.


    전환 가능한 프로필: `gemma4-26b-a4b-fp8`, `gemma4-12b-unified-fp8`, `gemma4-e4b-it`, `qwen2.5-omni-7b-thinker`.
    근거와 활성 여부는 `GET /admin/main-model/profiles`가 반환합니다.'
