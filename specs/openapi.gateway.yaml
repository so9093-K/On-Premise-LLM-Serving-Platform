                    - image
                  runtime_image: gitlab.wizvera.com:4567/acl-ai-system/acl-ai-gateway/vllm-unified@sha256:57f8dc4b64c189e0656ead65fbf7444971c74158b8fbdd9106886ed7353b1981
                  vram_fraction: 0.76
                  active: true
                - id: gemma4-12b-unified-fp8
                  display_name: Gemma 4 12B Unified FP8
                  served_model_name: local-main
                  upstream_model_id: RedHatAI/gemma-4-12B-it-FP8-Dynamic
                  revision: 67e53491df7a281623fa740de61307d5c542b7f4
                  compatibility:
                    status: verified
                  capabilities:
                    deployed_input:
