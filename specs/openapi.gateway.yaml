  /v1/risk/detectors/pii/assessments:
    post:
      tags:
      - Risk
      summary: PII Protection 탐지 신호
      description: '**PII Protection detector** — Presidio Analyzer(optional) + Korean
        custom recognizer 기반 로컬 탐지.


        탐지 코드:

        - **D1** Personal Identifier: KR_RRN, KR_FRN, KR_PASSPORT, KR_DRIVER_LICENSE,
        PERSON

        - **D2** Contact and Location: EMAIL_ADDRESS, PHONE_NUMBER, ADDRESS

        - **D3** Financial Identifier: CREDIT_CARD, KR_BRN, BANK_ACCOUNT_CANDIDATE

        - **D5** Network/Infrastructure: IP_ADDRESS, URL


        원문 PII 값은 응답에 포함되지 않습니다. `span_count`로 entity별 탐지 개수를 제공합니다.

        탐지 결과는 최종 정책 판단이 아닌 진단 signal로 취급합니다.'
      operationId: assessPIIRisk
      requestBody:
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              title: RiskAssessmentRequest
              type: object
              additionalProperties: false
              required:
              - prompt
              properties:
                prompt:
                  type: string
                  minLength: 1
                  maxLength: 20000
            examples:
              email_and_phone:
