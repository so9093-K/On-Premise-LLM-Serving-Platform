                        - UPSTREAM_TIMEOUT
                        - UPSTREAM_ERROR
                        - UPSTREAM_SCHEMA_ERROR
                        - RATE_LIMITED
                        - PARSE_ERROR
                        - INTERNAL_ERROR
                        - QUEUE_TIMEOUT
                        - CIRCUIT_OPEN
                        - REQUEST_TOO_LARGE
                        - RUNTIME_NOT_READY
                      message:
                        type: string
                      retryable:
                        type: boolean
