id: release_packaging
title: Release Packaging and Version Management
owner: release_engineer
audience:
  - release_engineer
  - operator
description: >
  make package로 dist/ ZIP을 생성한다. package 전 generated report를 static placeholder로
  재생성하고, secret/cache/timestamped runtime report를 제외한다.
  make reset-version으로 package version을 갱신한다.

source_files:
  - scripts/build/package_release.sh
  - scripts/build/reset_version.py
  - scripts/reports/refresh_generated_reports.py
  - scripts/validation/release_check.py

config_files:
  - VERSION
  - version_manifest.json
  - pyproject.toml
  - specs/openapi.gateway.yaml
  - specs/openapi.risk-adapter.yaml
  - configs/recommended_images.yaml

docs:
  - docs/release/versioning_policy.md
  - docs/release/release_checklist.md
  - docs/development/build_ux.md
  - docs/START_HERE.md

commands:
  - make release-check
  - make release-check-full
  - make refresh-generated-reports
  - make package
  - make reset-version NEW_VERSION=x.y.z

tests:
  - tests/contract/test_release_hygiene.py
  - tests/contract/test_korean_documentation_hygiene.py

validation:
  - make validate
  - make release-check

generated_outputs:
  - dist/ai_model_serving_platform_<version>.zip

package_include:
  - .env.example
  - .env.local.example
  - .env.compose.example
  - reports/runtime/operator_status_bundle.md
  - reports/runtime/monitoring_projection.md
  - reports/runtime/runtime_targets.md
  - reports/runtime/storage_paths.md
  - reports/runtime/live_evidence_bundle.md
  - docs/**
  - ops/**
  - src/**
  - scripts/**
  - tests/**
  - configs/**

package_exclude:
  - .env
  - .env.*  (safe examples 제외)
  - .runtime/
  - model_cache/
  - logs/
  - dist/
  - __pycache__/
  - reports/runtime/runtime_validation_*.json
  - reports/runtime/runtime_validation_*.md

version_semantics:
  package_version:
    source: VERSION 파일
    changed_by: make reset-version
  config_schema_version:
    source: configs/*.yaml의 version 필드
    changed_by: 수동 (package version과 독립)
  risk_vllm_image_version:
    source: configs/recommended_images.yaml의 risk_vllm.default
    changed_by: 수동 (package version과 독립)

release_checklist_impact:
  - make release-check-full 통과 확인
  - make package 전 make refresh-generated-reports 자동 실행
  - ZIP root가 ai_model_serving_platform/ 인지 확인
  - .env가 포함되지 않았는지 확인
  - timestamped runtime_validation_*.json/md가 제외되었는지 확인

notes:
  - "make release-check는 report generator를 포함하므로 완전한 read-only가 아니다"
  - "static placeholder: live_evidence_bundle.py --static-placeholder로 생성"
  - "ZIP timestamp normalization: 재현 가능한 빌드를 위해 _EPOCH=(1980,1,1,0,0,0)으로 정규화"
