id: security_profiles
title: Auth Security Profiles and Exposure Topology
owner: operations
audience:
  - operator
  - release_engineer
description: >
  local_open, internal_trusted, private_network, edge_terminated, strict, custom 6가지 인증 profile을
  제공한다. AUTH_MODE flag로 app-level 인증 책임을 선택하고, EXPOSURE_MODE flag로 Compose
  host-published port topology를 독립적으로 제어한다.
  status/doctor/plan/apply UX로 안전하게 변경한다.
  ADMIN_ENDPOINTS_INTERNAL_ONLY는 현재 app-level CIDR enforcement가 아니라 네트워크 경계 선언이다.

source_files:
  - src/ai_model_serving/auth_control.py
  - src/ai_model_serving/security.py
  - scripts/auth/auth_plan.py
  - scripts/auth/auth_apply.py
  - scripts/auth/auth_status.py
  - scripts/auth/auth_doctor.py
  - scripts/auth/auth_profile_sanity.py
  - scripts/auth/exposure_status.py
  - scripts/compose/compose_up.sh
  - scripts/compose/preflight_compose.sh
  - scripts/compose/preflight_compose.py

config_files:
  - configs/auth_profiles.yaml
  - configs/exposure_profiles.yaml
  - .env.example
  - .env.local.example
  - .env.compose.example

docs:
  - docs/operations/auth_control_plane.md
  - docs/operations/admin_metrics_docs_exposure_policy.md
  - docs/adr/0012-auth-ownership-and-compose-exposure-source-of-truth.md
  - docs/START_HERE.md

commands:
  - make auth-status
  - make auth-doctor
  - make auth-plan MODE=<profile>
  - make auth-apply MODE=<profile>
  - make exposure-status
  - make exposure-status EXPOSURE_MODE=master_open
  - make compose-up EXPOSURE_MODE=master_open
  - make compose-up-master
  - make compose-config EXPOSURE_MODE=master_open

tests:
  - tests/unit/test_auth_control.py
  - tests/unit/test_auth_plan.py
  - tests/unit/test_setup_env.py
  - tests/contract/test_exposure_profiles.py

validation:
  - make validate
  - make release-check

package_impact:
  - .env.example, .env.local.example, .env.compose.example 포함
  - secret 값(.env) 제외
  - AUTH_MODE=local_open이 기본 생성값
  - EXPOSURE_MODE=private_network이 기본 compose topology

release_checklist_impact:
  - make auth-status로 현재 인증 상태 확인
  - make exposure-status로 host-published 서비스와 diagnostics 확인
  - make auth-doctor로 위험 조합 진단
  - release 전 AUTH_MODE가 의도한 profile인지 확인
  - master_open은 full-stack diagnostic topology다. release 전 의도한 EXPOSURE_MODE와 EXPOSURE_AUDIENCE를 확인한다

profile_expectations:
  local_open:
    api_key_required: false
    admin_api_key_required: false
    admin_endpoints_internal_only: false
    internal_service_auth_required: false
    docs_enabled: true
    auth_owner: operator
    scope: 로컬 개발 전용
    allowed_in_production: false
    cidr_enforcement: false
  internal_trusted:
    api_key_required: false
    admin_api_key_required: false
    admin_endpoints_internal_only: true
    internal_service_auth_required: false
    docs_enabled: false
    auth_owner: caller_or_network
    scope: "production/staging 운영용 무인증 Gateway — 네트워크 소유권으로 인증"
    allowed_in_production: true
    cidr_enforcement: false
    note: >
      auth-doctor는 APP_ENV=non-local + AUTH_MODE=internal_trusted 조합을 FAIL이 아닌
      AUTH_DELEGATED_TO_NETWORK INFO로 표시한다. 인증 소유권이 네트워크/호출자에 위임됨을 명시.
  private_network:
    api_key_required: true
    admin_api_key_required: true
    admin_endpoints_internal_only: false
    internal_service_auth_required: true
    docs_enabled: true
    auth_owner: app
    scope: 사설망/VPN 경계 + app-level admin token
    allowed_in_production: true
    cidr_enforcement: false
  edge_terminated:
    api_key_required: false
    admin_api_key_required: true
    admin_endpoints_internal_only: false
    internal_service_auth_required: true
    docs_enabled: false
    auth_owner: edge_proxy
    scope: edge proxy가 public 인증을 처리하고 app은 admin/internal 경로를 보호
    allowed_in_production: true
    cidr_enforcement: false
  strict:
    api_key_required: true
    admin_api_key_required: true
    admin_endpoints_internal_only: false
    internal_service_auth_required: true
    docs_enabled: false
    auth_owner: app
    scope: production 또는 internet-facing
    allowed_in_production: true
    cidr_enforcement: false

# exposure_profile_expectations: canonical 2-mode exposure topology.
# Source-of-truth: configs/exposure_profiles.yaml (canonical_modes, profiles)
# Do NOT add mode expectations here that are not in configs/exposure_profiles.yaml canonical_modes.
exposure_profile_expectations:
  private_network:
    class: default_private
    host_published:
      - gateway
      - grafana
    diagnostics:
      gateway_bypass_possible: false
      direct_model_runtime_access: false
      direct_risk_adapter_access: false
      direct_operations_endpoints: false
      requires_exposure_audience: false
    description: "기본 운영 topology. vLLM, Risk Adapter, Prometheus, DCGM, cAdvisor는 compose 내부망만."

  master_open:
    class: diagnostic_full_stack
    host_published:
      - gateway
      - main_llm_vllm
      - embedding_vllm
      - embedding_ko_vllm
      - risk_prompt_vllm
      - risk_adapter
      - prometheus
      - grafana
      - dcgm_exporter
      - cadvisor
    diagnostics:
      gateway_bypass_possible: true
      direct_model_runtime_access: true
      direct_risk_adapter_access: true
      direct_operations_endpoints: true
      requires_exposure_audience: true
    description: >
      전체 stack host-published. Gateway bypass, vLLM runtime, Risk Adapter, Prometheus, DCGM, cAdvisor
      직접 접근 가능. 정상 진단/운영 모드. EXPOSURE_AUDIENCE 필수.

dangerous_combinations:
  - profile: local_open
    conditions:
      - APP_ENV != local
      - API_KEY_REQUIRED = false
      - public bind address
    severity: WARN
    message: local_open + non-local APP_ENV + public bind 조합은 운영 환경에서 위험하다
  - profile: any
    conditions:
      - ADMIN_ENDPOINTS_INTERNAL_ONLY = true
      - no network boundary (no VPN/firewall/ingress)
    severity: WARN
    message: ADMIN_ENDPOINTS_INTERNAL_ONLY는 app-level CIDR enforcement가 아니다. 별도 네트워크 보호가 필요하다
  - exposure_mode: master_open
    conditions:
      - EXPOSURE_AUDIENCE missing
    severity: FAIL
    message: master_open은 EXPOSURE_AUDIENCE 없이 실행하면 preflight와 doctor가 FAIL을 발생한다
  - exposure_mode: master_open
    conditions:
      - EXPOSURE_AUDIENCE = public
      - ALLOW_PUBLIC_OPERATIONS_ENDPOINTS != true
    severity: FAIL
    message: public audience는 ALLOW_PUBLIC_OPERATIONS_ENDPOINTS=true explicit opt-in이 필요하다

notes:
  - "auth-doctor가 structured diagnostics 필드로 조합을 판단한다"
  - "internal_trusted는 AUTH_DELEGATED_TO_NETWORK INFO — non-local APP_ENV에서도 허용"
  - "local_open은 로컬 개발/검증 UX로 유지한다. 기본값을 strict로 무조건 바꾸지 않는다"
  - "ADMIN_ENDPOINTS_INTERNAL_ONLY 현재 상태: app-level CIDR enforcement 미구현"
  - "AUTH_MODE source-of-truth: configs/auth_profiles.yaml (runtime source; auth_control.py derives from YAML)"
  - "EXPOSURE_MODE source-of-truth: configs/exposure_profiles.yaml (canonical_modes, profiles)"
  - "master_open의 Gateway bypass, vLLM direct access는 의도된 진단 특성 — 별도 mode로 분리하지 않는다"
  - "EXPOSURE_AUDIENCE가 없는 master_open은 '열림'이 아니라 '누구에게 열리는지 불명확'한 상태"
