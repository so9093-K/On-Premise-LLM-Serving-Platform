# 소스: configs/model_catalog.yaml + configs/model_serving.yaml
# 명령: make render-runtime-assets
models:
  local-main:
    runtime: vllm
    port: 9401
    public_endpoint: /v1/chat/completions
    runtime_endpoint: /v1/chat/completions
  local-embed:
    runtime: vllm
    port: 9402
    public_endpoint: /v1/embeddings
    runtime_endpoint: /v1/embeddings
  local-embed-ko:
    runtime: vllm
    port: 9406
    public_endpoint: /v1/embeddings
    runtime_endpoint: /v1/embeddings
  risk-prompt:
    runtime: vllm+adapter
    port: 9403
    public_endpoint: /v1/risk/detectors/prompt/assessments
    runtime_endpoint: /v1/chat/completions
