# GitLab Enterprise Edition 12.1.1-ee
stages:
  - validate
  - test
  - package
  - build
  - deploy

variables:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_BUILDKIT: "1"
  # Common base image for all vLLM-derived runtime images (risk-vllm-kanana).
  # Override via CI/CD variable VLLM_BASE_IMAGE to switch base without editing this file.
  VLLM_BASE_IMAGE: "vllm/vllm-openai@sha256:f4492643056969529a74238f71dd66dc3097c0d433156a4f4478456bf84bd276"

  PLATFORM_IMAGE_SHA: "$CI_REGISTRY_IMAGE/platform:$CI_COMMIT_SHORT_SHA"
  PLATFORM_IMAGE_REF: "$CI_REGISTRY_IMAGE/platform:$CI_COMMIT_REF_SLUG"
  RISK_VLLM_IMAGE_SHA: "$CI_REGISTRY_IMAGE/risk-vllm-kanana:$CI_COMMIT_SHORT_SHA"
  RISK_VLLM_IMAGE_REF: "$CI_REGISTRY_IMAGE/risk-vllm-kanana:$CI_COMMIT_REF_SLUG"

.default-python:
  image: python:3.12.13-slim
  tags:
    - ai-serving
    - docker-build
  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends make git && rm -rf /var/lib/apt/lists/*
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.lock
    - python -m pip install --no-deps -e ".[contract]"

.docker-build:
  image: docker:27.5.1-cli
  tags:
    - ai-serving
    - docker-build
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache bash python3 py3-yaml
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

validate:
  extends: .default-python
  stage: validate
  script:
    - make validate
    - python scripts/models/modelctl.py validate
    - python scripts/models/modelctl.py diff
    - python scripts/compose/validate_vllm_compose.py
    - python scripts/validation/runtime_validation.py --config-only
    - python -m pytest -q tests/unit/test_main_model_control.py tests/unit/test_docker_main_model_backend.py tests/unit/gateway/test_main_model_control.py
    - bash -n scripts/ci/*.sh scripts/compose/*.sh scripts/ops/*.sh

hf-main-model-profiles-canary:
  extends: .default-python
  stage: validate
  script:
    - |
      HF_CANARY_VENV="$(mktemp -d)"
      trap 'rm -rf "$HF_CANARY_VENV"' EXIT
      python -m venv "$HF_CANARY_VENV"
      "$HF_CANARY_VENV/bin/python" -m pip install \
        "transformers==4.52.4" \
        "PyYAML==6.0.3"
      "$HF_CANARY_VENV/bin/python" scripts/models/check_main_model_profiles.py

unit-test:
  extends: .default-python
  stage: test
  script:
    - make refresh-generated-reports
    - make test

package-release:
  extends: .default-python
  stage: package
  script:
    - make package
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/*.zip
  only:
    - tags
    - release

build-platform:
  extends: .docker-build
  stage: build
  script:
    - APP_VERSION="$(tr -d '\r\n' < VERSION)"
    - docker build --pull -t "$PLATFORM_IMAGE_SHA" -t "$PLATFORM_IMAGE_REF" .
    - docker run --rm --entrypoint python "$PLATFORM_IMAGE_SHA" -c "from pathlib import Path; from ai_model_serving.main_model_control import load_main_model_catalog; from ai_model_serving.model_cache import prepare_model_snapshot; catalog = load_main_model_catalog(Path('/app/configs/main_model_profiles.yaml')); assert catalog.profiles"
    - docker push "$PLATFORM_IMAGE_SHA"
    - docker push "$PLATFORM_IMAGE_REF"
    - docker pull "$PLATFORM_IMAGE_SHA"
    - mkdir -p build
    - PLATFORM_IMAGE_DIGEST="$(docker image inspect "$PLATFORM_IMAGE_SHA" --format '{{index .RepoDigests 0}}')"
    - test -n "$PLATFORM_IMAGE_DIGEST"
    - printf 'PLATFORM_IMAGE_DIGEST=%s\n' "$PLATFORM_IMAGE_DIGEST" > build/platform-image.env
    - |
      if [ "$CI_COMMIT_BRANCH" = "release" ] || [ -n "$CI_COMMIT_TAG" ]; then
        PLATFORM_IMAGE_VERSION="$CI_REGISTRY_IMAGE/platform:release_${APP_VERSION}"
        docker tag "$PLATFORM_IMAGE_SHA" "$PLATFORM_IMAGE_VERSION"
        docker push "$PLATFORM_IMAGE_VERSION"
      fi
  only:
    - master
    - release
    - tags
  artifacts:
    paths:
      - build/platform-image.env
    expire_in: 7 days

# Builds vLLM-derived runtime images (risk-vllm-kanana) in a single job so the large
# (~25 GB) vLLM base image is pulled only once.
# embedding-ko-vllm uses EMBEDDING_KO_VLLM_IMAGE and does not require a dedicated build.
# Runs automatically on release/tag pipelines when BUILD_VLLM_DERIVED=1 or DEPLOY_MODE=full.
# Rolling control-plane deploys skip this job entirely — no vLLM rebuild is needed.
# allow_failure: false — if the job runs and fails, it is a release failure.
build-vllm-derived:
  extends: .docker-build
  stage: build
  script:
    - bash scripts/ci/build_vllm_derived_images.sh
  only:
    refs:
      - release
      - tags
    variables:
      - $BUILD_VLLM_DERIVED == "1"
      - $DEPLOY_MODE == "full"
  allow_failure: false

# Manual deployment to the 175 GPU runtime server.
# Rolling deploy (default): restarts gateway + admin-sidecar + risk-adapter; skips vLLM rebuild.
# Full runtime deploy: set DEPLOY_MODE=full when triggering the pipeline —
#   build-vllm-derived runs automatically before this job.
#   DEPLOY_MODE=full uses the current pipeline SHA image as RISK default.
# Required CI/CD variables:
#   SSH_PRIVATE_KEY      file-type variable; private key for DEPLOY_USER on 175
#   DEPLOY_KNOWN_HOSTS   output of: ssh-keyscan <175-host>
#   DEPLOY_HOST          175 internal DNS/IP
#   DEPLOY_USER          deploy user on 175
#   DEPLOY_PATH          /opt/acl-ai-gateway
#   REGISTRY_DEPLOY_USER GitLab Deploy Token username with read_registry
#   REGISTRY_DEPLOY_PASSWORD GitLab Deploy Token password/token with read_registry
# Optional variables:
#   BUILD_VLLM_DERIVED   set to "1" to build/push vLLM-derived images only; deploy mode stays rolling unless DEPLOY_MODE is set
#   DEPLOY_COMPOSE_FILE  ops/compose/full-stack.private-network.yaml
#   DEPLOY_MODE          rolling (default) or full
#   GATEWAY_BIND_ADDR    175 interface address for gateway host publish
#   GATEWAY_HEALTH_URL   explicit post-deploy health URL
#   RUN_READY_SMOKE      1 or 0; default 1
#   PRUNE_DANGLING_IMAGES 1 or 0; default 1, prune untagged images after successful deploy
#   RISK_VLLM_IMAGE_TO_DEPLOY  full deploy only; override RISK_VLLM_IMAGE in 175 .env
deploy-gpu-175:
  stage: deploy
  image: alpine:3.20
  dependencies:
    - build-platform
  tags:
    - ai-serving
    - docker-build
  before_script:
    - apk add --no-cache bash openssh-client rsync
    - eval "$(ssh-agent -s)"
    - chmod 400 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf "%s\n" "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - |
      test -f build/platform-image.env
      . build/platform-image.env
      case "${PLATFORM_IMAGE_DIGEST:-}" in
        "${CI_REGISTRY_IMAGE}/platform@"sha256:*) ;;
        *)
          echo "Invalid or missing PLATFORM_IMAGE_DIGEST artifact" >&2
          exit 1
          ;;
      esac
      if [ "${DEPLOY_MODE:-rolling}" = "full" ]; then
        _risk_vllm="${RISK_VLLM_IMAGE_TO_DEPLOY:-${RISK_VLLM_IMAGE_SHA}}"
      else
        _risk_vllm="${RISK_VLLM_IMAGE_TO_DEPLOY:-}"
      fi
      PLATFORM_IMAGE_TO_DEPLOY="${PLATFORM_IMAGE_DIGEST}" \
      RISK_VLLM_IMAGE_TO_DEPLOY="${_risk_vllm}" \
      DEPLOY_RELEASE_ID="${CI_COMMIT_SHA}" \
      bash scripts/ci/deploy_gitlab_compose.sh
  only:
    - release
  when: manual
  environment:
    name: gpu-175
