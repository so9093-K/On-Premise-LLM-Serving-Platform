# GitLab Enterprise Edition 12.1.1-ee
stages:
  - validate
  - test
  - package
  - build
  - deploy

variables:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_BUILDKIT: "1"
  # 모든 served model(26B/12B main-LLM, embedding, embedding-ko, risk-prompt)이 공유하는
  # base image는 configs/recommended_images.yaml이 단일 기준이다. 기본값을 바꿀
  # 필요가 있는 특별한 pipeline만 CI/CD 변수 VLLM_BASE_IMAGE로 명시적으로 override한다.
  # v0.25.1에서는 dense 양자화 모델에 Model Runner V2가 기본 적용돼, 이전에 고정해뒀던
  # dev 빌드에서 겪던 12B의 구조화 출력 JIT-웜업 갭이 닫힌다 — 실제 GPU 로드로 검증함
  # (ops/patches/apply_gemma4_multimodal_patches.py 참고). risk-prompt도 같은 base로
  # 실 GPU 부팅+추론 검증 완료(PII/중립 입력 모두 구버전과 동일 출력, bitsandbytes
  # 양자화 정상).
  #
  # 2026-07-24: Gemma4 멀티모달 패치(12B 전용)와 Kanana Llama head_dim 패치
  # (risk-prompt 전용)가 파일이 안 겹쳐 하나의 이미지(ops/images/vllm-unified)로
  # 합쳐졌다 — 각 patch는 그걸 필요로 하지 않는 모델에 no-op이라 26B/embedding/
  # embedding-ko도 이 이미지를 그대로 쓴다.
  #
  # risk-prompt와 12B profile은 배포 경로가 달라 별도 변수명을 사용하지만, 두 값은
  # 같은 vllm-unified image를 가리킨다.
  PLATFORM_IMAGE_SHA: "$CI_REGISTRY_IMAGE/platform:$CI_COMMIT_SHORT_SHA"
  PLATFORM_IMAGE_REF: "$CI_REGISTRY_IMAGE/platform:$CI_COMMIT_REF_SLUG"
  RISK_VLLM_IMAGE_SHA: "$CI_REGISTRY_IMAGE/vllm-unified:$CI_COMMIT_SHORT_SHA"
  RISK_VLLM_IMAGE_REF: "$CI_REGISTRY_IMAGE/vllm-unified:$CI_COMMIT_REF_SLUG"
  AUDIO_VLLM_IMAGE_SHA: "$CI_REGISTRY_IMAGE/vllm-unified:$CI_COMMIT_SHORT_SHA"
  AUDIO_VLLM_IMAGE_REF: "$CI_REGISTRY_IMAGE/vllm-unified:$CI_COMMIT_REF_SLUG"

.default-python:
  image: python:3.12.13-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
  tags:
    - ai-serving
    - docker-build
  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
  before_script:
    - python -m pip install -r requirements.lock
    - python -m pip install --no-deps -e ".[contract]"

.docker-build:
  image: docker:27.5.1-cli
  tags:
    - ai-serving
    - docker-build
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache bash python3 py3-yaml
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

validate:
  extends: .default-python
  stage: validate
  script:
    - PYTHON_BIN=python bash scripts/validation/run_validate.sh

hf-main-model-profiles:
  extends: .default-python
  stage: validate
  script:
    - |
      HF_CANARY_VENV="$(mktemp -d)"
      trap 'rm -rf "$HF_CANARY_VENV"' EXIT
      python -m venv "$HF_CANARY_VENV"
      "$HF_CANARY_VENV/bin/python" -m pip install \
        "transformers[sentencepiece]==$(python scripts/models/print_vllm_unified_compatibility.py --key transformers)" \
        "huggingface_hub==$(python scripts/models/print_vllm_unified_compatibility.py --key huggingface_hub)" \
        "PyYAML==6.0.3"
      "$HF_CANARY_VENV/bin/python" scripts/models/check_main_model_profiles.py

unit-test:
  extends: .default-python
  stage: test
  script:
    - PYTHON_BIN=python bash scripts/validation/run_test.sh

package-release:
  extends: .default-python
  stage: package
  script:
    - bash scripts/build/package_release.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/*.zip
  only:
    - tags
    - release

build-platform:
  extends: .docker-build
  stage: build
  script:
    - APP_VERSION="$(tr -d '\r\n' < VERSION)"
    - docker build --pull -t "$PLATFORM_IMAGE_SHA" -t "$PLATFORM_IMAGE_REF" .
    - docker run --rm --entrypoint python "$PLATFORM_IMAGE_SHA" -c "from ai_model_serving.apps.gateway import create_gateway_app; from ai_model_serving.apps.risk_adapter import create_risk_adapter_app; create_gateway_app(); create_risk_adapter_app()"
    - docker push "$PLATFORM_IMAGE_SHA"
    - docker push "$PLATFORM_IMAGE_REF"
    - docker pull "$PLATFORM_IMAGE_SHA"
    - mkdir -p build
    - PLATFORM_IMAGE_DIGEST="$(docker image inspect "$PLATFORM_IMAGE_SHA" --format '{{index .RepoDigests 0}}')"
    - test -n "$PLATFORM_IMAGE_DIGEST"
    - printf 'PLATFORM_IMAGE_DIGEST=%s\n' "$PLATFORM_IMAGE_DIGEST" > build/platform-image.env
    - |
      if [ "$CI_COMMIT_BRANCH" = "release" ] || [ -n "$CI_COMMIT_TAG" ]; then
        PLATFORM_IMAGE_VERSION="$CI_REGISTRY_IMAGE/platform:release_${APP_VERSION}"
        docker tag "$PLATFORM_IMAGE_SHA" "$PLATFORM_IMAGE_VERSION"
        docker push "$PLATFORM_IMAGE_VERSION"
      fi
  only:
    - master
    - release
    - tags
  artifacts:
    paths:
      - build/platform-image.env
    expire_in: 7 days

# vLLM unified 런타임 이미지를 한 번 빌드해 단일 registry 경로에 push한다. 큰(~25 GB)
# vLLM base 이미지도 한 번만 pull한다. embedding-ko-vllm은 EMBEDDING_KO_VLLM_IMAGE를
# 쓰므로 별도 빌드가 필요 없다.
# BUILD_VLLM_DERIVED=1 또는 DEPLOY_MODE=full일 때 release/tag 파이프라인에서 자동 실행된다.
# Rolling 방식의 control-plane 배포는 이 job을 아예 건너뛴다 — vLLM 재빌드가 필요 없기 때문.
# allow_failure: false — job이 실행됐는데 실패하면 release 실패로 취급한다.
build-vllm-derived:
  extends: .docker-build
  stage: build
  script:
    - bash scripts/ci/build_vllm_derived_images.sh
  # derived 이미지 빌드는 실수가 아니라 의도적인 수동 opt-in이다 -- 이 비용이 큰
  # (~25 GB) 빌드가 운영자가 명시적으로 요청할 때만 실행되도록
  # test_gitlab_ci_vllm_derived_build_contract가 BUILD_VLLM_DERIVED /
  # DEPLOY_MODE=full 트리거를 요구한다. (GitLab 12.1.1은 최신 rule 엔진이 없어서
  # source-change 기반 자동 빌드 자체가 불가능하기도 하다.) source 변경 시 자동 빌드로
  # 바꾸는 건 팀 차원의 결정이다 -- 이 job 하나가 아니라 이 governance contract 자체를
  # 바꾸는 일이다. deploy_gitlab_compose.sh의 배포 가드가 이 수동 정책을 안전하게
  # 만든다 -- 이미지 source는 바뀌었는데 재빌드가 안 됐으면 크게 실패시켜서, 오래된
  # 이미지가 조용히 배포되는 일이 없도록 한다.
  only:
    refs:
      - release
      - tags
    variables:
      - $BUILD_VLLM_DERIVED == "1"
      - $DEPLOY_MODE == "full"
  allow_failure: false
  artifacts:
    # unified 이미지의 immutable digest -- 12B 프로필의 image override
    # (configs/main_model_profiles.yaml)에 고정하는 데 쓰인다.
    paths:
      - build/audio-image.env
    expire_in: 7 days

# 175 GPU 런타임 서버로의 수동 배포.
# Rolling 배포(기본값): gateway + admin-sidecar + risk-adapter만 재시작, vLLM 재빌드는 건너뜀.
# Full 런타임 배포: 파이프라인 트리거 시 DEPLOY_MODE=full로 설정 —
#   이 job 전에 build-vllm-derived가 자동 실행된다.
#   DEPLOY_MODE=full은 현재 파이프라인의 SHA 이미지를 RISK 기본값으로 쓴다.
# 필수 CI/CD 변수:
#   SSH_PRIVATE_KEY      file 타입 변수; 175의 DEPLOY_USER용 private key
#   DEPLOY_KNOWN_HOSTS   `ssh-keyscan <175-host>` 출력값
#   DEPLOY_HOST          175 내부 DNS/IP
#   DEPLOY_USER          175의 배포 사용자
#   DEPLOY_PATH          /opt/acl-ai-gateway
#   REGISTRY_DEPLOY_USER read_registry 권한을 가진 GitLab Deploy Token 사용자명
#   REGISTRY_DEPLOY_PASSWORD read_registry 권한을 가진 GitLab Deploy Token 비밀번호/토큰
# 선택 변수:
#   BUILD_VLLM_DERIVED   "1"로 설정하면 vLLM-derived 이미지만 빌드/push; DEPLOY_MODE를 따로 안 정하면 배포 모드는 rolling 유지
#   DEPLOY_COMPOSE_FILE  ops/compose/full-stack.private-network.yaml
#   DEPLOY_MODE          자동 감지(platform만 바뀌면 rolling; vLLM 이미지나 런타임에
#                        민감한 파일이 바뀌면 full). 명시적으로 지정하면 그 값을 강제한다.
#   GATEWAY_BIND_ADDR    gateway host publish용 175 인터페이스 주소
#   GATEWAY_HEALTH_URL   배포 후 확인할 명시적 health URL
#   RUN_READY_SMOKE      1 또는 0; 기본값 1
#   RISK_VLLM_IMAGE_TO_DEPLOY  full 배포 전용; 175 .env의 RISK_VLLM_IMAGE를 override
#   DEPLOY_RUNTIME_PROFILE     full 배포 런타임 시작 프로필(full_hot, main_only, retrieval_ready)
#   DEPLOY_DEFERRED_RUNTIMES   콤마로 구분한 deferred runtime 명시적 override; DEPLOY_RUNTIME_PROFILE보다 우선
deploy-gpu-175:
  stage: deploy
  image: alpine:3.20
  dependencies:
    - build-platform
    # build-vllm-derived는 full/BUILD_VLLM_DERIVED 파이프라인에서만 실행되므로,
    # rolling 배포에서는 build/audio-image.env 아티팩트가 없다(아래에서 처리).
    - build-vllm-derived
  tags:
    - ai-serving
    - docker-build
  before_script:
    - apk add --no-cache bash openssh-client rsync
    - eval "$(ssh-agent -s)"
    - chmod 400 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf "%s\n" "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - |
      test -f build/platform-image.env
      . build/platform-image.env
      case "${PLATFORM_IMAGE_DIGEST:-}" in
        "${CI_REGISTRY_IMAGE}/platform@"sha256:*) ;;
        *)
          echo "Invalid or missing PLATFORM_IMAGE_DIGEST artifact" >&2
          exit 1
          ;;
      esac
      if [ "${DEPLOY_MODE:-rolling}" = "full" ]; then
        _risk_vllm="${RISK_VLLM_IMAGE_TO_DEPLOY:-${RISK_VLLM_IMAGE_SHA}}"
      else
        _risk_vllm="${RISK_VLLM_IMAGE_TO_DEPLOY:-}"
      fi
      # build-vllm-derived가 실행됐으면 방금 빌드한 12B 멀티모달 이미지로 고정하고,
      # 아니면 AUDIO_VLLM_IMAGE를 그대로 둔다(배포가 현재 고정값을 유지).
      _audio_vllm="${AUDIO_VLLM_IMAGE_TO_DEPLOY:-}"
      if [ -f build/audio-image.env ]; then
        . build/audio-image.env
        case "${AUDIO_VLLM_IMAGE_DIGEST:-}" in
          *"@sha256:"*) _audio_vllm="${AUDIO_VLLM_IMAGE_DIGEST}" ;;
          *) echo "build/audio-image.env present but AUDIO_VLLM_IMAGE_DIGEST is not a digest" >&2; exit 1 ;;
        esac
      fi
      PLATFORM_IMAGE_TO_DEPLOY="${PLATFORM_IMAGE_DIGEST}" \
      RISK_VLLM_IMAGE_TO_DEPLOY="${_risk_vllm}" \
      AUDIO_VLLM_IMAGE_TO_DEPLOY="${_audio_vllm}" \
      DEPLOY_RELEASE_ID="${CI_COMMIT_SHA}" \
      bash scripts/ci/deploy_gitlab_compose.sh
  only:
    - release
  when: manual
  environment:
    name: gpu-175
