# 이 파일은 Grafana 대시보드가 실제로 질의하는 rule만 둔다. 대시보드를 지울 때
# 그 대시보드만 읽던 rule도 같이 지운다. 커밋 a943f37이 serving_home.json과
# observability_data_quality.json을 포함해 대시보드 6개를 지우면서 이 파일은
# 건드리지 않았고, 그 결과 읽는 쪽 없는 rule 10개가 남아 몇 달간 15초마다
# 평가됐다. 그 중 ai_serving_verdict_code는 기대 target 수가 vector(8)로 박혀
# 있었는데 기본 배포 profile(configs/deploy_profiles.yaml의 main_only)은 런타임
# 3개를 의도적으로 유예하므로 판정이 영구히 OBS_DEGRADED였다. 읽는 쪽이 없어
# 아무도 그 오판을 보지 못했다.
groups:
  - name: ai_model_serving_model_runtime
    interval: 15s
    rules:
      # GPU rules depend on DCGM exporter metric names. If the exporter is absent,
      # these series remain absent so dashboards show No Data rather than fake zeros.
      # Stat panels (worst-case single value) use the global aggregates below.
      # Timeseries panels query the raw DCGM_FI_* metrics directly to retain gpu_index.
      - record: gpu_memory_used_bytes
        expr: max(DCGM_FI_DEV_FB_USED * 1024 * 1024)
      - record: gpu_memory_headroom_bytes
        expr: min(DCGM_FI_DEV_FB_FREE * 1024 * 1024)
      - record: gpu_utilization_ratio
        expr: max(DCGM_FI_DEV_GPU_UTIL) / 100
      - record: gpu_temperature_celsius
        expr: max(DCGM_FI_DEV_GPU_TEMP)
      - record: gpu_power_watts
        expr: max(DCGM_FI_DEV_POWER_USAGE)
      # vLLM metric bridges. vLLM exposes colon-namespaced names (vllm:*)
      # which dashboards cannot reference directly without these rules.
      # Absent when vLLM exporter is not scraped → panels show No Data, not fake zeros.
      # vLLM documents KV cache usage as a ratio where 1 means 100% usage.
      # Normalize defensively because some runtime/exporter combinations have
      # emitted 0-100 percent-like samples under the *_perc metric name.
      # clamp_max(1) suppresses transient out-of-range spikes during model restart.
      # Keep the scrape labels used by Grafana variables and drop exporter-specific extras.
      - record: vllm_kv_cache_usage_ratio
        expr: clamp_max(max by (instance, model, runtime_service) ((vllm:kv_cache_usage_perc <= 1) or ((vllm:kv_cache_usage_perc > 1) / 100)), 1)
      - record: vllm_queue_depth
        expr: vllm:num_requests_waiting
      - record: vllm_token_throughput_per_second
        expr: sum by (instance, model, runtime_service) (rate(vllm:generation_tokens_total[5m]) + rate(vllm:prompt_tokens_total[5m]))
      # Input vs output token split for the usage dashboard. Same labels as the
      # combined throughput rule so Grafana variables stay consistent.
      - record: vllm_prompt_tokens_per_second
        expr: sum by (instance, model, runtime_service) (rate(vllm:prompt_tokens_total[5m]))
      - record: vllm_generation_tokens_per_second
        expr: sum by (instance, model, runtime_service) (rate(vllm:generation_tokens_total[5m]))
      # cAdvisor bridges for per-vLLM container host resources. Compose generated
      # container names vary by project directory, so use the compose service label.
      - record: vllm_container_memory_usage_bytes
        expr: max by (container_label_com_docker_compose_service) (container_memory_usage_bytes{container_label_com_docker_compose_service=~"main-llm-vllm|embedding-vllm|embedding-ko-vllm|risk-prompt-vllm"})
      - record: vllm_container_cpu_cores_used
        expr: sum by (container_label_com_docker_compose_service) (rate(container_cpu_usage_seconds_total{container_label_com_docker_compose_service=~"main-llm-vllm|embedding-vllm|embedding-ko-vllm|risk-prompt-vllm"}[1m]))
