# 자동 생성 파일입니다. 직접 수정하지 마세요.
# 소스: configs/monitoring.yaml + configs/services.yaml + configs/macos_mlx_runtime.yaml
# 명령: make render-runtime-assets
global:
  scrape_interval: 15s
  scrape_timeout: 10s
scrape_configs:
- job_name: gateway
  metrics_path: /metrics
  bearer_token_file: /run/secrets/admin_api_key
  static_configs:
  - targets:
    - gateway:9400
- job_name: mlx-runtime
  metrics_path: /metrics
  static_configs:
  - targets:
    - mlx-metrics-exporter:9416
    labels:
      model: local-main
      runtime_backend: mlx-vlm
