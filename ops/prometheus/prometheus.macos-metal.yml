global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: [gateway:9400]
  - job_name: mlx-runtime
    metrics_path: /metrics
    static_configs:
      - targets: [mlx-metrics-exporter:9416]
        labels:
          model: local-main
          runtime_backend: mlx-vlm
