    ports:
      - ${EMBEDDING_KO_VLLM_BIND_ADDR:-0.0.0.0}:${EMBEDDING_KO_VLLM_PORT:-9406}:9406
  risk-prompt-vllm:
    ports:
      - ${RISK_PROMPT_VLLM_BIND_ADDR:-0.0.0.0}:${RISK_PROMPT_VLLM_PORT:-9403}:9403
  prometheus:
    ports:
      - ${PROMETHEUS_BIND_ADDR:-0.0.0.0}:${PROMETHEUS_PORT:-9410}:9090
