# Standalone private-network hardening compose file.
# Gateway host bind is controlled by GATEWAY_BIND_ADDR. Use the 175 internal IP when possible, or 0.0.0.0 only with firewall/network policy.
# Risk Adapter, Prometheus, cAdvisor, DCGM exporter are not host-published (expose only, no ports).
# Grafana host publish default is 0.0.0.0; restrict with GRAFANA_BIND_ADDR (e.g. 127.0.0.1 for SSH-only access).
# Example: docker compose -f ops/compose/full-stack.private-network.yaml --env-file .env up -d
services:
  gateway:
    image: ${PLATFORM_IMAGE:?Set PLATFORM_IMAGE to a tested platform image tag}
    command:
    - python
    - -m
    - uvicorn
    - ai_model_serving.apps.gateway:app
    - --host
    - 0.0.0.0
    - --port
    - '9400'
    ports:
    - ${GATEWAY_BIND_ADDR:-0.0.0.0}:${GATEWAY_PORT:-9400}:9400
    env_file: ../../.env
    environment:
      HEALTHCHECK_PORT: '9400'
      APP_CONFIG_ROOT: /app
      PYTHONPATH: /app/src
      ADMIN_API_KEY_REQUIRED: '${ADMIN_API_KEY_REQUIRED:-true}'
      ADMIN_ENDPOINTS_INTERNAL_ONLY: '${ADMIN_ENDPOINTS_INTERNAL_ONLY:-false}'
      STRICT_ADMIN_ENDPOINT_SECURITY: '${STRICT_ADMIN_ENDPOINT_SECURITY:-true}'
    depends_on:
      risk-adapter:
        condition: service_healthy
      main-llm-vllm:
        condition: service_healthy
      embedding-vllm:
        condition: service_healthy
  risk-adapter:
    image: ${PLATFORM_IMAGE:?Set PLATFORM_IMAGE to a tested platform image tag}
    command:
    - python
    - -m
    - uvicorn
    - ai_model_serving.apps.risk_adapter:app
    - --host
    - 0.0.0.0
    - --port
    - '9405'
    ports: []
    env_file: ../../.env
    environment:
      HEALTHCHECK_PORT: '9405'
      APP_CONFIG_ROOT: /app
      PYTHONPATH: /app/src
      ADMIN_API_KEY_REQUIRED: '${ADMIN_API_KEY_REQUIRED:-true}'
      ADMIN_ENDPOINTS_INTERNAL_ONLY: '${ADMIN_ENDPOINTS_INTERNAL_ONLY:-false}'
      STRICT_ADMIN_ENDPOINT_SECURITY: '${STRICT_ADMIN_ENDPOINT_SECURITY:-true}'
    depends_on:
      risk-prompt-vllm:
        condition: service_healthy
    expose:
    - '9405'
  main-llm-vllm:
    image: ${VLLM_IMAGE:?Set VLLM_IMAGE to a tested vLLM OpenAI image tag}
    command:
    - --model
    - RedHatAI/gemma-4-26B-A4B-it-FP8-Dynamic
    - --served-model-name
    - local-main
    - --host
    - 0.0.0.0
    - --port
    - '9401'
    - --max-model-len
    - '16384'
    - --max-num-seqs
    - '1'
    - --max-num-batched-tokens
    - '16384'
    - --gpu-memory-utilization
    - '0.72'
    - --tensor-parallel-size
    - '1'
    - --dtype
    - auto
    - --trust-remote-code
    - --enable-prefix-caching
    - --prefix-caching-hash-algo
    - sha256_cbor
    - --enable-auto-tool-choice
    - --tool-call-parser
    - gemma4
    - --reasoning-parser
    - gemma4
    - --chat-template
    - /app/configs/gemma4_chat_template.jinja
    - --structured-outputs-config
    - '{"backend":"auto","enable_in_reasoning":true}'
    expose:
    - '9401'
    env_file: ../../.env
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
    volumes:
    - ${HF_CACHE_DIR:-./model_cache/huggingface}:/root/.cache/huggingface
    - ../../configs:/app/configs:ro
    healthcheck:
      test:
      - CMD-SHELL
      - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:9401/health')"
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
          - capabilities:
            - gpu
  embedding-vllm:
    image: ${VLLM_IMAGE:?Set VLLM_IMAGE to a tested vLLM OpenAI image tag}
    command:
    - --model
    - google/embeddinggemma-300m
    - --served-model-name
    - local-embed
    - --host
    - 0.0.0.0
    - --port
    - '9402'
    - --runner
    - pooling
    - --max-model-len
    - '2048'
    - --max-num-seqs
    - '2'
    - --max-num-batched-tokens
    - '2048'
    - --gpu-memory-utilization
    - '0.04'
    expose:
    - '9402'
    env_file: ../../.env
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
    volumes:
    - ${HF_CACHE_DIR:-./model_cache/huggingface}:/root/.cache/huggingface
    depends_on:
      main-llm-vllm:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:9402/health')"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
          - capabilities:
            - gpu
  risk-prompt-vllm:
    image: ${RISK_VLLM_IMAGE:?Set RISK_VLLM_IMAGE to a tested vLLM OpenAI image tag
      for risk models}
    command:
    - --model
    - kakaocorp/kanana-safeguard-prompt-2.1b
    - --served-model-name
    - risk-prompt
    - --host
    - 0.0.0.0
    - --port
    - '9403'
    - --max-model-len
    - '2048'
    - --max-num-seqs
    - '1'
    - --max-num-batched-tokens
    - '2048'
    - --gpu-memory-utilization
    - '0.065'
    - --dtype
    - bfloat16
    - --quantization
    - bitsandbytes
    - --load-format
    - bitsandbytes
    - --trust-remote-code
    - --enforce-eager
    depends_on:
      embedding-vllm:
        condition: service_healthy
    expose:
    - '9403'
    env_file: ../../.env
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
    volumes:
    - ${HF_CACHE_DIR:-./model_cache/huggingface}:/root/.cache/huggingface
    healthcheck:
      test:
      - CMD-SHELL
      - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:9403/health')"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
          - capabilities:
            - gpu
  dcgm-exporter:
    image: ${DCGM_EXPORTER_IMAGE:?Set DCGM_EXPORTER_IMAGE to a tested NVIDIA dcgm-exporter
      image tag}
    user: 0:0
    privileged: true
    cap_add:
    - SYS_ADMIN
    expose:
    - '9400'
    ports: []
    deploy:
      resources:
        reservations:
          devices:
          - capabilities:
            - gpu
  cadvisor:
    image: ${CADVISOR_IMAGE:?Set CADVISOR_IMAGE to a tested cAdvisor image tag}
    privileged: true
    expose:
    - '8080'
    ports: []
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker:/var/lib/docker:ro
    devices:
    - /dev/kmsg:/dev/kmsg
  prometheus:
    image: ${PROMETHEUS_IMAGE:?Set PROMETHEUS_IMAGE to a tested Prometheus image tag}
    depends_on:
    - gateway
    - risk-adapter
    - main-llm-vllm
    - embedding-vllm
    - risk-prompt-vllm
    - dcgm-exporter
    - cadvisor
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    ports: []
    volumes:
    - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ../prometheus/rules:/etc/prometheus/rules:ro
    - ../../.runtime/prometheus/admin_api_key:/run/secrets/admin_api_key:ro
    expose:
    - '9090'
  grafana:
    image: ${GRAFANA_IMAGE:?Set GRAFANA_IMAGE to a tested Grafana image tag}
    depends_on:
    - prometheus
    ports:
    - ${GRAFANA_BIND_ADDR:-0.0.0.0}:${GRAFANA_PORT:-9411}:3000
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD
        must be generated by make init-env-compose}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_AUTH_ANONYMOUS_ORG_ROLE: ${GRAFANA_ANONYMOUS_ORG_ROLE:-Viewer}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gpu_capacity_and_oom_risk.json
    volumes:
    - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    - ../grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    - ../grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
