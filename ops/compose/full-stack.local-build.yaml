# Local development override: builds colbert-ko-vllm image from source instead of pulling from registry.
# Use this override ONLY for local development and testing — never in production.
#
# Usage:
#   docker compose \
#     --env-file .env \
#     -f ops/compose/full-stack.private-network.yaml \
#     -f ops/compose/full-stack.local-build.yaml \
#     up -d --build colbert-ko-vllm
#
# This file overrides the `image` and adds a `build` block for colbert-ko-vllm.
# The production compose (full-stack.private-network.yaml) must NEVER contain a build block.
# COLBERT_KO_VLLM_IMAGE is not required when using this override (the local build tag is applied).
services:
  colbert-ko-vllm:
    image: ai-model-serving-colbert-ko-vllm:local
    build:
      context: ../..
      dockerfile: ops/docker/Dockerfile.colbert-ko-vllm
