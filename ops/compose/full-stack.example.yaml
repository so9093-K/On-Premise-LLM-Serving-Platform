# Example full-stack compose file. Run from the repository root with:
# docker compose -f ops/compose/full-stack.example.yaml --env-file .env up
# Choose tested image tags, model cache volume paths, GPU runtime settings, and secrets for the target host.
# This file intentionally does not use :latest images.
services:
  gateway:
    image: ${PLATFORM_IMAGE:?Set PLATFORM_IMAGE to a tested platform image tag}
    command: ["python", "-m", "uvicorn", "ai_model_serving.apps.gateway:app", "--host", "0.0.0.0", "--port", "9400"]
    ports: ["${GATEWAY_PORT:-9400}:9400"]
    env_file: ../../.env
    environment:
      HEALTHCHECK_PORT: "9400"
      APP_CONFIG_ROOT: "/app"
      PYTHONPATH: "/app/src"
    depends_on:
      risk-adapter:
        condition: service_healthy
      main-llm-vllm:
        condition: service_healthy
      embedding-vllm:
        condition: service_healthy
      colbert-ko-vllm:
        condition: service_healthy

  risk-adapter:
    image: ${PLATFORM_IMAGE:?Set PLATFORM_IMAGE to a tested platform image tag}
    command: ["python", "-m", "uvicorn", "ai_model_serving.apps.risk_adapter:app", "--host", "0.0.0.0", "--port", "9405"]
    ports: ["${RISK_ADAPTER_PORT:-9405}:9405"]
    env_file: ../../.env
    environment:
      HEALTHCHECK_PORT: "9405"
      APP_CONFIG_ROOT: "/app"
      PYTHONPATH: "/app/src"
    depends_on:
      risk-prompt-vllm:
        condition: service_healthy

  main-llm-vllm:
    image: ${VLLM_IMAGE:?Set VLLM_IMAGE to a tested vLLM OpenAI image tag}
    command: ["--model", "RedHatAI/gemma-4-26B-A4B-it-FP8-Dynamic", "--served-model-name", "local-main", "--host", "0.0.0.0", "--port", "9401", "--max-model-len", "16384", "--max-num-seqs", "1", "--max-num-batched-tokens", "16384", "--gpu-memory-utilization", "0.72", "--tensor-parallel-size", "1", "--dtype", "auto", "--trust-remote-code", "--enable-prefix-caching", "--prefix-caching-hash-algo", "sha256_cbor", "--enable-auto-tool-choice", "--tool-call-parser", "gemma4", "--reasoning-parser", "gemma4", "--chat-template", "/app/configs/gemma4_chat_template.jinja", "--structured-outputs-config", "{\"backend\":\"auto\",\"enable_in_reasoning\":true}"]
    expose: ["9401"]
    env_file: ../../.env
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ${HF_CACHE_DIR:-./model_cache/huggingface}:/root/.cache/huggingface
      - ../../configs:/app/configs:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9401/health')\""]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices: [{capabilities: [gpu]}]

  embedding-vllm:
    image: ${VLLM_IMAGE:?Set VLLM_IMAGE to a tested vLLM OpenAI image tag}
    command: ["--model", "google/embeddinggemma-300m", "--served-model-name", "local-embed", "--host", "0.0.0.0", "--port", "9402", "--runner", "pooling", "--max-model-len", "2048", "--max-num-seqs", "2", "--max-num-batched-tokens", "2048", "--gpu-memory-utilization", "0.04"]
    expose: ["9402"]
    env_file: ../../.env
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ${HF_CACHE_DIR:-./model_cache/huggingface}:/root/.cache/huggingface
    depends_on:
      main-llm-vllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9402/health')\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices: [{capabilities: [gpu]}]

  colbert-ko-vllm:
    image: ${COLBERT_KO_VLLM_IMAGE:?Set COLBERT_KO_VLLM_IMAGE to a tested ColBERT-ko vLLM image tag}
    command: ["--model", "/models/colbert-ko-vllm", "--tokenizer", "/models/colbert-ko-vllm/tokenizer", "--served-model-name", "local-colbert-ko", "--host", "0.0.0.0", "--port", "9404", "--runner", "pooling", "--convert", "embed", "--trust-remote-code", "--pooler-config.task", "token_embed", "--dtype", "float32", "--max-model-len", "2048", "--max-num-seqs", "1", "--max-num-batched-tokens", "2048", "--gpu-memory-utilization", "${COLBERT_KO_GPU_MEMORY_UTILIZATION:-0.06}"]
    expose: ["9404"]
    env_file: ../../.env
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ${HF_CACHE_DIR:-./model_cache/huggingface}:/root/.cache/huggingface
      - ${COLBERT_KO_MODEL_DIR:?Set COLBERT_KO_MODEL_DIR to prepared ColBERT-ko artifact directory}:/models/colbert-ko-vllm:ro
    depends_on:
      embedding-vllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9404/health')\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices: [{capabilities: [gpu]}]

  risk-prompt-vllm:
    image: ${RISK_VLLM_IMAGE:?Set RISK_VLLM_IMAGE to a tested vLLM OpenAI image tag for risk models}
    command: ["--model", "kakaocorp/kanana-safeguard-prompt-2.1b", "--served-model-name", "risk-prompt", "--host", "0.0.0.0", "--port", "9403", "--max-model-len", "2048", "--max-num-seqs", "1", "--max-num-batched-tokens", "2048", "--gpu-memory-utilization", "0.065", "--dtype", "bfloat16", "--quantization", "bitsandbytes", "--load-format", "bitsandbytes", "--trust-remote-code", "--enforce-eager"]
    depends_on:
      embedding-vllm:
        condition: service_healthy
      # Keep vLLM runtime startup serialized on a shared GPU. vLLM profiles
      # free memory during init, and concurrent ColBERT/risk startup can make
      # that profiling fail even when steady-state GPU budget is valid.
      colbert-ko-vllm:
        condition: service_healthy
    expose: ["9403"]
    env_file: ../../.env
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ${HF_CACHE_DIR:-./model_cache/huggingface}:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9403/health')\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices: [{capabilities: [gpu]}]

  dcgm-exporter:
    image: ${DCGM_EXPORTER_IMAGE:?Set DCGM_EXPORTER_IMAGE to a tested NVIDIA dcgm-exporter image tag}
    user: "0:0"
    privileged: true
    cap_add: ["SYS_ADMIN"]
    expose: ["9400"]
    ports: ["${DCGM_EXPORTER_PORT:-9412}:9400"]
    deploy:
      resources:
        reservations:
          devices: [{capabilities: [gpu]}]

  cadvisor:
    image: ${CADVISOR_IMAGE:?Set CADVISOR_IMAGE to a tested cAdvisor image tag}
    privileged: true
    expose: ["8080"]
    ports: ["${CADVISOR_PORT:-9413}:8080"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    devices:
      - /dev/kmsg:/dev/kmsg

  prometheus:
    image: ${PROMETHEUS_IMAGE:?Set PROMETHEUS_IMAGE to a tested Prometheus image tag}
    depends_on: [gateway, risk-adapter, main-llm-vllm, embedding-vllm, colbert-ko-vllm, risk-prompt-vllm, dcgm-exporter, cadvisor]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["${PROMETHEUS_PORT:-9410}:9090"]
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
    secrets:
      - source: prometheus_admin_api_key
        target: admin_api_key

  grafana:
    image: ${GRAFANA_IMAGE:?Set GRAFANA_IMAGE to a tested Grafana image tag}
    depends_on: [prometheus]
    ports: ["${GRAFANA_PORT:-9411}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: ${GRAFANA_ANONYMOUS_ORG_ROLE:-Viewer}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gpu_capacity_and_oom_risk.json
    volumes:
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ../grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro

secrets:
  prometheus_admin_api_key:
    file: ../../.runtime/prometheus/admin_api_key
