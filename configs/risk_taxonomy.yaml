families:
  prompt_attack:
    display_name_ko: 프롬프트 공격
    display_name_en: Prompt Attack
    source_model: kakaocorp/kanana-safeguard-prompt-2.1b
    codes:
      A1:
        name: Prompt Injection
        display_name_ko: 프롬프트 인젝션
        display_name_en: Prompt Injection
        description_ko: LLM의 지침을 무시하거나 시스템 동작을 변경하려는 의도로 우회하려는 조작된 발화
        description_en: Manipulated utterance intended to bypass instructions or alter system behavior.
      A2:
        name: Prompt Leaking
        display_name_ko: 프롬프트 유출
        display_name_en: Prompt Leaking
        description_ko: 프롬프트, 학습 데이터 등 AI 시스템의 내부 정보를 유출하려는 발화
        description_en: Utterance intended to leak internal AI system information such as prompts or training data.

  data_exposure:
    display_name_ko: 민감정보 노출
    display_name_en: Sensitive Data Exposure
    source_model: local
    description_ko: >
      PII Protection(한국형 식별자·이메일·전화번호·IP 정규식)과 Secret Exposure Signal(curated regex + entropy)로 구성되는
      로컬 탐지 계층. 탐지 결과는 최종 정책 판단이 아닌 진단 signal로 제공된다.
      원문 민감값은 응답·로그·metric에 남기지 않는다.
    codes:
      D1:
        name: Personal Identifier
        display_name_ko: 개인 식별자
        display_name_en: Personal Identifier
        description_ko: 주민등록번호(KR_RRN), 외국인등록번호(KR_FRN), 여권번호(KR_PASSPORT), 운전면허번호(KR_DRIVER_LICENSE), 성명(PERSON) 등 개인을 직접 식별하는 정보
        description_en: Directly identifying personal information such as national ID (KR_RRN), foreign resident registration number (KR_FRN), passport number, driver's license number, or person name.
        entity_labels:
          - KR_RRN
          - KR_FRN
          - KR_PASSPORT
          - KR_DRIVER_LICENSE
          - PERSON
      D2:
        name: Contact and Location Information
        display_name_ko: 연락처 및 위치 정보
        display_name_en: Contact and Location Information
        description_ko: 이메일 주소(EMAIL_ADDRESS), 전화번호(PHONE_NUMBER), 주소(ADDRESS) 등 연락 및 위치 정보
        description_en: Contact and location information such as email address, phone number, or physical address.
        entity_labels:
          - EMAIL_ADDRESS
          - PHONE_NUMBER
          - ADDRESS
      D3:
        name: Financial Identifier
        display_name_ko: 금융 식별자
        display_name_en: Financial Identifier
        description_ko: 신용카드 번호(CREDIT_CARD), 사업자등록번호(KR_BRN), 계좌번호 후보(BANK_ACCOUNT_CANDIDATE) 등 금융 관련 식별 정보
        description_en: Financial identifiers such as credit card numbers, business registration numbers (KR_BRN), or bank account candidates.
        entity_labels:
          - CREDIT_CARD
          - KR_BRN
          - BANK_ACCOUNT_CANDIDATE
      D4:
        name: Secret or Credential
        display_name_ko: 시크릿 또는 자격증명
        display_name_en: Secret or Credential
        description_ko: API 키, 액세스 토큰, JWT, private key block, 비밀번호 할당 등 자격증명 및 시크릿 정보
        description_en: Secrets and credentials such as API keys, access tokens, JWTs, private key blocks, or password assignments.
        entity_labels:
          - OPENAI_API_KEY
          - AWS_ACCESS_KEY_ID
          - AWS_SECRET_ACCESS_KEY
          - GITHUB_TOKEN
          - GITLAB_TOKEN
          - HUGGINGFACE_TOKEN
          - JWT
          - PRIVATE_KEY_BLOCK
          - PASSWORD_ASSIGNMENT
          - GENERIC_SECRET_CANDIDATE
      D5:
        name: Network or Infrastructure Identifier
        display_name_ko: 네트워크 및 인프라 식별자
        display_name_en: Network or Infrastructure Identifier
        description_ko: IP 주소(IP_ADDRESS), URL(URL), 데이터베이스 연결 URL(DATABASE_URL) 등 네트워크 및 인프라 식별 정보
        description_en: Network and infrastructure identifiers such as IP addresses, URLs, or database connection URLs.
        entity_labels:
          - IP_ADDRESS
          - URL
          - DATABASE_URL

system_signals:
  PARSE_ERROR:
    retryable: true
    description_ko: detector 출력 label을 contract label로 파싱하지 못함
  INFERENCE_ERROR:
    retryable: true
    description_ko: 내부 모델 호출 중 오류 발생
  INFERENCE_TIMEOUT:
    retryable: true
    description_ko: 내부 모델 호출 timeout
  TRUNCATED_INPUT:
    retryable: false
    description_ko: 입력이 모델 또는 policy 제한으로 절단됨
  INFERENCE_QUEUE_TIMEOUT:
    retryable: true
    description_ko: inference queue 대기 시간 초과
  GPU_MEMORY_PRESSURE:
    retryable: true
    description_ko: GPU memory reserve 부족 또는 OOM 위험 감지
