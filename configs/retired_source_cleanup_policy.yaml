policy_name: retired_source_cleanup_policy
canonical_decision: docs/02_decision_register.md#D-001
allowed_retired_source_references:
  - docs/01_project_background.md
  - docs/02_decision_register.md
  - docs/governance/policies/retired_source_cleanup_policy.md
allowed_retired_source_scope:
  - concise decision records
  - summarized source background
  - tests-only fixtures
prohibited_release_paths:
  - reports/source_file_inventory.csv
  - docs/reviews/source_file_inventory_summary.md
  - reports/full_project_model_feature_review_2026-05-06.md
  - reports/project_ux_and_hardening_review_2026-05-06.md
  - reports/operational_ux_hardening_review_0.1.6_2026-05-06.md
  - reports/env_image_automation_review_0.1.7_2026-05-06.md
  - reports/maintenance_version_rebaseline_0.1.0-rc.1_2026-05-06.md
  - legacy/
  - old/
  - archive/
prohibited_release_patterns:
  - '*_legacy.*'
  - '*_old.*'
  - '*_bak.*'
  - '*.orig'
  - '.pytest_cache'
  - '__pycache__'
  - '*.pyc'
  - 'dist/'
  - 'logs/'
  - 'outputs/'
  - 'model_cache/'
  - 'models/'
  - '.env'
  - '.env.*'
allowed_environment_files:
  - .env.example
  - .env.local.example
  - .env.compose.example
mock_policy:
  runtime_mock_allowed: false
  allowed_scope: tests_only
  allowed_paths:
    - tests/

prohibited_refactor_report_patterns:
  - reports/refactor/file_review_matrix.csv
  - reports/refactor/file_review_matrix_2026-*.csv
  - reports/refactor/file_review_matrix_phase[0-9]_*.csv
  - reports/refactor/refactor_execution_summary*.md
  - reports/refactor/remaining_work_backlog*.md
  - reports/refactor/phase[0-9]_summary_*.md
  - reports/refactor/phase1[0-3]_summary_*.md
  - reports/refactor/refactor_phase0_code.diff
  - reports/refactor/worklog.md
  - reports/refactor/validation/*.log
  - reports/refactor/file_review_matrix_phase1[0-6]_*.csv
  - reports/refactor/phase1[4-6]_*.md
  - reports/refactor/removed_legacy_reports_phase14_*.txt
  - reports/refactor/documentation_consistency_phase*.md
  - reports/refactor/integrated_management_ux_phase*.md
  - reports/refactor/phase*_summary_*.md
  - reports/refactor/phase*_validation_summary_*.md
  - reports/refactor/removed_legacy_reports_phase*.txt
  - reports/refactor/current_refactor_state_*.md
  - reports/refactor/project_inventory_phase*.csv
  - reports/refactor/project_inventory_phase*.json
  - reports/refactor/project_inventory_phase*.md
