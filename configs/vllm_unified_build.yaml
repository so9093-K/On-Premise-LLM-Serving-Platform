# vLLM unified Docker build의 실제 입력값이다. 일반 runtime image tag와 분리하며,
# base image 또는 호환성 pin을 바꾸면 Unified vLLM image를 다시 빌드해야 한다.
target_platform: linux/amd64
base_image_default: vllm/vllm-openai@sha256:6a090ed9d4a3739813ce355cbd63d4c34c987a25c8409796f24912ba71c2d4a4
compatibility_pins:
  # base_image_default에 들어 있어야 하는 정확한 package 버전이다. derived image는
  # 이를 검증할 뿐, vLLM이 구성한 dependency 집합을 pip install로 교체하지 않는다.
  transformers: 5.13.1
  huggingface_hub: 1.23.0
