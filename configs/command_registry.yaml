schema_version: 1

categories:
  - id: init
    title: 환경 초기화
  - id: validate_test_build
    title: 검증·테스트·빌드
  - id: start_stop
    title: 기동·종료
  - id: readiness
    title: Readiness·상태
  - id: model
    title: 모델·버전
  - id: auth
    title: 인증·노출 제어
  - id: reports
    title: 운영 산출물·리포트
