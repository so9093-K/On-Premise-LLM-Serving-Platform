# ── 문서화되지 않은 Makefile target allowlist ────────────────────────────────
# registry가 아닌 내부 helper, alias, implementation detail target을 명시적으로 관리한다.
# 각 항목은 target, owner, reason이 모두 있어야 한다.
allow_unregistered_make_targets:
  - target: init-env
    owner: operations
    reason: "alias for init-env-compose; docs는 항상 init-env-compose를 직접 참조하므로 별도 등록 불필요"
  - target: init-env-local-force
    owner: operations
    reason: "강제 재생성 advanced variant; user-facing 문서에 안내하지 않음 — 필요 시 init-env-local 재실행 권장"
  - target: show-image-tags
    owner: operations
    reason: "setup_env.py --show-image-tags 래퍼; 내부 setup 흐름에서만 사용, user-facing 문서 없음"
  - target: check-ready
    owner: operations
    reason: "ready_full.sh backward-compat alias; docs는 ready-full을 직접 참조"
  - target: compose-down-private
    owner: operations
    reason: "private_network compose 전용 종료; compose-down으로 동일 목적 달성 가능, user-facing 문서 없음"
  - target: compose-logs
    owner: operations
    reason: "docker compose logs 래퍼; 일반 운영자는 docker compose logs 또는 make logs 사용, user-facing 문서 없음"
  - target: logs
    owner: operations
    reason: "tail -f gateway.log risk_adapter.log 래퍼; local app-only 디버깅용, user-facing 문서 없음"
  - target: model-inventory
    owner: operations
    reason: "modelctl 내부 inventory helper; model-list/model-status/model-validate가 user-facing entrypoint"
  - target: validate-docs
    owner: release-engineering
    reason: "make validate의 내부 step (check_docs_links + check_reports + check_features); user-facing으로 직접 안내하지 않음"
