    audience: [developer, operator, release_engineer]
    description: "registry 기반 compact help를 출력한다."
    command: make help
    kind: public
    safety: read_only
    requires:
      python: true
      docker: false
      gpu: false
      live_services: false
      secrets: false
      env_file: false
    writes_files: []
    outputs: [stdout]
    owner: operations
    docs:
      - docs/START_HERE.md
      - docs/README.md
    tests:
      - tests/contract/test_command_registry.py

  - make_target: help-full
