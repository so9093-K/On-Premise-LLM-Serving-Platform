version: 0.1.0
version_semantics: "model catalog schema version, not package release version"
last_reviewed: 2026-05-05
source_of_truth: configs/model_catalog.yaml
models:
  local-main:
    role: main_llm
    upstream_model_id: RedHatAI/gemma-4-26B-A4B-it-FP8-Dynamic
    base_model_id: google/gemma-4-26B-A4B-it
    provider: RedHatAI
    family: Gemma 4
    parameter_class: 26B-A4B
    license: gemma
    access: public_huggingface
    primary_capability: chat.completions
    input_modalities:
    - text
    - image
    deployed_modalities:
    - text
    - image
    output_modalities:
    - text
    quantization: FP8 compressed-tensors
    runtime:
      backend: vllm
      served_model_name: local-main
      port: 9401
      endpoint: /v1/chat/completions
    source_facts:
      base_model_id: google/gemma-4-26B-A4B-it
      quantization: offline FP8 checkpoint for vLLM, stored as compressed-tensors
      vllm_min_version: 0.19.0
      transformers_min_version: 5.5.0
      release_status: preliminary upstream checkpoint; subject to change
      tokenizer_artifacts:
      - tokenizer.json
      - tokenizer_config.json
      cuda_runtime_note: RedHatAI card validates on B200 and says to run on vLLM
        main; RTX 6000 Ada requires local boot, tokenizer canary, and runtime validation
        before production claims
      upstream_example:
        tensor_parallel_size: 1
        max_model_len: 96000
        trust_remote_code: true
        enable_auto_tool_choice: true
        tool_call_parser: gemma4
        reasoning_parser: gemma4
        chat_template: /app/configs/gemma4_chat_template.jinja
        dtype: auto
        quantization: model_config compressed-tensors; do not pass --quantization fp8
      supported_modalities:
      - text
      - image
      upstream_context_length_tokens:
        vllm_recipe: 131072
        redhat_card_example_max_model_len: 96000
        project_runtime_cap: 16384
      parameter_summary:
        vllm_recipe: 26B total / 4B active
        hf_display: 27B params
    project_runtime_policy:
      tensor_parallel_size: 1
      max_model_len: 16384
      max_num_seqs: 1
      max_num_batched_tokens: 16384
      gpu_memory_utilization: 0.72
      trust_remote_code: true
      policy_reason: RTX 6000 Ada conservative start for RedHatAI preliminary FP8
        checkpoint; upstream example uses 96K context on B200/vLLM main, so this
        platform keeps 16K seq=1 until local tokenizer, boot, quality, latency, and
        soak validation pass
      max_output_tokens: 1024
      input_modalities:
      - text
      - image
      chat_content_contract: OpenAI chat content string or content parts with text
        and image_url
      max_image_inputs: 1
      allowed_image_url_schemes:
      - data
      image_url_policy_reason: avoid arbitrary server-side URL fetch by default; validate
        MIME, decoded image bytes, and image dimensions; external HTTPS image fetch
        should be enabled only behind an egress policy
      max_image_bytes: 750000
      max_image_pixels: 1048576
      allowed_image_mime_types:
      - image/jpeg
      - image/png
      - image/webp
      runtime_features:
        prefix_caching:
          enabled: true
          hash_algo: sha256_cbor
        tool_calling:
          enabled: true
          tool_call_parser: gemma4
          reasoning_parser: gemma4
          chat_template: /app/configs/gemma4_chat_template.jinja
          allow_parallel_tool_calls: false
        reasoning:
          enabled: true
          default: false
          request_parameter: reasoning
          upstream_chat_template_kwargs:
            enable_thinking: true
      request_parameter_policy: bounded allowlist in configs/model_serving.yaml; unknown
        chat fields rejected at Gateway
    gateway_listing:
      enabled: true
      backend: main_llm_vllm
      capabilities:
      - chat.completions
      - chat.completions.vision
      - chat.completions.tools
    lifecycle:
      state: active
      exposure: public
      owner: platform
      added_at: 2026-05-10
      deprecation_deadline: null
      removal_ticket: null
      add_or_remove_via:
      - configs/model_catalog.yaml
      - configs/model_serving.yaml
      - contracts/model_contracts.yaml
      - model_cards/<logical-id>.json
      - specs/schemas/model_list_response.schema.json
      - tests/contract/test_runtime_policy.py
      removal_rule: remove from catalog, serving config, model contract, model card,
        public model schema enum, and runtime validation expectations in one change
  local-embed:
    role: embedding
    upstream_model_id: google/embeddinggemma-300m
    provider: Google DeepMind
    family: EmbeddingGemma
    parameter_class: 300M
    license: gemma
    access: gated_terms_acceptance_required
    primary_capability: embeddings
    input_modalities:
    - text
    output_modalities:
    - embedding
    embedding_dimensions:
      default: 768
      matryoshka_supported:
      - 768
      - 512
      - 256
      - 128
    max_input_tokens: 2048
    runtime:
      backend: vllm
      runner: pooling
      served_model_name: local-embed
      port: 9402
      endpoint: /v1/embeddings
    source_facts:
      model_size: 300M parameters
      license: gemma
      access: public repository with usage-license acceptance required for files and
        content
      max_input_tokens: 2048
      default_embedding_dimension: 768
      matryoshka_dimensions:
      - 768
      - 512
      - 256
      - 128
      intended_runtime_from_card: Sentence Transformers
    project_runtime_policy:
      runner: pooling
      max_model_len: 2048
      embedding_dimension_default: 768
      embedding_dimension_supported:
      - 768
      - 512
      - 256
      - 128
      max_num_seqs: 2
      max_num_batched_tokens: 2048
      gpu_memory_utilization: 0.04
      policy_reason: serve EmbeddingGemma through the platform embedding API while
        preserving model-card token and dimension limits
    retrieval:
      backend: dense_embedding
      score_function: cosine
      score_mode: dense_cosine
    gateway_listing:
      enabled: true
      backend: embedding_vllm
      capabilities:
      - embeddings
      - retrieval_rerank
      - retrieval_score
    lifecycle:
      state: active
      exposure: public
      owner: platform
      added_at: 2026-05-10
      deprecation_deadline: null
      removal_ticket: null
      add_or_remove_via:
      - configs/model_catalog.yaml
      - configs/model_serving.yaml
      - contracts/model_contracts.yaml
      - model_cards/<logical-id>.json
      - specs/schemas/model_list_response.schema.json
      - tests/contract/test_runtime_policy.py
      removal_rule: remove from catalog, serving config, model contract, model card,
        public model schema enum, and runtime validation expectations in one change
  local-colbert-ko:
    role: retrieval
    upstream_model_id: sigridjineth/colbert-ko-embeddinggemma-300m
    provider: sigridjineth
    family: ColBERT-Ko EmbeddingGemma
    parameter_class: 300M
    license: apache-2.0
    access: public_huggingface
    primary_capability: retrieval_rerank
    input_modalities:
    - text
    output_modalities:
    - token_embeddings
    max_input_tokens: 2048
    runtime:
      backend: vllm_native
      runner: pooling
      served_model_name: local-colbert-ko
      port: 9404
      internal_endpoint: /v1/score
      public_adapter_endpoint: /v1/retrieval/rerank
      service: colbert-ko-vllm
      runtime_model_path: /models/colbert-ko-vllm
      tokenizer: /models/colbert-ko-vllm/tokenizer
      production_vllm_native: true
      promotion_status: production_vllm_native
    source_facts:
      model_size: 300M parameters
      license: apache-2.0
      access: public repository on Hugging Face
      base_model: google/embeddinggemma-300m
      base_model_license: gemma
      architecture: ColBERT late-interaction scoring on EmbeddingGemma-300M backbone
      scoring_method: late_interaction_maxsim
      languages:
      - ko
      - en
      max_input_tokens: 2048
      repo_layout: root contains encoder/, tokenizer/, proj.pt, and inference.py;
        root does not contain config.json.
      projection_head: proj.pt must be applied after encoder hidden states before
        L2 normalization and MaxSim scoring.
      intended_runtime: vLLM pooling runner with token_embed pooler and /v1/score,
        /v1/rerank, and /pooling endpoints.
      output_type: token_level_embeddings_for_maxsim_scoring
      vllm_native_docs:
      - https://docs.vllm.ai/en/latest/models/pooling_models/
      - https://docs.vllm.ai/en/latest/models/pooling_models/scoring/
    project_runtime_policy:
      runner: pooling
      dtype: float32
      max_model_len: 2048
      max_num_seqs: 1
      max_num_batched_tokens: 2048
      gpu_memory_utilization: 0.06
      query_max_tokens: 128
      doc_max_tokens: 192
      doc_max_tokens_max: 1024
      max_docs_per_rerank: 32
      colbert_token_embeddings_public: false
      promotion_gate: reference adapter ranking parity with vLLM native output
      production_vllm_native: true
      policy_reason: ColBERT-Ko late-interaction retrieval on EmbeddingGemma-300M
        backbone; production uses prepared vLLM artifact so proj.pt is applied.
      vllm_args_notes: '--pooler-config.task token_embed is required; --model-impl
        transformers must NOT be used; --dtype must be set explicitly.'
    retrieval:
      backend: vllm_native_late_interaction
      score_function: maxsim
      score_mode: late_interaction_maxsim
      production_vllm_native: true
    reference_adapter:
      enabled_for_parity: true
      production_fallback: false
    gateway_listing:
      enabled: true
      backend: colbert_ko_vllm
      capabilities:
      - retrieval_rerank
      - retrieval_score
      - retrieval_token_embeddings
    lifecycle:
      state: active
      exposure: public
      owner: platform
      added_at: 2026-05-18
      deprecation_deadline: null
      removal_ticket: null
      add_or_remove_via:
      - configs/model_catalog.yaml
      - configs/model_serving.yaml
      - contracts/model_contracts.yaml
      - model_cards/<logical-id>.json
      - specs/schemas/model_list_response.schema.json
      - tests/contract/test_runtime_policy.py
      removal_rule: remove from catalog, serving config, model contract, model card,
        public model schema enum, and runtime validation expectations in one change
  risk-prompt:
    role: risk_prompt_detector
    upstream_model_id: kakaocorp/kanana-safeguard-prompt-2.1b
    provider: Kakao Corp.
    family: Kanana Safeguard-Prompt
    parameter_class: 2.1B
    license: apache-2.0
    access: public_huggingface
    primary_capability: risk.prompt_attack_signal
    input_modalities:
    - text
    output_modalities:
    - single_label_token
    output_format:
      safe: <SAFE>
      unsafe_pattern: <UNSAFE-Ax>
      known_codes:
      - A1
      - A2
    runtime:
      backend: vllm
      served_model_name: risk-prompt
      port: 9403
      internal_endpoint: /v1/chat/completions
      public_adapter_endpoint: /v1/risk/detectors/prompt/assessments
      max_output_tokens: 1
    source_facts:
      single_label_token: true
      safe_label: <SAFE>
      unsafe_pattern: <UNSAFE-Ax>
      known_codes:
      - A1
      - A2
      languages:
      - ko
      - en
      transformers_min_version: 4.52.4
      config_shape:
        model_type: llama
        architecture: LlamaForCausalLM
        hidden_size: 1792
        num_attention_heads: 24
        num_key_value_heads: 8
        head_dim: 128
        hidden_size_divisible_by_attention_heads: false
        attention_projection_width: 3072
        requires_runtime_head_dim_support: true
      model_card_max_new_tokens: 1
      evaluation_basis: first generated token
    project_runtime_policy:
      max_output_tokens: 1
      temperature: 0
      prompt_format: chat_template-compatible user message
      policy_reason: model card defines one-token classification output and example
        generation uses max_new_tokens=1
      runtime_features:
        tool_calling:
          enabled: false
        prefix_caching:
          enabled: false
    gateway_listing:
      enabled: true
      backend: risk_adapter
      capabilities:
      - risk.prompt_attack_signal
    lifecycle:
      state: active
      exposure: public
      owner: platform
      added_at: 2026-05-10
      deprecation_deadline: null
      removal_ticket: null
      add_or_remove_via:
      - configs/model_catalog.yaml
      - configs/model_serving.yaml
      - contracts/model_contracts.yaml
      - model_cards/<logical-id>.json
      - specs/schemas/model_list_response.schema.json
      - tests/contract/test_runtime_policy.py
      removal_rule: remove from catalog, serving config, model contract, model card,
        public model schema enum, and runtime validation expectations in one change
