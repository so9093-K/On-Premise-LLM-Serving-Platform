# Gateway가 인식하는 논리 모델과 공개 API listing의 기준이다.
# 실행 정책은 model_serving.yaml, Main Model 전환·부팅은 main_model_profiles.yaml이 맡는다.
models:
  local-main:
    role: main_llm
    # 이 값은 정적 registry 항목이지 부팅 신원이 아니다. 실제로 로딩되는 가중치는
    # main_model_profiles.yaml의 활성 profile이 소유하며(전환하면 바뀐다), 공개
    # API와 metric은 그 활성 profile 값을 쓴다. 여기 값은 model_serving.yaml의
    # main_llm.name과 짝을 이뤄야 하고, 어긋나면 settings 로딩이 기동을 막는다.
    upstream_model_id: RedHatAI/gemma-4-12B-it-FP8-Dynamic
    runtime:
      served_model_name: local-main
      endpoint: /v1/chat/completions
    # 정적 listing은 모든 target이 공유하는 capability 상한이다. 실제 modality와
    # 요청 parameter는 active profile이, 공개 backend 값은 deployment target이 덮어쓴다.
    deployed_modalities: [text, image, audio, video]
    gateway_listing:
      enabled: true
      # target-neutral registry projection의 fallback. Gateway /v1/models에서는
      # deployment_targets.yaml의 runtime_backend가 실제 값으로 투영된다.
      backend: main_llm_vllm
      capabilities: [chat.completions, chat.completions.vision, chat.completions.tools]

  local-embed:
    role: embedding
    upstream_model_id: google/embeddinggemma-300m
    input_modalities: [text]
    embedding_dimensions:
      supported: [768]
    runtime:
      served_model_name: local-embed
      endpoint: /v1/embeddings
    gateway_listing:
      enabled: true
      backend: embedding_vllm
      capabilities: [embeddings, retrieval_rerank, retrieval_score]

  local-embed-ko:
    role: embedding
    upstream_model_id: dragonkue/snowflake-arctic-embed-l-v2.0-ko
    input_modalities: [text]
    embedding_dimensions:
      supported: [1024]
    runtime:
      served_model_name: local-embed-ko
      endpoint: /v1/embeddings
    gateway_listing:
      enabled: true
      backend: embedding_ko_vllm
      capabilities: [embeddings, retrieval_rerank, retrieval_score]

  risk-prompt:
    role: risk_prompt_detector
    upstream_model_id: kakaocorp/kanana-safeguard-prompt-2.1b
    input_modalities: [text]
    runtime:
      served_model_name: risk-prompt
      internal_endpoint: /v1/chat/completions
      public_adapter_endpoint: /v1/risk/detectors/prompt/assessments
      max_output_tokens: 1
    gateway_listing:
      enabled: true
      backend: risk_adapter
      capabilities: [risk.prompt_attack_signal]
