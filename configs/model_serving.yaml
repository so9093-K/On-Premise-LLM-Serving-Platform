server:
  gateway:
    host: 0.0.0.0
    port: 9400
    external: true
  risk_adapter:
    host: 0.0.0.0
    port: 9405
    external: false
default_embedding_model: local-embed
default_retrieval_model: local-embed-ko
embedding_profiles:
  local-embed:
    service_key: embedding
    served_model_name: local-embed
    upstream_model_id: google/embeddinggemma-300m
    dimensions: [768, 512, 256, 128]
    default_dimensions: 768
    purpose: general
    retrieval:
      enabled: true
      default: false
      score_modes: [dense_cosine]
    prompt_policy:
      retrieval_query:
        mode: prefix
        prefix: "task: search result | query: "
      retrieval_document:
        mode: prefix
        prefix: "title: none | text: "
  local-embed-ko:
    service_key: embedding_ko
    served_model_name: local-embed-ko
    upstream_model_id: dragonkue/snowflake-arctic-embed-l-v2.0-ko
    dimensions: [1024]
    default_dimensions: 1024
    purpose: korean_retrieval
    retrieval:
      enabled: true
      default: true
      score_modes: [dense_cosine]
    prompt_policy:
      retrieval_query:
        mode: sentence_transformers_prompt_name
        prompt_name: query
        fallback_prefix: ""
      retrieval_document:
        mode: none
models:
  main_llm:
    name: RedHatAI/gemma-4-26B-A4B-it-FP8-Dynamic
    served_model_name: local-main
    backend: vllm
    port: 9401
    endpoint: http://main-llm-vllm:9401/v1
    runner: generation
    quantization: compressed-tensors
    quantization_source: model_config
    weight_precision: fp8_dynamic
    dtype: auto
    tensor_parallel_size: 1
    model_card_example_tensor_parallel_size: 1
    trust_remote_code: true
    max_model_len: 16384
    max_num_seqs: 1
    max_num_batched_tokens: 16384
    gpu_memory_utilization: 0.72
    timeout_seconds: 120
    runtime_policy_source: RTX 6000 Ada conservative start for RedHatAI preliminary
      FP8 checkpoint; upstream card uses B200/vLLM main with 96K context, while this
      platform starts at 16K seq=1 pending local tokenizer, boot, quality, latency,
      and soak validation
    max_output_tokens: 1024
    resource_control:
      criticality: primary_user_path
      isolation: dedicated_vllm_process
      admission_control:
        max_concurrency: 1
        queue_timeout_seconds: 2
      request_limits:
        max_model_len: 16384
        max_output_tokens: 1024
        input_modalities:
        - text
        - image
        max_image_inputs: 1
        allowed_image_url_schemes:
        - data
        image_input_note: Gemma 4 26B-A4B supports image input; Gateway allows one bounded
          base64 data:image content part, validates MIME, decoded size, and image
          dimensions, and does not allow arbitrary remote image fetch by default.
        max_image_bytes: 750000
        max_image_pixels: 1048576
        allowed_image_mime_types:
        - image/jpeg
        - image/png
        - image/webp
      degrade_action: return upstream error; do not fall back to risk or embedding
        models
    runtime_features:
      prefix_caching:
        enabled: true
        hash_algo: sha256_cbor
      tool_calling:
        enabled: true
        auto_tool_choice: true
        tool_call_parser: gemma4
        reasoning_parser: gemma4
        allow_parallel_tool_calls: false
        chat_template: /app/configs/gemma4_chat_template.jinja
      structured_outputs:
        enabled: true
        backend: auto
        enable_in_reasoning: true
    request_parameter_policy:
      allow_unlisted_parameters: false
      supported_parameters:
      - stream
      - stream_options
      - temperature
      - max_tokens
      - top_p
      - top_k
      - min_p
      - presence_penalty
      - frequency_penalty
      - repetition_penalty
      - stop
      - seed
      - n
      - tools
      - tool_choice
      - parallel_tool_calls
      - reasoning
      - response_format
      - logprobs
      - top_logprobs
      - logit_bias
      max_n: 1
      tool_calling:
        enabled: true
        max_tools: 16
        allow_parallel_tool_calls: false
      reasoning:
        enabled: true
        default: false
        mode: request_opt_in
        upstream_chat_template_kwargs:
          enable_thinking: true
      response_format:
        enabled: true
        types:
        - text
        - json_object
        - json_schema
        json_object:
          require_json_instruction: true
        json_schema:
          enabled: true
          require_root_object: true
          require_additional_properties_false: true
          strict:
            allowed: true
            require_true: false
          max_schema_bytes: 16384
          max_depth: 8
          max_total_properties: 64
          max_properties_per_object: 32
          max_required: 64
          max_enum_values: 128
          max_enum_string_length: 256
          max_property_name_length: 64
          max_total_schema_string_length: 32768
          disallowed_keywords:
          - allOf
          - not
          - if
          - then
          - else
          - dependentRequired
          - dependentSchemas
          - patternProperties
          - $dynamicRef
          - $recursiveRef
          - $dynamicAnchor
          - $recursiveAnchor
          - $id
          - $anchor
          root_disallowed_keywords:
          - anyOf
      logprobs:
        enabled: true
        default: false
        allow_stream: true
      top_logprobs:
        min: 0
        max: 10
        requires_logprobs: true
      logit_bias:
        enabled: true
        max_entries: 256
        min_bias: -100
        max_bias: 100
        token_id_min: 0
        token_id_semantics: served_model_tokenizer
      combinations:
        json_schema_with_tools:
          mode: capability_gate
          default: allow
          canary_required: true
        json_schema_with_reasoning:
          mode: capability_gate
          default: allow
          canary_required: true
        json_schema_with_logit_bias:
          mode: allow
          note: constrained decoding may dominate token bias
        logit_bias_with_tools:
          mode: allow
          note: tool protocol/special tokens may dominate token bias
        logprobs_with_stream:
          mode: allow
      notes: Main LLM supports bounded vLLM/OpenAI chat sampling parameters, Gemma4
        tool calling, and request-level Gemma4 thinking via reasoning=true. Streaming
        is supported at Gateway through an SSE relay fast path; proxy buffering must remain disabled in front of the Gateway.
  embedding:
    name: google/embeddinggemma-300m
    served_model_name: local-embed
    backend: vllm
    port: 9402
    endpoint: http://embedding-vllm:9402/v1
    runner: pooling
    max_model_len: 2048
    embedding_dimension_default: 768
    embedding_dimension_supported:
    - 768
    - 512
    - 256
    - 128
    max_num_seqs: 2
    max_num_batched_tokens: 2048
    gpu_memory_utilization: 0.04
    runtime_policy_source: model card token and embedding dimension limits; served
      through vLLM pooling runner
    resource_control:
      criticality: retrieval_support_path
      isolation: dedicated_vllm_process
      admission_control:
        max_concurrency: 2
        queue_timeout_seconds: 2
      request_limits:
        input_modality: text
        max_model_len: 2048
        embedding_dimensions:
        - 768
        - 512
        - 256
        - 128
      degrade_action: return embedding upstream error only
    retrieval:
      backend: dense_embedding
      score_function: cosine
      score_mode: dense_cosine
    request_parameter_policy:
      allow_unlisted_parameters: false
      supported_parameters:
      - dimensions
      - encoding_format
      - truncate_prompt_tokens
      - user
      drop_upstream_parameters:
      - user
      dimensions:
      - 768
      - 512
      - 256
      - 128
      max_truncate_prompt_tokens: 2048
      max_embedding_batch_size: 16
  embedding_ko:
    name: dragonkue/snowflake-arctic-embed-l-v2.0-ko
    served_model_name: local-embed-ko
    backend: vllm
    port: 9406
    endpoint: http://embedding-ko-vllm:9406/v1
    runner: pooling
    trust_remote_code: true
    max_model_len: 2048
    embedding_dimension_default: 1024
    embedding_dimension_supported:
    - 1024
    max_num_seqs: 2
    max_num_batched_tokens: 2048
    gpu_memory_utilization: 0.06
    runtime_policy_source: Snowflake Arctic Embed L v2.0 Korean SentenceTransformer model served through vLLM pooling runner; project runtime caps context at 2048 for chunk-based retrieval stability.
    retrieval:
      backend: dense_embedding
      score_function: cosine
      score_mode: dense_cosine
    resource_control:
      criticality: retrieval_support_path
      isolation: dedicated_vllm_process
      admission_control:
        max_concurrency: 2
        queue_timeout_seconds: 2
      request_limits:
        input_modality: text
        max_model_len: 2048
        max_docs_per_rerank: 32
        max_chars_per_document: 4000
        embedding_dimensions:
        - 1024
      degrade_action: return Korean retrieval embedding upstream error only
    request_parameter_policy:
      allow_unlisted_parameters: false
      supported_parameters:
      - dimensions
      - encoding_format
      - truncate_prompt_tokens
      - user
      drop_upstream_parameters:
      - user
      dimensions:
      - 1024
      truncate_prompt_tokens:
        one_of:
        - const: -1
        - min: 1
          max: 2048
      max_truncate_prompt_tokens: 2048
      max_embedding_batch_size: 16
  risk_prompt:
    name: kakaocorp/kanana-safeguard-prompt-2.1b
    served_model_name: risk-prompt
    backend: vllm
    port: 9403
    endpoint: http://risk-prompt-vllm:9403/v1
    runner: generation
    quantization: bitsandbytes
    load_format: bitsandbytes
    dtype: bfloat16
    trust_remote_code: true
    max_model_len: 2048
    max_num_seqs: 1
    max_num_batched_tokens: 2048
    max_output_tokens: 1
    timeout_seconds: 5
    gpu_memory_utilization: 0.065
    enforce_eager: true
    runtime_policy_source: model card single-token classification; max_output_tokens
      must remain 1
    resource_control:
      criticality: risk_signal_path
      isolation: dedicated_vllm_process
      admission_control:
        max_concurrency: 1
        queue_timeout_seconds: 2
      request_limits:
        input_modality: text
        max_model_len: 2048
        max_output_tokens: 1
      degrade_action: return system signal; do not make policy decisions
    runtime_features:
      tool_calling:
        enabled: false
      prefix_caching:
        enabled: false
    request_parameter_policy:
      allow_unlisted_parameters: false
      supported_parameters:
      - max_tokens
      - temperature
      fixed_parameters:
        max_tokens: 1
        temperature: 0
risk_adapter:
  endpoint: http://risk-adapter:9405
  request_schema: prompt_only
  aggregate_execution: sequential
  detectors:
    prompt:
      enabled: true
      route: /v1/risk/detectors/prompt/assessments
      service_key: risk_prompt
      source_model: risk-prompt
      family: prompt_attack
      allowed_codes:
      - A1
      - A2
      fixed_parameters:
        max_tokens: 1
        temperature: 0
  aggregate:
    enabled: true
    detector_order:
    - prompt
    execution: sequential
  timeout_seconds: 15
  input_policy:
    max_prompt_chars: 7936
    char_budget_source: detector_min_max_model_len_minus_64_tokens_times_4_chars
    overflow_signal: TRUNCATED_INPUT
    overflow_action: return_system_signal_without_detector_call
  forbidden_response_fields:
  - allow
  - review
  - block
  - decision
  - action
  - safe_to_send
  - final_decision
  - final_decision_owner
  - policy_overrides

documentation:
  enabled: true
  docs_url: /docs
  redoc_url: /redoc
  openapi_url: /openapi.json
  default_policy: enabled_for_local_compose_staging_and_production_until_operator_policy_changes
  language_policy: korean_first_with_api_identifiers_in_english
security:
  auth_mode: local_open
  api_key_required: false
  log_prompt_body: false
  log_model_raw_output: false
  cors_enabled: false
  admin_api_key_required: false
  internal_service_token: change-me-internal
  internal_service_auth_required: false
  internal_service_auth: gateway_to_risk_adapter_only
  admin_endpoints_internal_only: false
timeouts:
  gateway_request_seconds: 125
  vllm_request_seconds: 20
  risk_adapter_seconds: 15
operational_limits:
  max_request_body_bytes: 1250000
  per_upstream_concurrency: 1
  queue_timeout_seconds: 2
  circuit_breaker_failure_threshold: 3
  circuit_breaker_reset_seconds: 15
  readiness_probe_timeout_seconds: 2
  http_client:
    max_connections: 100
    max_keepalive_connections: 20
streaming:
  max_duration_seconds: 300
  max_chunks: 20000
  max_bytes: 104857600
