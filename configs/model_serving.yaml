# Gateway가 요청을 검증하고 각 모델 runtime으로 전달할 때의 운영 정책이다.
# 서비스 공개 포트와 bind 주소의 기준은 configs/services.yaml 및 exposure profile이다.
default_embedding_model: local-embed
default_retrieval_model: local-embed-ko
# API 모델별 embedding·retrieval 목적과 입력 전처리 정책이다.
embedding_profiles:
  local-embed:
    service_key: embedding
    served_model_name: local-embed
    upstream_model_id: google/embeddinggemma-300m
    dimensions: [768, 512, 256, 128]
    default_dimensions: 768
    purpose: general
    retrieval:
      enabled: true
      default: false
      score_modes: [dense_cosine]
    prompt_policy:
      retrieval_query:
        mode: prefix
        prefix: "task: search result | query: "
      retrieval_document:
        mode: prefix
        prefix: "title: none | text: "
  local-embed-ko:
    service_key: embedding_ko
    served_model_name: local-embed-ko
    upstream_model_id: dragonkue/snowflake-arctic-embed-l-v2.0-ko
    dimensions: [1024]
    default_dimensions: 1024
    purpose: korean_retrieval
    retrieval:
      enabled: true
      default: true
      score_modes: [dense_cosine]
    prompt_policy:
      retrieval_query:
        mode: prefix
        prefix: "query: "
      retrieval_document:
        mode: none
models:
  # 각 runtime의 공통 연결·운영 설정이다. Main Model의 모델별 기동·Gateway 정책은
  # main_model_profiles.yaml의 활성 Profile이 소유한다.
  main_llm:
    name: RedHatAI/gemma-4-12B-it-FP8-Dynamic
    revision: 67e53491df7a281623fa740de61307d5c542b7f4
    served_model_name: local-main
    backend: vllm
    port: 9401
    endpoint: http://main-llm-vllm:9401/v1
    gpu_memory_utilization: 0.76
    timeout_seconds: 120
    resource_control:
      criticality: primary_user_path
      isolation: dedicated_vllm_process
      # Gateway admission만 공통으로 유지한다. Profile별 vLLM 동시성은 해당 command가 소유한다.
      admission_control:
        max_concurrency: 3
        queue_timeout_seconds: 2
      # main LLM 실패 시 embedding 또는 risk 모델로 대체하지 않고 upstream 오류를 반환한다.
  embedding:
    name: google/embeddinggemma-300m
    served_model_name: local-embed
    backend: vllm
    port: 9402
    endpoint: http://embedding-vllm:9402/v1
    runner: pooling
    max_model_len: 2048
    max_num_seqs: 2
    max_num_batched_tokens: 2048
    gpu_memory_utilization: 0.04
    # 모델 카드의 token·embedding dimension 제한을 vLLM pooling runner로 적용한다.
    resource_control:
      criticality: retrieval_support_path
      isolation: dedicated_vllm_process
      admission_control:
        max_concurrency: 2
        queue_timeout_seconds: 2
      request_limits:
        input_modality: text
        max_model_len: 2048
        embedding_dimensions:
        - 768
        - 512
        - 256
        - 128
      # embedding upstream 실패는 해당 요청의 오류로 반환하며 다른 모델로 대체하지 않는다.
    request_parameter_policy:
      allow_unlisted_parameters: false
      supported_parameters:
      - dimensions
      - encoding_format
      - truncate_prompt_tokens
      - user
      drop_upstream_parameters:
      - user
      dimensions:
      - 768
      - 512
      - 256
      - 128
      max_truncate_prompt_tokens: 2048
      max_embedding_batch_size: 16
  embedding_ko:
    name: dragonkue/snowflake-arctic-embed-l-v2.0-ko
    served_model_name: local-embed-ko
    backend: vllm
    port: 9406
    endpoint: http://embedding-ko-vllm:9406/v1
    runner: pooling
    trust_remote_code: true
    max_model_len: 2048
    max_num_seqs: 2
    max_num_batched_tokens: 2048
    gpu_memory_utilization: 0.06
    # Korean SentenceTransformer 모델을 vLLM pooling runner로 제공하며, chunk 기반 retrieval
    # 안정성을 위해 context를 2048로 제한한다.
    resource_control:
      criticality: retrieval_support_path
      isolation: dedicated_vllm_process
      admission_control:
        max_concurrency: 2
        queue_timeout_seconds: 2
      request_limits:
        input_modality: text
        max_model_len: 2048
        embedding_dimensions:
        - 1024
      # Korean retrieval embedding upstream 실패는 해당 요청의 오류로 반환한다.
    request_parameter_policy:
      allow_unlisted_parameters: false
      supported_parameters:
      - dimensions
      - encoding_format
      - truncate_prompt_tokens
      - user
      drop_upstream_parameters:
      - user
      - dimensions
      dimensions:
      - 1024
      truncate_prompt_tokens:
        one_of:
        - const: -1
        - min: 1
          max: 2048
      max_truncate_prompt_tokens: 2048
      max_embedding_batch_size: 16
  risk_prompt:
    name: kakaocorp/kanana-safeguard-prompt-2.1b
    served_model_name: risk-prompt
    backend: vllm
    port: 9403
    endpoint: http://risk-prompt-vllm:9403/v1
    runner: generation
    quantization: bitsandbytes
    load_format: bitsandbytes
    dtype: bfloat16
    trust_remote_code: true
    max_model_len: 8192
    max_num_seqs: 1
    max_num_batched_tokens: 8192
    max_output_tokens: 1
    timeout_seconds: 5
    gpu_memory_utilization: 0.065
    enforce_eager: true
    # 단일 token 분류 모델이다. max_output_tokens=1을 유지하고, context 8192는 실제
    # model config의 max_position_embeddings 값이다(2026-07-25에 2048에서 상향).
    resource_control:
      criticality: risk_signal_path
      isolation: dedicated_vllm_process
      admission_control:
        max_concurrency: 1
        queue_timeout_seconds: 2
      request_limits:
        input_modality: text
        max_model_len: 8192
        max_output_tokens: 1
      # detector는 위험 신호만 반환하며 정책 결정이나 allow/block 판단을 대신하지 않는다.
    runtime_features:
      tool_calling:
        enabled: false
      prefix_caching:
        enabled: false
    request_parameter_policy:
      allow_unlisted_parameters: false
      supported_parameters:
      - max_tokens
      - temperature
      fixed_parameters:
        max_tokens: 1
        temperature: 0
risk_adapter:
  # PII·secret·prompt detector를 조합하는 내부 서비스 정책이다.
  endpoint: http://risk-adapter:9405
  detectors:
    pii:
      type: local
      enabled: true
      route: /v1/risk/detectors/pii/assessments
      source_model: pii-protection
      family: data_exposure
      allowed_codes:
      - D1
      - D2
      - D5
    secret:
      type: local
      enabled: true
      route: /v1/risk/detectors/secret/assessments
      source_model: secret-scanner
      family: data_exposure
      allowed_codes:
      - D4
      - D5
    prompt:
      type: vllm
      enabled: true
      route: /v1/risk/detectors/prompt/assessments
      service_key: risk_prompt
      source_model: risk-prompt
      family: prompt_attack
      allowed_codes:
      - A1
      - A2
      fixed_parameters:
        max_tokens: 1
        temperature: 0
  aggregate:
    detector_order:
    - pii
    - secret
    - prompt
    execution: sequential
  timeout_seconds: 15
  input_policy:
    # 최소 enabled vLLM detector context에서 64 token을 뺀 값을 문자 수로 환산한 상한이다.
    # 초과 입력은 detector를 호출하지 않고 코드에 고정된 TRUNCATED_INPUT 시스템 신호를 반환한다.
    max_prompt_chars: 32512
  forbidden_response_fields:
  - allow
  - review
  - block
  - decision
  - action
  - safe_to_send
  - final_decision
  - final_decision_owner
  - policy_overrides

documentation:
  # FastAPI 문서 endpoint의 기본 경로다.
  enabled: true
  docs_url: /docs
  redoc_url: /redoc
  openapi_url: /openapi.json
security:
  auth_mode: local_open
  api_key_required: false
  admin_api_key_required: false
  internal_service_token: change-me-internal
  internal_service_auth_required: false
  admin_endpoints_internal_only: false
timeouts:
  # 환경변수로 재정의할 수 있는 요청 시간 제한이다.
  gateway_request_seconds: 125
  vllm_request_seconds: 20
  risk_adapter_seconds: 15
operational_limits:
  # 모든 upstream client에 공통 적용하는 기본 제한이다.
  max_request_body_bytes: 100000000
  max_retrieval_documents: 32
  per_upstream_concurrency: 1
  queue_timeout_seconds: 2
  circuit_breaker_failure_threshold: 3
  circuit_breaker_reset_seconds: 15
  readiness_probe_timeout_seconds: 2
  http_client:
    max_connections: 100
    max_keepalive_connections: 20
streaming:
  # Gateway SSE relay가 허용하는 스트림 상한이다.
  max_duration_seconds: 300
  max_chunks: 20000
  max_bytes: 104857600
