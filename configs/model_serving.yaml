# Gateway가 요청을 검증하고 각 모델 runtime으로 전달할 때의 운영 정책이다.
# 서비스 공개 포트와 bind 주소의 기준은 configs/services.yaml 및 exposure profile이다.
default_embedding_model: local-embed
default_retrieval_model: local-embed-ko
# API 모델별 embedding·retrieval 목적과 입력 전처리 정책이다.
embedding_profiles:
  local-embed:
    service_key: embedding
    served_model_name: local-embed
    upstream_model_id: google/embeddinggemma-300m
    dimensions: [768, 512, 256, 128]
    default_dimensions: 768
    purpose: general
    retrieval:
      enabled: true
      default: false
      score_modes: [dense_cosine]
    prompt_policy:
      retrieval_query:
        mode: prefix
        prefix: "task: search result | query: "
      retrieval_document:
        mode: prefix
        prefix: "title: none | text: "
  local-embed-ko:
    service_key: embedding_ko
    served_model_name: local-embed-ko
    upstream_model_id: dragonkue/snowflake-arctic-embed-l-v2.0-ko
    dimensions: [1024]
    default_dimensions: 1024
    purpose: korean_retrieval
    retrieval:
      enabled: true
      default: true
      score_modes: [dense_cosine]
    prompt_policy:
      retrieval_query:
        mode: prefix
        prefix: "query: "
      retrieval_document:
        mode: none
models:
  # 각 vLLM runtime의 기동 인자와 Gateway 요청 제한이다.
  main_llm:
    name: RedHatAI/gemma-4-12B-it-FP8-Dynamic
    revision: 67e53491df7a281623fa740de61307d5c542b7f4
    served_model_name: local-main
    backend: vllm
    port: 9401
    endpoint: http://main-llm-vllm:9401/v1
    runner: generation
    quantization: compressed-tensors
    quantization_source: model_config
    dtype: auto
    tensor_parallel_size: 1
    trust_remote_code: true
    max_model_len: 50000
    max_output_tokens: 13000
    max_num_seqs: 3
    max_num_batched_tokens: 50000
    optimization_level: 3
    gpu_memory_utilization: 0.76
    timeout_seconds: 120
    # RTX 6000 Ada에서 검증한 기본 목표는 context 50K, seq=3, optimization level 3이다.
    # 실제 boot/KV-cache 검증 이력은 main_model_profiles.yaml의 description을 따른다.
    resource_control:
      criticality: primary_user_path
      isolation: dedicated_vllm_process
      # 아래 선언값은 기본 profile(gemma4-12b-unified-fp8)의 실제 vLLM 기동값과
      # 정합성을 검사한다. Gateway 동시성만 높일 목적이라면 profile을 바꾸지 말고
      # MAIN_LLM_MAX_CONCURRENCY 환경변수로 admission ceiling만 조정한다.
      admission_control:
        max_concurrency: 3
        queue_timeout_seconds: 2
      request_limits:
        max_model_len: 50000
        input_modalities:
        - text
        - image
        - audio
        - video
        max_image_inputs: 1
        allowed_image_url_schemes:
        - data
        # 원격 URL은 허용하지 않는다. base64 data:image 하나만 MIME·복호화 크기·해상도로 제한한다.
        max_image_bytes: 25000000
        max_image_pixels: 12845056
        allowed_image_mime_types:
        - image/jpeg
        - image/png
        - image/webp
        - image/avif
        - image/jp2
        - image/gif
        - image/bmp
        - image/tiff
        - image/x-tiff
        # audio는 active main-model profile이 audio를 배포할 때만 이 제한이 적용된다.
        # 기본 profile(gemma4-12b-unified-fp8)은 audio를 배포하지만, admin API로 선택 가능한
        # gemma4-26b-a4b-fp8은 배포하지 않는다. Gateway는 허용 형식의 base64 input_audio
        # 하나와 복호화 크기만 제한한다. Gemma 4 공식 처리 상한은 약 30초이며, 이를 넘는
        # 압축 audio는 runtime이 경고 없이 잘라낼 수 있다. max_audio_bytes만으로 길이를
        # 사전 거부할 수 없는 현재 한계는 ADR-0019에 기록돼 있다.
        max_audio_inputs: 1
        allowed_audio_formats:
        - wav
        - mp3
        - flac
        - ogg
        - m4a
        - mp4
        - aac
        max_audio_bytes: 25000000
        max_video_inputs: 1
        allowed_video_url_schemes:
        - data
        # video도 active profile이 video를 배포할 때만 적용된다. Gateway는 허용 data URL
        # container 또는 JPEG frame 배열 하나를 검증하고, container decode 가능 여부는 boot
        # canary로 확인한다. Gemma 4 공식 스펙은 1fps 기준 60초/60 frame이지만, 이 배포의
        # vLLM 0.25.1은 실제로 clip 전체에서 최대 32 frame만 균등 추출한다(ADR-0019 검증).
        # 따라서 max_video_frames=60은 공식 입력 상한일 뿐 현재 실제 처리 용량 32를 뜻하지
        # 않는다. mp4/webm/mkv/mov/avi는 Gateway가 frame 수·길이를 사전 검증하지 못한다.
        allowed_video_mime_types:
        - video/mp4
        - video/webm
        - video/x-matroska
        - video/quicktime
        - video/jpeg
        - video/x-msvideo
        - video/avi
        - video/gif
        max_video_bytes: 50000000
        # JPEG frame 배열은 client가 보낸 item 수를 직접 제한한다. GIF는 누적 frame delay로
        # 재생 시간을 제한하며, frame 수는 duration 제한이 없을 때만 보조 상한으로 사용한다.
        max_video_frames: 60
        max_video_frame_pixels: 12845056
        max_video_duration_seconds: 60
      # main LLM 실패 시 embedding 또는 risk 모델로 대체하지 않고 upstream 오류를 반환한다.
    runtime_features:
      prefix_caching:
        enabled: true
        hash_algo: sha256_cbor
      tool_calling:
        enabled: true
        auto_tool_choice: true
        tool_call_parser: gemma4
        reasoning_parser: gemma4
        allow_parallel_tool_calls: false
        # Gemma 4의 tool·reasoning·멀티모달 prompt 형식이다. 변경 시 실제 요청 렌더링을
        # 확인한 뒤 full 배포한다.
        chat_template: /app/configs/gemma4_chat_template.jinja
      structured_outputs:
        enabled: true
        backend: "xgrammar"
        disable_any_whitespace: true
        enable_in_reasoning: true
    request_parameter_policy:
      allow_unlisted_parameters: false
      supported_parameters:
      - stream
      - stream_options
      - temperature
      - max_tokens
      - top_p
      - top_k
      - min_p
      - presence_penalty
      - frequency_penalty
      - repetition_penalty
      - stop
      - seed
      - n
      - tools
      - tool_choice
      - parallel_tool_calls
      - reasoning
      - response_format
      - logprobs
      - top_logprobs
      - logit_bias
      max_n: 1
      tool_calling:
        enabled: true
        # parser/template에는 tool 개수 하드 리밋이 없다. tool 하나가 실측 약 140 token이고
        # Open WebUI 기본 native tool만으로도 22~31개가 붙어, 외부 MCP/OpenAPI 연결 여지를
        # 고려해 64개로 제한한다.
        max_tools: 64
        allow_parallel_tool_calls: false
      reasoning:
        enabled: true
        default: false
        mode: request_opt_in
        upstream_chat_template_kwargs:
          enable_thinking: true
      response_format:
        enabled: true
        types:
        - text
        - json_object
        - json_schema
        json_object:
          require_json_instruction: true
        json_schema:
          enabled: true
          require_root_object: true
          require_additional_properties_false: true
          strict:
            allowed: true
            require_true: false
          max_schema_bytes: 16384
          max_depth: 8
          max_total_properties: 64
          max_properties_per_object: 32
          max_required: 64
          max_enum_values: 128
          max_enum_string_length: 256
          max_property_name_length: 64
          max_total_schema_string_length: 32768
          disallowed_keywords:
          - allOf
          - not
          - if
          - then
          - else
          - dependentRequired
          - dependentSchemas
          - patternProperties
          - $dynamicRef
          - $recursiveRef
          - $dynamicAnchor
          - $recursiveAnchor
          - $id
          - $anchor
          root_disallowed_keywords:
          - anyOf
      logprobs:
        enabled: true
        default: false
        allow_stream: true
      top_logprobs:
        min: 0
        max: 10
        requires_logprobs: true
      logit_bias:
        enabled: true
        max_entries: 256
        min_bias: -100
        max_bias: 100
        token_id_min: 0
        token_id_semantics: served_model_tokenizer
      combinations:
        json_schema_with_tools:
          mode: capability_gate
          default: allow
          canary_required: true
        json_schema_with_reasoning:
          mode: capability_gate
          default: allow
          canary_required: true
        json_schema_with_logit_bias:
          mode: allow
          # constrained decoding이 token bias보다 우선할 수 있다.
        logit_bias_with_tools:
          mode: allow
          # tool protocol·special token이 token bias보다 우선할 수 있다.
        logprobs_with_stream:
          mode: allow
      # Gateway는 제한된 vLLM/OpenAI sampling parameter, Gemma 4 tool calling,
      # reasoning=true 요청을 지원한다. streaming은 SSE relay fast path이므로 Gateway 앞
      # proxy의 buffering을 끈 상태를 유지해야 한다.
  embedding:
    name: google/embeddinggemma-300m
    served_model_name: local-embed
    backend: vllm
    port: 9402
    endpoint: http://embedding-vllm:9402/v1
    runner: pooling
    max_model_len: 2048
    max_num_seqs: 2
    max_num_batched_tokens: 2048
    gpu_memory_utilization: 0.04
    # 모델 카드의 token·embedding dimension 제한을 vLLM pooling runner로 적용한다.
    resource_control:
      criticality: retrieval_support_path
      isolation: dedicated_vllm_process
      admission_control:
        max_concurrency: 2
        queue_timeout_seconds: 2
      request_limits:
        input_modality: text
        max_model_len: 2048
        embedding_dimensions:
        - 768
        - 512
        - 256
        - 128
      # embedding upstream 실패는 해당 요청의 오류로 반환하며 다른 모델로 대체하지 않는다.
    request_parameter_policy:
      allow_unlisted_parameters: false
      supported_parameters:
      - dimensions
      - encoding_format
      - truncate_prompt_tokens
      - user
      drop_upstream_parameters:
      - user
      dimensions:
      - 768
      - 512
      - 256
      - 128
      max_truncate_prompt_tokens: 2048
      max_embedding_batch_size: 16
  embedding_ko:
    name: dragonkue/snowflake-arctic-embed-l-v2.0-ko
    served_model_name: local-embed-ko
    backend: vllm
    port: 9406
    endpoint: http://embedding-ko-vllm:9406/v1
    runner: pooling
    trust_remote_code: true
    max_model_len: 2048
    max_num_seqs: 2
    max_num_batched_tokens: 2048
    gpu_memory_utilization: 0.06
    # Korean SentenceTransformer 모델을 vLLM pooling runner로 제공하며, chunk 기반 retrieval
    # 안정성을 위해 context를 2048로 제한한다.
    resource_control:
      criticality: retrieval_support_path
      isolation: dedicated_vllm_process
      admission_control:
        max_concurrency: 2
        queue_timeout_seconds: 2
      request_limits:
        input_modality: text
        max_model_len: 2048
        embedding_dimensions:
        - 1024
      # Korean retrieval embedding upstream 실패는 해당 요청의 오류로 반환한다.
    request_parameter_policy:
      allow_unlisted_parameters: false
      supported_parameters:
      - dimensions
      - encoding_format
      - truncate_prompt_tokens
      - user
      drop_upstream_parameters:
      - user
      - dimensions
      dimensions:
      - 1024
      truncate_prompt_tokens:
        one_of:
        - const: -1
        - min: 1
          max: 2048
      max_truncate_prompt_tokens: 2048
      max_embedding_batch_size: 16
  risk_prompt:
    name: kakaocorp/kanana-safeguard-prompt-2.1b
    served_model_name: risk-prompt
    backend: vllm
    port: 9403
    endpoint: http://risk-prompt-vllm:9403/v1
    runner: generation
    quantization: bitsandbytes
    load_format: bitsandbytes
    dtype: bfloat16
    trust_remote_code: true
    max_model_len: 8192
    max_num_seqs: 1
    max_num_batched_tokens: 8192
    max_output_tokens: 1
    timeout_seconds: 5
    gpu_memory_utilization: 0.065
    enforce_eager: true
    # 단일 token 분류 모델이다. max_output_tokens=1을 유지하고, context 8192는 실제
    # model config의 max_position_embeddings 값이다(2026-07-25에 2048에서 상향).
    resource_control:
      criticality: risk_signal_path
      isolation: dedicated_vllm_process
      admission_control:
        max_concurrency: 1
        queue_timeout_seconds: 2
      request_limits:
        input_modality: text
        max_model_len: 8192
        max_output_tokens: 1
      # detector는 위험 신호만 반환하며 정책 결정이나 allow/block 판단을 대신하지 않는다.
    runtime_features:
      tool_calling:
        enabled: false
      prefix_caching:
        enabled: false
    request_parameter_policy:
      allow_unlisted_parameters: false
      supported_parameters:
      - max_tokens
      - temperature
      fixed_parameters:
        max_tokens: 1
        temperature: 0
risk_adapter:
  # PII·secret·prompt detector를 조합하는 내부 서비스 정책이다.
  endpoint: http://risk-adapter:9405
  detectors:
    pii:
      type: local
      enabled: true
      route: /v1/risk/detectors/pii/assessments
      source_model: pii-protection
      family: data_exposure
      allowed_codes:
      - D1
      - D2
      - D5
    secret:
      type: local
      enabled: true
      route: /v1/risk/detectors/secret/assessments
      source_model: secret-scanner
      family: data_exposure
      allowed_codes:
      - D4
      - D5
    prompt:
      type: vllm
      enabled: true
      route: /v1/risk/detectors/prompt/assessments
      service_key: risk_prompt
      source_model: risk-prompt
      family: prompt_attack
      allowed_codes:
      - A1
      - A2
      fixed_parameters:
        max_tokens: 1
        temperature: 0
  aggregate:
    detector_order:
    - pii
    - secret
    - prompt
    execution: sequential
  timeout_seconds: 15
  input_policy:
    # 최소 enabled vLLM detector context에서 64 token을 뺀 값을 문자 수로 환산한 상한이다.
    # 초과 입력은 detector를 호출하지 않고 코드에 고정된 TRUNCATED_INPUT 시스템 신호를 반환한다.
    max_prompt_chars: 32512
  forbidden_response_fields:
  - allow
  - review
  - block
  - decision
  - action
  - safe_to_send
  - final_decision
  - final_decision_owner
  - policy_overrides

documentation:
  # FastAPI 문서 endpoint의 기본 경로다.
  enabled: true
  docs_url: /docs
  redoc_url: /redoc
  openapi_url: /openapi.json
security:
  auth_mode: local_open
  api_key_required: false
  admin_api_key_required: false
  internal_service_token: change-me-internal
  internal_service_auth_required: false
  admin_endpoints_internal_only: false
timeouts:
  # 환경변수로 재정의할 수 있는 요청 시간 제한이다.
  gateway_request_seconds: 125
  vllm_request_seconds: 20
  risk_adapter_seconds: 15
operational_limits:
  # 모든 upstream client에 공통 적용하는 기본 제한이다.
  max_request_body_bytes: 100000000
  max_retrieval_documents: 32
  per_upstream_concurrency: 1
  queue_timeout_seconds: 2
  circuit_breaker_failure_threshold: 3
  circuit_breaker_reset_seconds: 15
  readiness_probe_timeout_seconds: 2
  http_client:
    max_connections: 100
    max_keepalive_connections: 20
streaming:
  # Gateway SSE relay가 허용하는 스트림 상한이다.
  max_duration_seconds: 300
  max_chunks: 20000
  max_bytes: 104857600
