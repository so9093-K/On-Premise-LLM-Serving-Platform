gpu:
  device_class: NVIDIA RTX 6000 Ada Generation
  total_vram_gib: 48
  reserve_gib:
    hard_minimum: 3.5
    watch_below: 4
    comfortable: 5
    conservative: 8
  total_gpu_memory_utilization:
    recommended_start: 0.925
    budget_breakdown: "main_llm 0.76 + embedding 0.04 + embedding_ko 0.06 + risk_prompt 0.065 = 0.925"
    upper_review_threshold: 0.91
    avoid_above: 0.93
    conservative_range:
    - 0.83
    - 0.895
    live_tuning_review_required_above: 0.895
  default_profile: single_a6000_conservative
  profile_rule: Use conservative defaults until live vLLM/GPU measurements prove headroom
    for a specific increase.
budgets:
  # Reference-host (48 GiB) capacity-planning figures, NOT the live cost. The
  # runtime reservation is the active profile's --gpu-memory-utilization, which a
  # host may override via MAIN_LLM_GPU_MEMORY_UTILIZATION; GPU admission reads that
  # live value, not this block. See ADR-0018.
  #
  # target_gib/range_gib below are the 26B(default_profile) reference figures only.
  # main_llm is a switchable identity since ADR-0017 -- the 12B profile's real
  # measured footprint differs and does not fall in this range. Live-measured
  # (2026-07-16, docs/adr/0015 Update): 26B(seq=1, 20K) actual ~35.1 GiB; 12B(seq=2,
  # 50K) actual ~30.2 GiB. Do not read this block as "the" Main LLM footprint
  # regardless of active profile -- check nvidia-smi/vllm:cache_config_info for the
  # currently active one.
  main_llm:
    target_gib: 34.6
    range_gib:
    - 34
    - 35
    gpu_memory_utilization: 0.76
    tuning_range:
      gpu_memory_utilization:
      - 0.68
      - 0.76
      adjustment_priority: last
      do_not_increase_before_live_validation:
      - max_model_len
      - max_num_seqs
  embedding:
    target_gib: 1.9
    range_gib:
    - 1.5
    - 2
    gpu_memory_utilization: 0.04
    tuning_range:
      gpu_memory_utilization:
      - 0.03
      - 0.04
      adjustment_priority: first
      scale_out_note: Can move to CPU, another GPU, or separate service if RAG traffic
        dominates.
  embedding_ko:
    target_gib: 1.9
    range_gib:
    - 1.5
    - 2
    gpu_memory_utilization: 0.06
    tuning_range:
      gpu_memory_utilization:
      - 0.04
      - 0.06
      adjustment_priority: first
      scale_out_note: Can move to CPU, another GPU, or separate service if retrieval
        traffic dominates.
  risk_prompt:
    target_gib: 3.1
    range_gib:
    - 2.5
    - 3.5
    gpu_memory_utilization: 0.065
    tuning_range:
      gpu_memory_utilization:
      - 0.05
      - 0.065
      adjustment_priority: second
      fixed_generation_budget:
        max_output_tokens: 1
limits:
  main_llm_max_model_len: 20000
  main_llm_max_num_seqs: 1
  risk_max_model_len: 2048
  risk_max_num_seqs: 1
  risk_execution: sequential
  rag_bulk_indexing_initial: disabled_or_throttled
  main_llm_max_output_tokens: 13000
  main_llm_max_image_inputs: 1
  main_llm_max_image_bytes: 25000000
  main_llm_max_image_pixels: 12845056
  detector_max_output_tokens: 1
resource_management:
  isolation: each model runtime uses a separate vLLM process and port
  admission_control: gateway/upstream clients enforce per-model concurrency, queue
    timeout, and circuit breaker limits
  memory_policy: each vLLM runtime must stay within its configured gpu_memory_utilization;
    total configured utilization should keep reserve_gib.hard_minimum free
  scale_policy: add a model only after assigning port, gpu budget, max_model_len,
    max_num_seqs, and dashboard labels; remove a model by deleting all registry entries
    in one change
  allocation_strategy: conservative_single_gpu_co_residency
  live_tuning_order:
  - measure idle VRAM after all enabled vLLM runtimes start
  - measure single-request latency and peak VRAM per model path
  - run mixed traffic soak before increasing context, batching, or concurrency
  - adjust embedding batch first, risk_prompt budget second, main_llm context/concurrency
    last
  fixed_constraints:
  - risk detector max_output_tokens remains 1
  - model fallback is not allowed
  - each model keeps an independent vLLM process and port
  - remote image URL fetch remains disabled unless an explicit egress policy is added
