# Configuration Plane의 metadata 단일 기준.
# Runtime 코드와 Admin UI는 이 선언을 읽고, 개별 key의 form/ownership/apply 정책을 복제하지 않는다.
version: 2
items:
  - key: deployment.target
    projection: deployment_target
    label: Deployment Target
    group: deployment
    order: 10
    type: string
    owner: deployment
    editable: false
    control_surface: deployment
    sensitive: false
    effective_source: deployment
    apply_mode: redeploy
    risk: high
    applicability:
      features: []
    meaning: 활성 Deployment Target과 기능 집합을 결정합니다.
    help: Target 전환은 Configuration Plane이 아니라 deployment workflow에서 수행합니다.
    related_adrs: [ADR-0020, ADR-0027]

  - key: deployment.control_mode
    projection: deployment_control_mode
    label: Control Mode
    group: deployment
    order: 20
    type: string
    owner: deployment
    editable: false
    control_surface: deployment
    sensitive: false
    effective_source: deployment
    apply_mode: redeploy
    risk: high
    applicability:
      features: []
    meaning: Runtime lifecycle 제어가 Sidecar인지 static 외부 소유인지 나타냅니다.
    help: Deployment Target에서 파생되는 값으로 Console에서 직접 수정하지 않습니다.
    related_adrs: [ADR-0020, ADR-0027]

  - key: deployment.lifecycle_owner
    projection: deployment_lifecycle_owner
    label: Lifecycle Owner
    group: deployment
    order: 30
    type: string
    owner: deployment
    editable: false
    control_surface: deployment
    sensitive: false
    effective_source: deployment
    apply_mode: redeploy
    risk: high
    applicability:
      features: []
    meaning: Runtime의 기동·중지·재생성 책임 주체입니다.
    help: Runtime lifecycle ownership은 Deployment Target 계약이 소유합니다.
    related_adrs: [ADR-0020, ADR-0027]

  - key: deployment.features
    projection: deployment_features
    label: Deployment Features
    group: deployment
    order: 40
    type: array
    owner: deployment
    editable: false
    control_surface: deployment
    sensitive: false
    effective_source: deployment
    apply_mode: redeploy
    risk: info
    applicability:
      features: []
    meaning: 현재 target이 제공하는 API 및 운영 capability 집합입니다.
    help: Admin Console은 이 feature 집합을 기준으로 action을 표시합니다.
    related_adrs: [ADR-0020, ADR-0027]

  - key: security.auth_mode
    projection: security_auth_mode
    label: Authentication Mode
    group: access
    order: 10
    type: string
    owner: deployment
    editable: false
    control_surface: access_profile
    sensitive: false
    effective_source: deployment
    apply_mode: service_restart
    risk: critical
    applicability:
      features: []
    meaning: API·Admin·내부 호출에 적용된 저수준 인증 mode입니다.
    help: 일반 운영자는 Access Profile을 사용하며 이 값은 진단용 primitive로 취급합니다.
    related_adrs: [ADR-0025, ADR-0027]

  - key: security.api_keys
    projection: security_api_keys
    label: API Keys
    group: access
    order: 20
    type: secret
    owner: secret
    editable: false
    control_surface: secret
    sensitive: true
    effective_source: secret
    apply_mode: service_restart
    risk: critical
    applicability:
      features: []
    meaning: Gateway API Bearer token 집합입니다. 원문은 반환하지 않습니다.
    help: Secret 값은 generic Configuration mutation이 아니라 전용 secret workflow가 소유합니다.
    related_adrs: [ADR-0021, ADR-0025, ADR-0027]

  - key: runtime.main_llm.base_url
    projection: main_llm_base_url
    label: Main Runtime Endpoint
    group: runtime
    order: 10
    type: url
    owner: deployment
    editable: false
    control_surface: deployment
    sensitive: false
    effective_source: deployment
    apply_mode: service_restart
    risk: high
    applicability:
      features: []
    meaning: Gateway가 사용하는 Main runtime OpenAI-compatible endpoint입니다.
    help: Endpoint identity는 deployment/startup configuration이 소유합니다.
    related_adrs: [ADR-0020, ADR-0027]

  - key: runtime.required_keys
    projection: required_runtime_keys
    label: Required Runtimes
    group: runtime
    order: 20
    type: array
    owner: repository
    editable: false
    control_surface: repository
    sensitive: false
    effective_source: repository
    apply_mode: redeploy
    risk: medium
    applicability:
      features: []
    meaning: readiness가 요구하는 runtime dependency입니다.
    help: Repository policy에서 관리하며 runtime desired state와는 별도 계약입니다.
    related_adrs: [ADR-0020, ADR-0027]

  - key: operational.max_retrieval_documents
    projection: max_retrieval_documents
    label: Max Retrieval Documents
    group: retrieval
    order: 10
    type: integer
    unit: items
    minimum: 1
    maximum: 32
    owner: operator
    editable: false
    control_surface: configuration
    sensitive: false
    effective_source: repository
    apply_mode: hot_reload
    risk: medium
    applicability:
      features: [retrieval]
    meaning: 한 retrieval 요청에서 허용하는 documents 개수 상한입니다.
    help: Public retrieval request schema의 maxItems와 동일해야 하며 write plane 검증 전까지 수정은 잠겨 있습니다.
    related_adrs: [ADR-0021, ADR-0027]

  - key: streaming.max_duration_seconds
    projection: streaming_max_duration_seconds
    label: Max Stream Duration
    group: streaming
    order: 10
    type: number
    unit: seconds
    minimum: 0.1
    maximum: 3600
    owner: operator
    editable: false
    control_surface: configuration
    sensitive: false
    effective_source: repository
    apply_mode: hot_reload
    risk: medium
    applicability:
      features: []
    meaning: Gateway SSE relay가 한 스트림을 유지할 수 있는 최대 시간입니다.
    help: RuntimeConfigurationProvider에서 요청별 snapshot으로 적용되며 write plane 검증 전까지 수정은 잠겨 있습니다.
    related_adrs: [ADR-0021, ADR-0027]

  - key: streaming.max_chunks
    projection: streaming_max_chunks
    label: Max Stream Chunks
    group: streaming
    order: 20
    type: integer
    unit: chunks
    minimum: 1
    maximum: 1000000
    owner: operator
    editable: false
    control_surface: configuration
    sensitive: false
    effective_source: repository
    apply_mode: hot_reload
    risk: medium
    applicability:
      features: []
    meaning: Gateway가 한 SSE 응답에서 중계할 수 있는 chunk 개수 상한입니다.
    help: RuntimeConfigurationProvider에서 요청별 snapshot으로 적용되며 write plane 검증 전까지 수정은 잠겨 있습니다.
    related_adrs: [ADR-0021, ADR-0027]

  - key: streaming.max_bytes
    projection: streaming_max_bytes
    label: Max Stream Bytes
    group: streaming
    order: 30
    type: integer
    unit: bytes
    minimum: 1
    maximum: 1073741824
    owner: operator
    editable: false
    control_surface: configuration
    sensitive: false
    effective_source: repository
    apply_mode: hot_reload
    risk: medium
    applicability:
      features: []
    meaning: Gateway가 한 SSE 응답에서 중계할 수 있는 총 byte 상한입니다.
    help: RuntimeConfigurationProvider에서 요청별 snapshot으로 적용되며 write plane 검증 전까지 수정은 잠겨 있습니다.
    related_adrs: [ADR-0021, ADR-0027]
