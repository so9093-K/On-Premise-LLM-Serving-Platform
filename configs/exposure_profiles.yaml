version: 0.2.0
version_semantics: exposure profile schema version, not package release version
source_of_truth: configs/exposure_profiles.yaml

# canonical_modes declares the valid EXPOSURE_MODE values.
# profiles keys must exactly match canonical_modes.
canonical_modes:
  - private_network
  - master_open

profiles:
  private_network:
    class: default_private
    description: "Gateway와 Grafana만 host-published. vLLM, Risk Adapter, Prometheus, DCGM, cAdvisor는 compose 내부망만."
    host_published:
      - gateway
      - grafana
    diagnostics:
      gateway_bypass_possible: false
      direct_model_runtime_access: false
      direct_risk_adapter_access: false
      direct_operations_endpoints: false
      requires_exposure_audience: false
    note: >
      Standard production topology. vLLM runtimes, Risk Adapter, Prometheus,
      DCGM exporter, and cAdvisor are compose-network only (expose, no ports).

  master_open:
    class: diagnostic_full_stack
    description: >
      전체 stack host-published. Gateway bypass, vLLM runtime direct access, Risk Adapter,
      Prometheus, DCGM, cAdvisor 직접 접근 가능. 정상 진단/운영 모드.
    host_published:
      - gateway
      - main_llm_vllm
      - embedding_vllm
      - embedding_ko_vllm
      - risk_prompt_vllm
      - risk_adapter
      - prometheus
      - grafana
      - dcgm_exporter
      - cadvisor
    diagnostics:
      gateway_bypass_possible: true
      direct_model_runtime_access: true
      direct_risk_adapter_access: true
      direct_operations_endpoints: true
      requires_exposure_audience: true
    note: >
      Gateway bypass, runtime direct access, operations endpoint direct exposure는
      master_open의 의도된 특성이다. 이를 별도 mode로 회피하지 않는다.
      대신 EXPOSURE_AUDIENCE로 대상 network을 명시하고, exposure-status/doctor/preflight가
      구조화된 diagnostics 필드로 판단한다.
      EXPOSURE_AUDIENCE allowed values: local_only, private_lan, vpn, public

# exposure_audience: EXPOSURE_AUDIENCE env var의 허용값 목록.
# auth_doctor, preflight_compose.sh, exposure_status.py, validate_env_contract.py가
# 이 source를 사용해 값을 검증한다.
# local_only는 host-published 서비스가 루프백(127.0.0.1)에 바인드되어야 함을 의미한다.
# 0.0.0.0 bind와 local_only 조합은 auth_doctor와 preflight가 FAIL 처리한다.
exposure_audience:
  allowed_values:
    - local_only
    - private_lan
    - vpn
    - public
