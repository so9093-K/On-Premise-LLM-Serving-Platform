version: 0.2.0
version_semantics: exposure profile schema version, not package release version
source_of_truth: configs/exposure_profiles.yaml

# canonical_modes declares the valid EXPOSURE_MODE values.
# profiles keys must exactly match canonical_modes.
# deprecated_aliases map old names to canonical targets — they must not appear in profiles.
canonical_modes:
  - private_network
  - master_open

# services: canonical host/container port and env var mapping.
# This is the source for compose overrides, preflight port checks, and exposure-status.
services:
  gateway:
    compose_service: gateway
    container_port: 9400
    host_env_port: GATEWAY_PORT
    default_host_port: 9400
    host_env_bind: GATEWAY_BIND_ADDR
    default_bind: "0.0.0.0"

  risk_adapter:
    compose_service: risk-adapter
    container_port: 9405
    host_env_port: RISK_ADAPTER_PORT
    default_host_port: 9405
    host_env_bind: RISK_ADAPTER_BIND_ADDR
    default_bind: "0.0.0.0"

  main_llm_vllm:
    compose_service: main-llm-vllm
    container_port: 9401
    host_env_port: MAIN_LLM_VLLM_PORT
    default_host_port: 9401
    host_env_bind: MAIN_LLM_VLLM_BIND_ADDR
    default_bind: "0.0.0.0"

  embedding_vllm:
    compose_service: embedding-vllm
    container_port: 9402
    host_env_port: EMBEDDING_VLLM_PORT
    default_host_port: 9402
    host_env_bind: EMBEDDING_VLLM_BIND_ADDR
    default_bind: "0.0.0.0"

  embedding_ko_vllm:
    compose_service: embedding-ko-vllm
    container_port: 9406
    host_env_port: EMBEDDING_KO_VLLM_PORT
    default_host_port: 9406
    host_env_bind: EMBEDDING_KO_VLLM_BIND_ADDR
    default_bind: "0.0.0.0"

  risk_prompt_vllm:
    compose_service: risk-prompt-vllm
    container_port: 9403
    host_env_port: RISK_PROMPT_VLLM_PORT
    default_host_port: 9403
    host_env_bind: RISK_PROMPT_VLLM_BIND_ADDR
    default_bind: "0.0.0.0"

  prometheus:
    compose_service: prometheus
    container_port: 9090
    host_env_port: PROMETHEUS_PORT
    default_host_port: 9410
    host_env_bind: PROMETHEUS_BIND_ADDR
    default_bind: "0.0.0.0"

  grafana:
    compose_service: grafana
    container_port: 3000
    host_env_port: GRAFANA_PORT
    default_host_port: 9411
    host_env_bind: GRAFANA_BIND_ADDR
    default_bind: "0.0.0.0"

  dcgm_exporter:
    compose_service: dcgm-exporter
    container_port: 9400
    host_env_port: DCGM_EXPORTER_PORT
    default_host_port: 9412
    host_env_bind: DCGM_EXPORTER_BIND_ADDR
    default_bind: "0.0.0.0"

  cadvisor:
    compose_service: cadvisor
    container_port: 8080
    host_env_port: CADVISOR_PORT
    default_host_port: 9413
    host_env_bind: CADVISOR_BIND_ADDR
    default_bind: "0.0.0.0"

profiles:
  private_network:
    class: default_private
    description: "Gateway와 Grafana만 host-published. vLLM, Risk Adapter, Prometheus, DCGM, cAdvisor는 compose 내부망만."
    host_published:
      - gateway
      - grafana
    diagnostics:
      gateway_bypass_possible: false
      direct_model_runtime_access: false
      direct_risk_adapter_access: false
      direct_operations_endpoints: false
      requires_exposure_audience: false
    note: >
      Standard production topology. vLLM runtimes, Risk Adapter, Prometheus,
      DCGM exporter, and cAdvisor are compose-network only (expose, no ports).

  master_open:
    class: diagnostic_full_stack
    description: >
      전체 stack host-published. Gateway bypass, vLLM runtime direct access, Risk Adapter,
      Prometheus, DCGM, cAdvisor 직접 접근 가능. 정상 진단/운영 모드.
    host_published:
      - gateway
      - main_llm_vllm
      - embedding_vllm
      - embedding_ko_vllm
      - risk_prompt_vllm
      - risk_adapter
      - prometheus
      - grafana
      - dcgm_exporter
      - cadvisor
    diagnostics:
      gateway_bypass_possible: true
      direct_model_runtime_access: true
      direct_risk_adapter_access: true
      direct_operations_endpoints: true
      requires_exposure_audience: true
    note: >
      Gateway bypass, runtime direct access, operations endpoint direct exposure는
      master_open의 의도된 특성이다. 이를 별도 mode로 회피하지 않는다.
      대신 EXPOSURE_AUDIENCE로 대상 network을 명시하고, exposure-status/doctor/preflight가
      구조화된 diagnostics 필드로 판단한다.
      EXPOSURE_AUDIENCE allowed values: local_only, private_lan, vpn, public

# exposure_audience: EXPOSURE_AUDIENCE env var의 허용값 목록.
# auth_doctor, preflight_compose.sh, exposure_status.py, validate_env_contract.py가
# 이 source를 사용해 값을 검증한다.
# local_only는 host-published 서비스가 루프백(127.0.0.1)에 바인드되어야 함을 의미한다.
# 0.0.0.0 bind와 local_only 조합은 auth_doctor와 preflight가 FAIL 처리한다.
exposure_audience:
  allowed_values:
    - local_only
    - private_lan
    - vpn
    - public

# deprecated_aliases: 과거 mode 이름을 canonical target으로 매핑한다.
# - profiles와 이름이 겹치면 안 된다.
# - target은 canonical_modes에 있어야 한다.
# - compose_up.sh와 preflight는 alias를 target으로 normalize하고 경고를 출력한다.
deprecated_aliases:
  ops_open:
    target: master_open
    reason: "Unnecessary intermediate state between private_network and master_open; promotes operator decision tree complexity without structural benefit."
    remove_after: "2026-12-01"
  all_open:
    target: master_open
    reason: "Gateway bypass is an intended diagnostic property of master_open. Splitting it into a separate mode was side-effect avoidance, not structural resolution."
    remove_after: "2026-12-01"
