version: 1

# Deployment feature와 runtime dependency의 연결 기준이다. Compose 서비스의 실제
# 이름과 포트는 configs/services.yaml을 참조하며 이 파일에 중복하지 않는다.
runtimes:
  main_llm:
    service_id: main_llm_vllm
    features: [chat]
    required: true
    enabled: true
    controllable: false
  embedding:
    service_id: embedding_vllm
    features: [embeddings]
    required: true
    enabled: true
    controllable: true
  embedding_ko:
    service_id: embedding_ko_vllm
    features: [embeddings]
    required: true
    enabled: true
    controllable: true
  risk_prompt:
    service_id: risk_prompt_vllm
    features: [risk]
    required: true
    enabled: true
    controllable: true
