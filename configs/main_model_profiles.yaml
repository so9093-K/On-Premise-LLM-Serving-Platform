version: 1
public_model: local-main
default_profile: gemma4-26b-a4b-fp8
runtime:
  compose_service: main-llm-vllm
  container_port: 9401
  health_path: /health
  models_path: /v1/models
  chat_path: /v1/chat/completions
  image: vllm/vllm-openai@sha256:f4492643056969529a74238f71dd66dc3097c0d433156a4f4478456bf84bd276
  drain_timeout_seconds: 30
  startup_timeout_seconds: 600
  stop_timeout_seconds: 30
profiles:
  gemma4-26b-a4b-fp8:
    display_name: Gemma 4 26B A4B FP8
    model_id: RedHatAI/gemma-4-26B-A4B-it-FP8-Dynamic
    revision: 8edbb9269ec9c3faad538ee1208a07eb46051f34
    served_model_name: local-main
    compatibility:
      status: verified
      reasons:
      - 현재 RTX 6000 Ada 48GiB 배포 환경은 이 20K 런타임 정책으로 26B 모델을 운영 중이다.
      - 이 프로필을 추가할 때 모델 revision과 런타임 이미지 digest를 기록했다.
      - 12B(50K) 검증 직후 실제로 이 프로필로 전환해 재확인했다. local-main 자체 35,940
        MiB(35.1 GiB), 전체(embed/embed-ko/risk-prompt 포함) 41.5 GiB 사용, headroom
        5.8 GiB. /metrics에서 num_gpu_blocks=10812, block_size=16 (KV cache 172,992
        tokens) 확인 -- 현재 설정(seq=1, 20K = 최소 필요 20,000 tokens) 대비 약 8.6배
        여유가 있다.
      validation:
        gpu: NVIDIA RTX 6000 Ada Generation
        compute_capability: "8.9"
        vram_mib: 49140
        context_tokens: 20000
        concurrency: 1
        validated_at: "2026-07-16"
    capabilities:
      model_input: [text, image]
      deployed_input: [text, image]
      output: [text]
      audio: disabled
      audio_enabled: false
      audio_block_reason: model_variant_does_not_expose_audio
      video: disabled
      video_enabled: false
      video_block_reason: model_variant_does_not_expose_video
    command:
    - --model
    - RedHatAI/gemma-4-26B-A4B-it-FP8-Dynamic
    - --revision
    - 8edbb9269ec9c3faad538ee1208a07eb46051f34
    - --served-model-name
    - local-main
    - --host
    - 0.0.0.0
    - --port
    - "9401"
    - --max-model-len
    - "20000"
    - --max-num-seqs
    - "1"
    - --max-num-batched-tokens
    - "20000"
    - --optimization-level
    - "3"
    - --gpu-memory-utilization
    - "0.76"
    - --tensor-parallel-size
    - "1"
    - --dtype
    - auto
    - --trust-remote-code
    - --enable-prefix-caching
    - --prefix-caching-hash-algo
    - sha256_cbor
    - --enable-auto-tool-choice
    - --tool-call-parser
    - gemma4
    - --reasoning-parser
    - gemma4
    - --chat-template
    - /app/configs/gemma4_chat_template.jinja
    - --structured-outputs-config
    - '{"backend":"xgrammar","disable_any_whitespace":true,"enable_in_reasoning":true}'
  gemma4-12b-unified-fp8:
    display_name: Gemma 4 12B Unified FP8
    model_id: RedHatAI/gemma-4-12B-it-FP8-Dynamic
    revision: 67e53491df7a281623fa740de61307d5c542b7f4
    served_model_name: local-main
    # Per-profile runtime image: the derived ops/images/vllm-gemma4-audio build that
    # fixes 12B multimodal (see capabilities). CI/deploy injects its immutable digest
    # into AUDIO_VLLM_IMAGE (like compose's ${RISK_VLLM_IMAGE}); when unset the loader
    # falls back to the shared base and the media boot canaries keep 12B from going live.
    # stock base에서는 image/audio가 깨진다 -- vision_embedder.patch_dense의 FP8
    # ignore-list prefix 불일치로 pad 출력만 나오고, feature_extractor.fft_length가
    # 없어서 audio warmup이 죽는다. 2026-06-25에 upstream vLLM/transformers 버그로
    # root-cause를 확인했고 이 파생 이미지에서 고쳤다. audio/video boot canary가 매
    # 전환마다 이걸 재검증하므로, 고쳐진 이미지 없이는 canary가 실패하고 롤백된다.
    image: ${AUDIO_VLLM_IMAGE}
    compatibility:
      status: verified
      reasons:
      - 마지막으로 live-validated된 커맨드에서 --max-model-len/--max-num-batched-tokens만
        20000 -> 50000으로 바뀌었다; --max-num-seqs(2)와 --gpu-memory-utilization(0.76)은
        그대로다.
      - 직전 20K 엔진의 실측 /metrics에서 num_gpu_blocks=20707, block_size=16 (KV cache
        용량 331,312 tokens)이 확인됐다. 20K/seq=2 기준 필요량은 40,000 tokens로 약 8배
        여유가 있었고, 이 여유를 근거로 50K를 실제 배포 서버에서 전환(switch)해 부팅
        성공을 확인했다 (아래 validation 참고).
      - 부팅 후 실측 /metrics에서 num_gpu_blocks=16638 (KV cache 용량 266,208 tokens)로
        재확인됐다 -- 20K 때보다 줄었는데, --max-num-batched-tokens가 커지면서 profiling
        시 activation 메모리 추정치가 커져 KV cache 몫이 줄어든 것으로 보인다. 그래도
        2x50,000=100,000 tokens 대비 약 2.7배 여유가 남아 gpu_memory_utilization은
        건드리지 않았다.
      - 이 프로필 ID는 별도로 만들었던 gemma4-12b-unified-fp8-50k 후보를 이 자리로 합친
        것이다. 그 결과 이전에 verified였던 20K 커맨드를 가리키는 별도의 known-good
        프로필 ID는 더 이상 없다 -- 이후 50K 커맨드가 이상 동작하면, 별도 프로필로의 자동
        롤백이 아니라 이 파일을(예를 들어 git으로) 수동으로 되돌려야 20K로 복구된다.
      - 이 model_id/revision/런타임 이미지 조합의 최초 호스트 검증은 2026-06-25에 20K
        context에서 완료됐다; 해당 기록은 git history를 참고한다.
      - --max-num-seqs를 2 -> 3으로 올렸다. 50K/seq=2 실측 pool(266,208 tokens, KV cache
        용량 --max-num-batched-tokens=50000 기준) 대비 seq=3 필요량은 3x50,000=150,000
        tokens로 pool의 약 56%, 여유 약 1.77배(116,208 tokens)다. seq=2->50K 때(8배 여유)
        보다는 타이트하지만 여전히 안전한 수준으로 판단해 운영자 결정으로 반영했다.
      - seq=3 커맨드가 실제로 라이브 배포된 상태에서 2026-07-23에 /metrics를 재확인했다 --
        num_gpu_blocks=17634, block_size=16 (KV cache 용량 282,144 tokens), seq=3
        필요량 150,000 tokens 대비 약 1.88배 여유로, 위 예측(1.77배)보다 실측 여유가 더
        컸다.
      - --max-model-len/--max-num-batched-tokens를 50000 -> 58192로 올렸다. 58192 =
        max_output_tokens(8192, gateway 정책 상한) + 50000(기존 검증된 입력 여유)이다 --
        지금까지는 입력+출력이 50000 안에서 서로를 갉아먹었는데, 이후로는 입력 50000과
        출력 8192가 서로 침범하지 않고 각각 보장된다. **이 정확한 커맨드(58192)의 실제
        boot/`/metrics` 재확인은 아직 없다** -- 위 1.88배 여유는 max-num-batched-tokens가
        50000일 때 실측이고, 58192로 올리면 activation 메모리 프로파일링 추정치가 커져
        KV cache pool이 줄어드는 현상이 재현될 수 있다(20K->50K 전환 때 실측으로 확인된
        패턴, 이번엔 상승폭이 훨씬 작아 영향도 작을 것으로 예상하나 확정 아님). 배포 전
        재부팅 후 재측정 필요.
      - 게이트웨이 max_output_tokens 정책을 8192 -> 13000으로 올렸다(단일 스트림 실측
        52 tokens/sec 기준, MAIN_LLM_TIMEOUT_SECONDS=300 안에 약 250초로 여유 50초).
        위 58192 산식(50000 입력 + 8192 출력)이 더 이상 정확히 들어맞지 않는다 --
        max-model-len은 58192 그대로 두었으므로, 출력이 13000을 다 쓰는 최악의 경우 입력
        여유는 50000이 아니라 58192-13000=45192로 줄어든다. 원래 의도한 50000 입력
        여유를 그대로 지키려면 max-model-len도 63000(=50000+13000)으로 같이 올려야 하나,
        아직 그렇게 하지 않았다 -- 이 트레이드오프는 의도적으로 미룬 것이며 결정 대기 중.
      validation:
        gpu: NVIDIA RTX 6000 Ada Generation
        compute_capability: "8.9"
        vram_mib: 49140
        context_tokens: 50000
        concurrency: 3
        validated_at: "2026-07-23"
        note: context_tokens(50000)은 마지막으로 실측 확인된 커맨드 기준이다 -- 현재
          command의 --max-model-len/--max-num-batched-tokens는 58192로 이미 올라가
          있고 이 값 자체는 아직 재부팅/재측정 전이다(위 reasons 참고).
    capabilities:
      model_input: [text, image, audio, video]
      # Full multimodal, served by the pinned derived image (image rides in
      # deployed_input like 26B). audio/video enabled flags trigger boot canaries
      # (fails -> rollback), so go-live is gated on the runtime actually decoding
      # the advertised modalities, not on a static flag.
      deployed_input: [text, image, audio, video]
      output: [text]
      audio: enabled
      audio_enabled: true
      video: enabled
      video_enabled: true
    command:
    - --model
    - RedHatAI/gemma-4-12B-it-FP8-Dynamic
    - --revision
    - 67e53491df7a281623fa740de61307d5c542b7f4
    - --served-model-name
    - local-main
    - --host
    - 0.0.0.0
    - --port
    - "9401"
    - --max-model-len
    - "58192"
    - --max-num-seqs
    - "3"
    - --max-num-batched-tokens
    - "58192"
    - --optimization-level
    - "3"
    # Per-host capacity knob: override at deploy time via
    # MAIN_LLM_GPU_MEMORY_UTILIZATION (a smaller GPU sets a higher fraction).
    - --gpu-memory-utilization
    - "0.76"
    - --tensor-parallel-size
    - "1"
    - --dtype
    - auto
    - --trust-remote-code
    - --enable-prefix-caching
    - --prefix-caching-hash-algo
    - sha256_cbor
    - --enable-auto-tool-choice
    - --tool-call-parser
    - gemma4
    - --reasoning-parser
    - gemma4
    - --chat-template
    - /app/configs/gemma4_chat_template.jinja
    - --structured-outputs-config
    - '{"backend":"xgrammar","disable_any_whitespace":true,"enable_in_reasoning":true}'
