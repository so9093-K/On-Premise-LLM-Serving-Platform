    - --revision
    - 67e53491df7a281623fa740de61307d5c542b7f4
    - --served-model-name
    - local-main
    - --host
    - 0.0.0.0
    - --port
    - "9401"
    - --max-model-len
    - "50000"
    - --max-num-seqs
    - "3"
    - --max-num-batched-tokens
    - "50000"
    - --optimization-level
    - "3"
    # host별 VRAM 비율은 MAIN_LLM_GPU_MEMORY_UTILIZATION으로만 바꾼다.
    - --gpu-memory-utilization
    - "0.76"
    - --tensor-parallel-size
    - "1"
    - --dtype
    - auto
    - --trust-remote-code
    - --enable-prefix-caching
    - --prefix-caching-hash-algo
    - sha256_cbor
    - --enable-auto-tool-choice
    - --tool-call-parser
    - gemma4
    - --reasoning-parser
    - gemma4
    # 응답 형식에 영향을 주는 Gemma 4 prompt template이다.
    - --chat-template
    - /app/configs/gemma4_chat_template.jinja
    - --structured-outputs-config
    # 12B와 동일하게 reasoning 종료 뒤 최종 답변에만 JSON schema grammar를 적용한다.
    - '{"backend":"xgrammar","disable_any_whitespace":true,"enable_in_reasoning":false}'
    # 26B와 공통인 API 기능은 재사용하되, 이 Profile이 실제 배포하는 media 한도만 확장한다.
    gateway_policy:
      <<: *gemma4_gateway_policy
      request_limits:
        <<: *gemma4_text_image_limits
        max_model_len: 50000
        input_modalities: [text, image, audio, video]
        # audio/video는 이 Profile이 실제로 배포할 때만 허용된다.
        max_audio_inputs: 1
        allowed_audio_formats: [wav, mp3, flac, ogg, m4a, mp4, aac]
        max_audio_bytes: 25000000
        max_video_inputs: 1
        allowed_video_url_schemes: [data]
        allowed_video_mime_types: [video/mp4, video/webm, video/x-matroska, video/quicktime, video/jpeg, video/x-msvideo, video/avi, video/gif]
        max_video_bytes: 50000000
        max_video_frames: 60
        max_video_frame_pixels: 12845056
        max_video_duration_seconds: 60
  gemma4-e4b-it:
    display_name: Gemma 4 E4B IT
    model_id: google/gemma-4-E4B-it
    revision: ee0ef6023621cff504d758262d4e04895a5af4a2
    served_model_name: local-main
    image: ${AUDIO_VLLM_IMAGE}
    compatibility:
      # 전환·Gateway 계약·streaming reasoning·structured output·tool call을 배포본에서
      # 실측했고 12B/26B 회귀도 확인했다. 전환 실패 시 rollback 경로만 미검증이라 보류한다.
      status: unverified
    capabilities:
      # 이 집합은 Gateway 허용 입력과 switch-time media canary의 단일 기준이다.
      # 각 경로는 동일 immutable image의 직접 vLLM canary를 통과했다.
      deployed_input: [text, image, audio, video]
    command:
    - --model
    - google/gemma-4-E4B-it
    - --revision
    - ee0ef6023621cff504d758262d4e04895a5af4a2
    - --served-model-name
    - local-main
    - --host
    - 0.0.0.0
    - --port
    - "9401"
    # E4B의 128K 명세를 운영 한도로 쓰지 않는다. 아래는 같은 GPU에서 세 profile을
    # 실측 대조해 정한 값이다.
    #
    #   profile  weights     KV 메모리   KV token   자기 context 기준 동시성
    #   E4B      15.47 GiB   18.88 GiB   352,943    21.54x @ 16,384
    #   12B      12.75 GiB   17.22 GiB    53,722     1.07x @ 50,000
    #   26B      25.80 GiB    6.60 GiB    31,438     1.57x @ 20,000
    #
    # E4B는 비슷한 KV 메모리에서 token이 6.6배 나온다. 이전 값(16,384/seqs=1)은 그
    # 352,943 token 중 4.6%만 쓰면서 동시 요청을 직렬화시켰다(4건 3.0/6.0/8.9/11.9초).
    # context는 default profile인 12B와 같은 50,000에 맞춘다. 12B는 그 context에서
    # KV가 1.07x라 max_num_seqs=3이 이미 초과 구독인 반면, E4B는 50,000 x 4 = 200,000으로
    # 1.76x 여유가 남는다. batched도 12B가 같은 GPU에서 검증한 50,000을 쓴다.
    # max_model_len만 65,000(= 입력 50,000 + 출력 15,000)으로 올리고 batched는 50,000에
    # 둔다. chunked prefill이 켜져 있어(엔진 로그 확인) 긴 prompt는 50,000 chunk로 쪼개
    # 처리되므로, 활성 메모리는 batched가 정하고 max_model_len은 시퀀스당 KV 상한만 정한다.
    # 지금까지 KV 부족 사고는 전부 batched를 같이 올려서 났다 — 오늘 16,384->50,000에
    # KV가 18.88->15.03 GiB로 줄었고, 12B는 58,192로 올렸다가 boot 실패로 롤백됐다(아래 주석).
    # batched를 고정하면 KV pool 281,169 token이 유지될 것으로 보나, boot 재측정 전에는
    # 확정이 아니다. 4 x 65,000 = 260,000으로 pool의 92%라 네 요청이 동시에 65K를 모두
    # 채우면 preemption이 날 수 있다(장애가 아니라 recompute로 인한 지연). 실측 KV 사용률은
    # 0.4% 수준이었다. `batched >= max_model_len` 제약은 pooling 런타임에만 적용된다.
    - --max-model-len
    - "65000"
    - --max-num-seqs
    - "4"
    - --max-num-batched-tokens
    - "50000"
    # KV token은 남지만 GPU 잔여가 5 GiB대라 이 값은 올리지 않는다.
    - --gpu-memory-utilization
    - "0.76"
    - --tensor-parallel-size
    - "1"
    - --dtype
    - auto
    - --trust-remote-code
    # E4B도 Gemma4의 native tool/reasoning channel을 사용한다. 아래 parser와 template는
    # 동일 image·revision의 일회성 runtime에서 tool_calls 및 reasoning 분리를 확인했다.
    - --enable-auto-tool-choice
    - --tool-call-parser
    - gemma4
    - --reasoning-parser
    - gemma4
    - --chat-template
    - /app/configs/gemma4_chat_template.jinja
    gateway_policy:
      # 12B가 13000을 고른 방식(단일 스트림 52 tok/s로 300초 안에 250초)을 E4B 실측으로
      # 다시 계산한 값이다. E4B는 단일 79~82 tok/s, 동시 2건에서도 73 tok/s로 저하가 8%뿐이라
      # 15,000 token은 73 tok/s 기준 약 205초다. 자연 종료 최댓값이 12,616 token(상한의
      # 97%)까지 관측돼 13000은 여유가 3%밖에 없었다.
      #
      # 전제: MAIN_LLM_TIMEOUT_SECONDS >= 400 (그리고 REQUEST_TIMEOUT_SECONDS는 그 이상).
      # 배포된 .env의 운영자 값이며 sync-env가 덮지 않는다. 300초로 남아 있어도 단일·2건
      # 경로는 205초라 들어가지만, 4-way 동시 긴 생성이나 reasoning이 붙으면 여유가 없다.
      #
      max_output_tokens: 15000
      request_limits:
        # command와 같은 값을 유지한다(engine 한도와 admission이 갈라지지 않게 하는 계약).
        # 남은 구멍: prompt + max_tokens 합은 검사하지 않으므로 60,000 prompt에
        # max_tokens=15,000이면 admission을 통과하고 engine 창(65,000)을 넘는다. 이는 12B
        # 주석에 이미 "결정 대기 중"으로 남아 있는 것과 같은 트레이드오프다.
        max_model_len: 65000
        input_modalities: [text, image, audio, video]
        # E4B 고유 최대치를 추정해 열지 않는다. 기존 unified decode 경계의 보수적인
        # transport 한도를 시작점으로 쓰고, media 실측 뒤 조정한다.
        max_image_inputs: 1
        allowed_image_url_schemes: [data]
        max_image_bytes: 25000000
        max_image_pixels: 12845056
        allowed_image_mime_types: [image/jpeg, image/png, image/webp, image/avif, image/jp2, image/gif, image/bmp, image/tiff, image/x-tiff]
        max_audio_inputs: 1
        allowed_audio_formats: [wav, mp3, flac, ogg, m4a, mp4, aac]
        max_audio_bytes: 25000000
        max_video_inputs: 1
        allowed_video_url_schemes: [data]
        allowed_video_mime_types: [video/mp4, video/webm, video/x-matroska, video/quicktime, video/jpeg, video/x-msvideo, video/avi, video/gif]
        max_video_bytes: 50000000
        max_video_frames: 60
        max_video_frame_pixels: 12845056
        max_video_duration_seconds: 60
      # 동일 image·revision의 parser runtime에서 구조화된 tool_calls와 reasoning 분리를
      # 확인했다. 템플릿 경로와 parser 이름은 command와 같은 단일 계약으로 유지한다.
      runtime_features:
        tool_calling:
          enabled: true
          auto_tool_choice: true
          tool_call_parser: gemma4
          reasoning_parser: gemma4
          allow_parallel_tool_calls: false
          chat_template: /app/configs/gemma4_chat_template.jinja
        structured_outputs:
          enabled: true
          backend: xgrammar
      request_parameter_policy:
        allow_unlisted_parameters: false
        supported_parameters: [stream, stream_options, temperature, max_tokens, top_p, top_k, min_p, presence_penalty, frequency_penalty, repetition_penalty, stop, seed, n, tools, tool_choice, parallel_tool_calls, reasoning, response_format, logprobs, top_logprobs, logit_bias]
        max_n: 1
        tool_calling:
          enabled: true
          max_tools: 64
          allow_parallel_tool_calls: false
        reasoning:
          enabled: true
          default: false
          mode: request_opt_in
          upstream_chat_template_kwargs:
            enable_thinking: true
        response_format:
          enabled: true
          types: [text, json_object, json_schema]
          json_object:
            require_json_instruction: true
          json_schema:
            enabled: true
            require_root_object: true
            require_additional_properties_false: true
            strict:
              allowed: true
              require_true: false
            max_schema_bytes: 16384
            max_depth: 8
            max_total_properties: 64
            max_properties_per_object: 32
            max_required: 64
            max_enum_values: 128
            max_enum_string_length: 256
            max_property_name_length: 64
            max_total_schema_string_length: 32768
            disallowed_keywords: [allOf, not, if, then, else, dependentRequired, dependentSchemas, patternProperties, $dynamicRef, $recursiveRef, $dynamicAnchor, $recursiveAnchor, $id, $anchor]
            root_disallowed_keywords: [anyOf]
        logprobs:
          enabled: true
          default: false
          allow_stream: true
        top_logprobs:
          min: 0
          max: 10
          requires_logprobs: true
        logit_bias:
          enabled: true
          max_entries: 256
          min_bias: -100
          max_bias: 100
          token_id_min: 0
          token_id_semantics: served_model_tokenizer
        combinations:
          logprobs_with_stream:
            mode: allow
          json_schema_with_logit_bias:
            mode: allow
  qwen2.5-omni-7b-thinker:
    display_name: Qwen 2.5 Omni 7B (Thinker)
    model_id: Qwen/Qwen2.5-Omni-7B
    revision: ae9e1690543ffd5c0221dc27f79834d0294cba00
    served_model_name: local-main
    # 12B와 같은 media decode stack(soundfile/librosa/PyAV)이 필요해 같은 derived image를
    # 공유한다. Gemma4 전용 패치(vision_embedder.patch_dense, feature_extractor.fft_length)는
    # 이 모델의 코드 경로와 겹치지 않아 no-op일 것으로 예상하나, 3단계 실제 부팅에서 확인한다.
    image: ${AUDIO_VLLM_IMAGE}
    compatibility:
      # 2026-08-14: 독립된 재부팅 2회에서 text/image/audio/video switch-time canary를 모두
      # 통과했고, Gateway 경유 response_format/logprobs/top_logprobs/logit_bias/
      # stream+logprobs/json_schema+logit_bias 계약까지 실측해 verified로 승격했다.
      status: verified
    capabilities:
      # Gateway 허용 입력이자 switch-time media boot canary의 단일 source of truth다.
      deployed_input: [text, image, audio, video]
    # 0단계 조사 뒤 처음 추가하는 최소 커맨드다. Gemma 전용 tool/reasoning parser,
    # chat-template, structured-output 옵션은 넣지 않는다. max_num_seqs=4는 32K context
    # 기준 실측 KV cache 동시성 6.39와 Gateway admission 4를 맞춘 값이다.
    command:
    - --model
    - Qwen/Qwen2.5-Omni-7B
    - --revision
    - ae9e1690543ffd5c0221dc27f79834d0294cba00
    - --served-model-name
    - local-main
    - --host
    - 0.0.0.0
    - --port
    - "9401"
    - --max-model-len
    - "32768"
    - --max-num-seqs
    - "4"
    - --gpu-memory-utilization
    - "0.6"
    # Qwen 전용 API 계약이다. tool calling과 reasoning은 지원하지 않아 선언하지 않는다.
    # response_format/logprobs/logit_bias는 vLLM 직접 요청으로 확인해 활성화했으며,
    # verified 승격 전에는 Gateway 경유 계약도 같은 조합으로 확인한다. Gemma와 달리
    # structured output은 별도 CLI 옵션 없이 vLLM 기본 xgrammar backend로 동작한다.
    gateway_policy:
      # 13,000-token 강제 생성도 약 59 tok/s로 HTTP 200을 완료했고 KV cache 최대
      # 점유는 6.1%였다. production upstream timeout 300초 안에 드는 상한이다. 단,
      # media가 차지한 prompt token과 출력은 32K context를 공유하므로 이 값은 보장량이
      # 아닌 요청 상한이다(720p·60초·60-frame video는 prompt 약 21.6K tokens).
      max_output_tokens: 13000
      request_limits:
        max_model_len: 32768
        input_modalities: [text, image, audio, video]
        max_image_inputs: 1
        allowed_image_url_schemes: [data]
        # max_image_pixels는 Qwen2.5-Omni-7B preprocessor_config.json(Qwen2VLImageProcessor)의
        # 실측 max_pixels다. 나머지 byte/mime 한도는 같은 decode stack을 쓰는 12B profile 값을
        # 시작점으로 재사용한 것으로, Qwen 자체 canary(2, 3단계)로 재확인 전까지는 잠정치다.
        max_image_bytes: 25000000
        max_image_pixels: 12845056
        allowed_image_mime_types: [image/jpeg, image/png, image/webp, image/avif, image/jp2, image/gif, image/bmp, image/tiff, image/x-tiff]
        max_audio_inputs: 1
        allowed_audio_formats: [wav, mp3, flac, ogg, m4a, mp4, aac]
        max_audio_bytes: 25000000
        max_video_inputs: 1
        allowed_video_url_schemes: [data]
        allowed_video_mime_types: [video/mp4, video/webm, video/x-matroska, video/quicktime, video/jpeg, video/x-msvideo, video/avi, video/gif]
        max_video_bytes: 50000000
        max_video_frames: 60
        max_video_frame_pixels: 12845056
        max_video_duration_seconds: 60
      # tool_calling/reasoning은 선언하지 않아 Gateway가 거부한다. 아래 세 기능은 vLLM
      # 직접 요청과 Gateway 경유 계약을 모두 확인했다.
      runtime_features:
        structured_outputs:
          enabled: true
          backend: xgrammar
      request_parameter_policy:
        allow_unlisted_parameters: false
        supported_parameters: [stream, stream_options, temperature, max_tokens, top_p, top_k, min_p, presence_penalty, frequency_penalty, repetition_penalty, stop, seed, n, response_format, logprobs, top_logprobs, logit_bias]
        max_n: 1
        response_format:
          enabled: true
          types: [text, json_object, json_schema]
          json_object:
            require_json_instruction: true
          json_schema:
            enabled: true
            require_root_object: true
            require_additional_properties_false: true
            strict:
              allowed: true
              require_true: false
            max_schema_bytes: 16384
            max_depth: 8
            max_total_properties: 64
            max_properties_per_object: 32
            max_required: 64
            max_enum_values: 128
            max_enum_string_length: 256
            max_property_name_length: 64
            max_total_schema_string_length: 32768
            disallowed_keywords: [allOf, not, if, then, else, dependentRequired, dependentSchemas, patternProperties, $dynamicRef, $recursiveRef, $dynamicAnchor, $recursiveAnchor, $id, $anchor]
            root_disallowed_keywords: [anyOf]
        # 2026-08-14 vLLM 직접 요청으로 실측 검증: logprobs/top_logprobs 정상 응답,
        # logit_bias는 양의 편향으로 특정 토큰 강제, 정확한 토큰 ID로 음의 편향 시 회피까지
        # 확인(최초 시도는 토큰화 경계를 잘못 짚어 다른 토큰을 편향시킨 테스트 실수였음).
        logprobs:
          enabled: true
          default: false
          allow_stream: true
        top_logprobs:
          min: 0
          max: 10
          requires_logprobs: true
        logit_bias:
          enabled: true
          max_entries: 256
          min_bias: -100
          max_bias: 100
          token_id_min: 0
          token_id_semantics: served_model_tokenizer
        combinations:
          json_schema_with_logit_bias:
            mode: allow
          logprobs_with_stream:
            mode: allow
description: |
  이력은 현재 설정의 근거를 보존하기 위한 참고 정보다. 전환 로직은 각 profile의
  compatibility.status와 실행 canary만 사용한다.

  [gemma4-26b-a4b-fp8]
  현재 RTX 6000 Ada 48GiB 배포 환경은 이 20K 런타임 정책으로 26B 모델을 운영 중이다.
  이 프로필을 추가할 때 모델 revision과 런타임 이미지 digest를 기록했다.

  12B(50K) 검증 직후 실제로 이 프로필로 전환해 재확인했다. local-main 자체 35,940
  MiB(35.1 GiB), 전체(embed/embed-ko/risk-prompt 포함) 41.5 GiB 사용, headroom 5.8 GiB.
  /metrics에서 num_gpu_blocks=10812, block_size=16 (KV cache 172,992 tokens) 확인 -- 현재
  설정(seq=1, 20K = 최소 필요 20,000 tokens) 대비 약 8.6배 여유가 있다.

  2026-07-24, runtime.image를 gemma4-unified-cu129(vLLM main 브랜치 2026-06-03 dev
  snapshot)에서 v0.25.1 정식 릴리스 digest로 바꿨다 -- 12B/risk-prompt 파생 이미지는 이미
  이 릴리스를 베이스로 쓰고 있었고, 26B만 구버전 dev snapshot에 남아 있던 걸 맞춘 것.

  같은 날 실제로 12B(당시 라이브)를 잠깐 내리고 이 이미지로 26B를 부팅해 재검증했다 --
  healthy, /v1/models//v1/chat/completions 실제 호출 정상. gpu_worker.py 실측 -- Available
  KV cache memory 6.6 GiB, GPU KV cache size 31,438 tokens, 20,000 tokens 요청 기준 max
  concurrency 1.57x(20K 단일 요청 대비 여유, 12B의 현재 1.07x보다 넉넉함). 검증 후 그 시점
  라이브 상태(12B)로 복귀했다 -- 26B를 실제 기본으로 올릴지는 별도 결정 필요.

  2026-07-25, runtime.image가 이제 Gemma4 멀티모달 패치 + Kanana Llama head_dim 패치가
  병합된 vllm-unified 이미지를 가리킨다. 12B/embedding/embedding-ko/risk-prompt 재부팅
  검증 직후 26B로도 다시 전환해 재확인했다 -- healthy, 텍스트/이미지 입력 둘 다 정상(두
  patch 모두 26B의 코드 경로와 안 겹쳐 no-op이라는 설계 그대로 확인됨). 검증 후 12B로
  복귀했다.

  검증값: gpu=NVIDIA RTX 6000 Ada Generation, compute_capability=8.9, vram_mib=49140,
  context_tokens=20000, concurrency=1, validated_at=2026-07-25,
  kv_cache_size_tokens=31438, kv_cache_max_concurrency=1.57.

  [gemma4-12b-unified-fp8]
  마지막으로 live-validated된 커맨드에서 --max-model-len/--max-num-batched-tokens만
  20000 -> 50000으로 바뀌었다; --max-num-seqs(2)와 --gpu-memory-utilization(0.76)은
  그대로다.

  직전 20K 엔진의 실측 /metrics에서 num_gpu_blocks=20707, block_size=16 (KV cache 용량
  331,312 tokens)이 확인됐다. 20K/seq=2 기준 필요량은 40,000 tokens로 약 8배 여유가
  있었고, 이 여유를 근거로 50K를 실제 배포 서버에서 전환(switch)해 부팅 성공을 확인했다.

  부팅 후 실측 /metrics에서 num_gpu_blocks=16638 (KV cache 용량 266,208 tokens)로
  재확인됐다 -- 20K 때보다 줄었는데, --max-num-batched-tokens가 커지면서 profiling 시
  activation 메모리 추정치가 커져 KV cache 몫이 줄어든 것으로 보인다. 그래도
  2x50,000=100,000 tokens 대비 약 2.7배 여유가 남아 gpu_memory_utilization은 건드리지
  않았다.

  이 프로필 ID는 별도로 만들었던 gemma4-12b-unified-fp8-50k 후보를 이 자리로 합친 것이다.
  그 결과 이전에 verified였던 20K 커맨드를 가리키는 별도의 known-good 프로필 ID는 더 이상
  없다 -- 이후 50K 커맨드가 이상 동작하면, 별도 프로필로의 자동 롤백이 아니라 이 파일을
  (예를 들어 git으로) 수동으로 되돌려야 20K로 복구된다.

  이 model_id/revision/런타임 이미지 조합의 최초 호스트 검증은 2026-06-25에 20K context에서
  완료됐다; 해당 기록은 git history를 참고한다.

  --max-num-seqs를 2 -> 3으로 올렸다. 50K/seq=2 실측 pool(266,208 tokens, KV cache 용량
  --max-num-batched-tokens=50000 기준) 대비 seq=3 필요량은 3x50,000=150,000 tokens로
  pool의 약 56%, 여유 약 1.77배(116,208 tokens)다. seq=2->50K 때(8배 여유)보다는
  타이트하지만 여전히 안전한 수준으로 판단해 운영자 결정으로 반영했다.

  seq=3 커맨드가 실제로 라이브 배포된 상태에서 2026-07-23에 /metrics를 재확인했다 --
  num_gpu_blocks=17634, block_size=16 (KV cache 용량 282,144 tokens), seq=3 필요량 150,000
  tokens 대비 약 1.88배 여유로, 위 예측(1.77배)보다 실측 여유가 더 컸다.

  --max-model-len/--max-num-batched-tokens를 50000 -> 58192로 올렸다. 58192 =
  max_output_tokens(8192, gateway 정책 상한) + 50000(기존 검증된 입력 여유)이다 --
  지금까지는 입력+출력이 50000 안에서 서로를 갉아먹었는데, 이후로는 입력 50000과 출력
  8192가 서로 침범하지 않고 각각 보장된다. 이 정확한 커맨드(58192)의 실제 boot//metrics
  재확인은 아직 없다 -- 위 1.88배 여유는 max-num-batched-tokens가 50000일 때 실측이고,
  58192로 올리면 activation 메모리 프로파일링 추정치가 커져 KV cache pool이 줄어드는 현상이
  재현될 수 있다(20K->50K 전환 때 실측으로 확인된 패턴, 이번엔 상승폭이 훨씬 작아 영향도
  작을 것으로 예상하나 확정 아님). 배포 전 재부팅 후 재측정 필요.

  게이트웨이 max_output_tokens 정책을 8192 -> 13000으로 올렸다(단일 스트림 실측 52
  tokens/sec 기준, MAIN_LLM_TIMEOUT_SECONDS=300 안에 약 250초로 여유 50초). 위 58192
  산식(50000 입력 + 8192 출력)이 더 이상 정확히 들어맞지 않는다 -- max-model-len은 58192
  그대로 뒀으므로, 출력이 13000을 다 쓰는 최악의 경우 입력 여유는 50000이 아니라
  58192-13000=45192로 줄어든다. 원래 의도한 50000 입력 여유를 그대로 지키려면
  max-model-len도 63000(=50000+13000)으로 같이 올려야 하나, 아직 그렇게 하지 않았다 --
  이 트레이드오프는 의도적으로 미룬 것이며 결정 대기 중.

  58192/seq=3를 실제로 배포했다가 boot 자체가 실패했다(2026-07-23, 실제 배포 로그 확인).
  vLLM 엔진이 초기화 단계에서 ValueError -- To serve at least one request with the model's
  max seq len (58192), (18.65 GiB KV cache is needed, which is larger than the available KV
  cache memory (16.28 GiB) -- 로 죽었고, vLLM 자신이 계산한 안전 상한은 50800이었다.
  배포 스크립트가 자동 롤백해 이전 릴리스(50000/seq=3)로 정상 복구됐다. 위 1.88배 여유
  계산(seq=3 기준)은 --max-num-batched-tokens=50000일 때의 activation 메모리 프로파일
  기준이라 58192로 올리면 무효였다는 뜻이다.

  크래시 로그의 실측값(18.65 GiB 필요/16.28 GiB 가용, seq=3·58192 기준)을 seq 비례로
  역산해 --max-num-seqs를 3 -> 2로 낮추면 필요량이 18.65 * 2/3 ≈ 12.44 GiB로 줄어 여유가
  생길 거라 예상하고 seq=2/max-model-len=58192로 반영했었다.

  2026-07-24 실제 배포에서 seq=2/58192 조합도 boot 자체가 실패했다 -- 크래시 로그가
  seq=3 때와 완전히 동일하다(18.65 GiB 필요/16.28 GiB 가용). 원인은 위 seq 비례 계산이
  틀렸다는 것 -- vLLM 에러 메시지는 "to serve at least one request with the model's max seq
  len"이라고 명시하는데, 이는 max_model_len 하나짜리 시퀀스 1개의 요구량이라
  --max-num-seqs와 무관하다 -- seq를 낮춰도 이 체크는 전혀 바뀌지 않는다. 배포 스크립트가
  다시 자동 롤백해 50000/seq=3으로 정상 복구됐다(같은 날 확인).

  gpu_memory_utilization 상향과 configs/gpu_budgets.yaml의 total_gpu_memory_utilization
  재분배도 검토했다 -- avoid_above(0.93)까지 다른 3개 서비스를 전부 tuning_range 최저치로
  눌러도 main_llm이 받을 수 있는 최댓값은 0.81 근처로, 18.65 GiB 요구량 대비 마진이
  사실상 0이다. avoid_above 자체가 reserve_gib.hard_minimum(3.5 GiB)에서 역산된 값이라
  더 올리는 것도 하드 미니멈을 깎아먹는 것과 같다. 즉 이 카드에서 58192는 다른 3개 모델과
  공존하는 한 안전 마진을 확보할 방법이 없다고 판단해
  --max-model-len/--max-num-batched-tokens/--max-num-seqs를 50000/50000/3으로 되돌린다.

  참고 -- 위 "266,208/282,144/331,312 tokens" 식의 과거 기록은 num_gpu_blocks x
  block_size(16)로 계산한 값인데, 이 model(Gemma4 heterogeneous head dim, TRITON_ATTN)에서는
  이 공식이 실제 용량과 안 맞는다 -- 실측 vllm:cache_config_info의 kv_cache_size_tokens는
  50000 커맨드에서 53,722(= "Available KV cache memory -- 17.22 GiB"와 일치),
  num_gpu_blocks(17634) x 16 = 282,144와는 다르다. 앞으로 이 model의 KV 캐시 용량은
  num_gpu_blocks 곱셈이 아니라 kv_cache_size_tokens 또는 부팅 로그의 Available KV cache
  memory GiB 값으로 확인한다.

  max-model-len을 50000으로 되돌렸지만 게이트웨이 max_output_tokens 정책은 13000 그대로
  뒀다 -- 위(2026-07-23 항목)에서 미뤄뒀던 입력/출력 공유 트레이드오프가 58192 때(입력
  여유 45192)보다 더 타이트하게(입력 여유 50000-13000=37000) 재적용된다는 뜻이다.
  max_model_len 관점에서는 여전히 유효한 설정(13000 < 50000)이라 boot를 막지는 않으나,
  출력이 13000을 다 쓰는 요청은 입력 37000 안에서만 허용된다는 걸 gateway 정책 결정으로
  의식하고 있어야 한다 -- 별도 결정 없이는 이 상태 유지.

  2026-07-25, ${AUDIO_VLLM_IMAGE}가 resolve하는 image 값이 이제 Gemma4 멀티모달 패치 +
  Kanana Llama head_dim 패치가 병합된 vllm-unified 이미지를 가리킨다(build-vllm-derived가
  CI에서 실제로 빌드/push함). 실제 이 이미지로 재부팅 -- healthy, 텍스트 채팅 정상,
  이미지 입력도 정상 응답(패치가 여전히 유효함을 확인).

  검증값: gpu=NVIDIA RTX 6000 Ada Generation, compute_capability=8.9, vram_mib=49140,
  context_tokens=50000, concurrency=3, validated_at=2026-07-25,
  kv_cache_size_tokens=53722, kv_cache_max_concurrency=1.07.

  [qwen2.5-omni-7b-thinker]
  2026-08-14, 후보 profile로 처음 추가. 최초 커맨드(--max-model-len 8192,
  --gpu-memory-utilization 0.4)로 전환 시도 -- text/image/audio canary는 성공했으나 video
  canary가 vLLM 자체 Qwen2VLVideoBackend.compute_frames_index_to_sample에서
  ZeroDivisionError로 실패, 자동 rollback으로 Gemma 12B 복귀. 원인은 vLLM/Qwen
  호환성 문제가 아니라 우리 video canary fixture(TINY_MP4_VIDEO_B64)가 1 frame짜리
  degenerate 영상이었던 것 -- total_frames_num=1이 temporal_patch_size(2) 나눗셈에서
  n=0을 유발했다. fixture를 6 frame/2fps 영상으로 교체 후 재전환 -- text/image/audio/video
  4종 전부 성공, 혼합 입력(image+audio+video 한 요청)도 성공, streaming도 정상.

  같은 날, structured output(response_format: json_schema/json_object)을 vLLM 직접
  요청으로 실측 검증 -- strict schema 강제(자유 대화 프롬프트에도 스키마 강제됨),
  무효 schema는 400 거부 확인. Gemma와 달리 --structured-outputs-config 등 별도 커맨드
  옵션 없이 vLLM 기본 xgrammar backend로 그대로 동작한다. gateway_policy에 반영 후
  재전환(--max-model-len 8192->32768, --gpu-memory-utilization 0.4->0.6로 리소스 여유도
  같이 반영) -- Gateway 경유 response_format 요청도 정상 확인.

  검증값(2026-08-14, --max-model-len 32768/--gpu-memory-utilization 0.6 기준):
  gpu=NVIDIA RTX 6000 Ada Generation, vram_mib=49140, kv_cache_size_tokens=209536,
  kv_cache_max_concurrency=6.39, gpu_used_mib=35840(free=12671, embedding/embedding-ko/
  risk-prompt 포함 전체 사용량).

  리소스 설정 변경 재부팅 로그를 다시 확인한 결과, 재시작 감지 reconcile이 4종 canary를
  다시 돌렸고(GET /v1/models -> text -> image -> audio -> video, 전부 200) 이 역시
  성공했다 -- 즉 독립된 재부팅 2회(fixture 수정 직후, 리소스 설정 변경 후) 모두 4종 전부
  성공해 재현성 조건을 충족한다. compatibility.status를 unverified -> likely로 승격했다.
  use_audio_in_video와 다중 media 정책은 후속 실측으로 확인했다. response_format,
  logprobs, logit_bias는 vLLM 직접 요청과 Gateway 경유에서 확인했다: logprobs/top_logprobs,
  logit_bias, stream+logprobs, json_schema+logit_bias가 모두 HTTP 200 및 기대 응답 형상을
  통과했다. 이 근거로 status를 verified로 승격했다. tool calling은 안정적인 parser/template
  경로가 없어 비활성, reasoning은 이 Thinker 경로의 기능이 아니다.

  리소스 재검토로 --max-num-seqs를 1 -> 4, Gateway max_output_tokens를 2048 -> 13000으로
  조정했다. 변경 전 실제 KV cache는 209,536 tokens(32,768 context 기준 6.39 seq), Gateway
  admission은 4였고, 13,000-token 강제 생성은 약 59 tok/s로 HTTP 200을 완료했다(KV cache
  최대 6.1%). 따라서 4 seq와 13,000 output은 각각 KV cache 여유와 production 300초 upstream
  timeout 안의 사용점이다. 단, 입력과 출력은 32K context를 공유한다. 720p·60초·60-frame
  video는 prompt 약 21.6K tokens를 소비해 13,000 output을 전부 보장할 수 없다. 후속 CICD
  배포 후 Gateway 경유 13,000-token 생성은 217.09초/HTTP 200/length(13,000 completion tokens)로
  완료했고, image·20초 audio·10초 video·3종 혼합 요청 4개 동시는 모두 200으로 완료했다.
  이때 vLLM running=4, waiting=0, peak KV cache=1.879%였다.
