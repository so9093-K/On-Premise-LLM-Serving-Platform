# 성능 지표의 canonical 이름과 정의를 단독으로 소유한다(ADR-0026).
#
# benchmark runner, evaluator, result schema, dashboard, validator는 이 이름을
# 복제하지 않고 참조한다. 여기 없는 이름을 쓰면 contract validator가 거부한다.
#
# 이름 규약은 두 표준을 따른다.
#
# 1. Prometheus naming: snake_case, base unit(seconds/bytes/ratio)을 접미사로 두고
#    누계 counter는 _total로 끝낸다. 밀리초를 쓰지 않는다. 저장소의 기존 지표
#    (http_request_duration_seconds 등)와 vLLM이 모두 초를 쓴다.
# 2. OpenTelemetry GenAI semantic conventions: 의미 구분을 그대로 가져온다.
#    특히 client는 chunk를, server는 token을 관찰한다는 구분이 중요하다.
#    otel 필드에 대응하는 semconv 이름을 적어 출처를 남긴다.
#
# 백엔드 어휘(vllm:*, mlx_runtime_*)를 canonical 이름으로 삼지 않는다. 런타임을
# 추가할 때 계약이 아니라 projection만 늘어야 한다.
version: 1

# 층은 측정 지점이면서 가용성을 결정하는 요인이다.
layers:
  client:
    description: benchmark client가 소켓에서 직접 관찰한다.
    observes: chunks
    availability: all_targets
    rationale: >-
      Gateway 측정 경로에는 runtime_backend 분기가 없다. 이 층의 값은 어느
      target에서도 같은 코드가 같은 방식으로 만들므로 target 간 직접 비교가 유효하다.
      client는 토큰 경계를 볼 수 없고 chunk 도착만 관찰한다. 토큰 단위 값은
      응답 usage에서 얻은 개수로 계산한 파생값이며 그렇게 표시한다.
  gateway:
    description: Gateway가 요청 이벤트와 metric으로 기록한다.
    observes: chunks
    availability: all_targets
    rationale: 위와 같은 이유로 target에 무관하다. 운영 진단 근거이며 SLO 기준이 아니다.
  runtime:
    description: 모델 런타임이 노출한다. 토큰 경계를 아는 유일한 층이다.
    observes: tokens
    availability: by_backend
    rationale: vLLM과 MLX-VLM이 서로 다른 지표를 내며 상당수가 한쪽에만 있다.
  infrastructure:
    description: DCGM·cAdvisor 등 별도 exporter가 노출한다.
    observes: resources
    availability: by_target
    rationale: >-
      exporter는 target의 compose 구성이 결정한다. linux-nvidia-static은
      monitoring stack 자체를 띄우지 않으므로 이 층과 runtime 층이 모두 비어 있다.

# gateway 층 값이 어디서 나오는지 적는다. Prometheus에 있는 것과 접근 로그에만 있는
# 것은 수집 방법이 다르다. 이름 모양으로 추측하면 한쪽을 조용히 건너뛴다 -- 실제로
# 수집기가 gateway 층 전체를 빠뜨리고 있었다.
source_kinds:
  prometheus: Prometheus가 scrape한 metric이다. 스냅샷 수집기가 읽는다.
  access_log: >-
    Gateway가 접근 로그에만 남긴다. 응답 헤더로 내보내면 내부 타이밍이 공개 API가
    되므로, 수집기가 request_id로 로그와 이어 붙인다.

# 지표마다 역할을 적는다. 역할이 없으면 workload나 SLO가 쓰지 않는 지표를 두고
# "잊은 것"인지 "의도한 것"인지 구분할 수 없다. 실제로 27개 중 12개에 소비처가
# 없었고, 그중 절반은 설계대로였지만 나머지를 가려내려면 매번 다시 따져야 했다.
roles:
  judgment: >-
    SLO 판정 근거가 될 수 있다. objective는 이 역할에서만 고른다.
  diagnosis: >-
    결과를 해석하는 데 쓴다. 판정 근거가 아니다. 소비처가 없어도 잊은 것이 아니다.
  reference: >-
    다른 층의 근사값이 맞는지 대조하는 정답지. approximation_of가 가리키는 쪽이다.

# 부하가 값을 바꾸는 지표인지 적는다. 측정으로 그은 선은 그 부하에서만 유효하다.
# 실측에서 요청률을 0.1에서 1.0 rps로 올리자 첫 응답이 0.67초에서 89.7초로 130배
# 벌어졌다. 같은 구간에서 토큰당 시간은 21ms 그대로였다 -- 큐 대기가 첫 chunk까지의
# 시간에 들어가고 생성 구간에는 들어가지 않기 때문이다.
#
# load_dependent인 지표의 regression_guard는 어느 부하에서 쟀는지를 match에
# 적어야 한다. 안 적으면 다른 부하의 실행에 그 선이 적용되어 대기열 길이를
# 모델 성능으로 판정하게 된다.

# judgment 지표는 판정 방향을 적는다. 지연은 낮을수록, 성공률과 처리량은 높을수록
# 좋다. 방향이 없으면 evaluator가 한쪽으로 가정하게 되고, 성공률 임계값이
# "이 값보다 낮아야 한다"로 뒤집혀도 아무도 모른다.
better_directions: [lower, higher]

# unsupported는 "값이 0"이 아니라 "이 조합에서는 측정할 수 없음"이다.
# 다른 지표로 대체하거나 0으로 채우지 않는다.
unsupported_marker: unsupported

metrics:
  # ---------------------------------------------------------------- client
  client_time_to_first_chunk_seconds:
    layer: client
    role: judgment
    load_dependent: true
    better: lower
    unit: seconds
    aggregation_unit: request
    otel: gen_ai.client.operation.time_to_first_chunk
    definition: >-
      요청 송신 시작부터 첫 응답 chunk 수신까지. 사용자 체감 지연의 기준값이다.
      "첫 토큰"이 아니라 "첫 chunk"인 이유는 client가 토큰 경계를 볼 수 없기
      때문이다. 토큰 기준 값이 필요하면 runtime 층을 본다.

  client_time_per_output_chunk_seconds:
    layer: client
    role: diagnosis
    load_dependent: false
    unit: seconds
    aggregation_unit: streamed_output_gap
    otel: gen_ai.client.operation.time_per_output_chunk
    definition: >-
      연속한 응답 chunk 사이 간격. client가 직접 관찰할 수 있는 값이다.
      다만 전송 계층이 여러 chunk를 한 TCP segment로 묶어 보내면 이 간격은 서버의
      생성 속도가 아니라 그 묶임을 잰다. macOS Metal target에서 실측했을 때 간격의
      69%가 1ms 미만이었고 p90이 65ms였다. 같은 구간의 실제 토큰당 시간은 19.3ms다.
      그래서 이 지표는 percentile로 판정하지 않는다. 아래 interpretable_statistics를
      넘어서는 통계를 쓰면 전송 패턴을 서버 성능으로 읽게 된다.
    # 합계는 생성 구간과 0.9ms 차이로 일치했다. 평균은 묶임에 영향받지 않는다.
    interpretable_statistics: [mean, sum]

  client_time_per_output_token_seconds:
    layer: client
    role: judgment
    load_dependent: false
    better: lower
    unit: seconds
    aggregation_unit: request
    definition: >-
      (operation_duration - time_to_first_chunk) / (output_tokens - 1).
      client가 토큰 경계를 못 보므로 응답 usage의 토큰 개수로 나눈 근사값이다.
      한 chunk가 여러 토큰을 나르면(speculative decoding) chunk 기준 값과
      갈라진다. 이 플랫폼의 macOS profile은 MTP를 기본으로 켠다.
    approximation_of: runtime_time_per_output_token_seconds
    requires:
      response_usage: true

  client_operation_duration_seconds:
    layer: client
    role: judgment
    load_dependent: true
    better: lower
    unit: seconds
    aggregation_unit: request
    otel: gen_ai.client.operation.duration
    definition: 요청 송신 시작부터 응답 완료까지.

  client_input_tokens:
    layer: client
    role: diagnosis
    unit: tokens
    aggregation_unit: request
    otel: gen_ai.client.token.usage
    definition: 응답 usage가 보고한 prompt token 수.

  client_output_tokens:
    layer: client
    role: diagnosis
    unit: tokens
    aggregation_unit: request
    otel: gen_ai.client.token.usage
    definition: 응답 usage가 보고한 completion token 수.

  client_output_tokens_per_second:
    layer: client
    role: judgment
    load_dependent: true
    better: higher
    unit: tokens_per_second
    aggregation_unit: window
    definition: >-
      측정 구간의 completion token 합 / dispatch_window_seconds. 분모는 부하를 가한
      구간이며 마지막 요청을 기다린 tail drain을 포함하지 않는다. 전체 벽시계로
      나누면 실측에서 1.0 rps가 0.71로 보였다.

  client_total_tokens_per_second:
    layer: client
    role: judgment
    load_dependent: true
    better: higher
    unit: tokens_per_second
    aggregation_unit: window
    definition: >-
      측정 구간의 prompt + completion token 합 / dispatch_window_seconds.
      분모는 client_output_tokens_per_second와 같다.

  client_request_success_ratio:
    layer: client
    role: judgment
    load_dependent: true
    better: higher
    unit: ratio
    aggregation_unit: window
    definition: 성공 요청 수 / 전체 요청 수.

  client_goodput_requests_per_second:
    layer: client
    role: judgment
    load_dependent: true
    better: higher
    unit: requests_per_second
    aggregation_unit: window
    definition: >-
      해당 workload의 모든 SLO를 만족한 요청만 센 초당 처리량. throughput과
      다르다. SLO를 넘긴 요청은 처리했어도 세지 않는다.
    requires:
      # 임계값이 없으면 "SLO를 만족한 요청"이 정의되지 않는다. 성공률로 대신하면
      # 정의가 다른 값이 같은 이름으로 나간다.
      slo_thresholds: true

  # --------------------------------------------------------------- gateway
  gateway_admission_wait_seconds:
    layer: gateway
    role: diagnosis
    unit: seconds
    aggregation_unit: request
    definition: >-
      Gateway가 upstream 동시성 slot을 기다린 시간. 요청 이벤트의 queue_wait_ms를
      초로 환산한 값이다. 런타임 scheduler 대기(runtime_queue_duration_seconds)와
      합치지 않는다.
    source: gateway_request_event.queue_wait_ms
    source_kind: access_log

  gateway_upstream_duration_seconds:
    layer: gateway
    role: diagnosis
    unit: seconds
    aggregation_unit: request
    definition: Gateway가 upstream 호출에 쓴 시간. admission 대기를 포함한다.
    source: upstream_request_duration_seconds
    source_kind: prometheus

  gateway_time_to_first_chunk_seconds:
    layer: gateway
    role: diagnosis
    unit: seconds
    aggregation_unit: request
    definition: >-
      Gateway가 첫 SSE chunk를 중계한 시점까지. 운영 진단 신호이며 SLO 기준이
      아니다. 헤더 이후 실패 시 첫 chunk가 오류 event일 수 있다.
    source: streaming_time_to_first_chunk_seconds
    source_kind: prometheus

  # --------------------------------------------------------------- runtime
  runtime_time_to_first_token_seconds:
    layer: runtime
    role: reference
    unit: seconds
    aggregation_unit: request
    otel: gen_ai.server.time_to_first_token
    definition: 런타임이 첫 토큰을 생성하기까지. 토큰 경계를 아는 유일한 측정 지점이다.
    backends:
      vllm-cuda: vllm:time_to_first_token_seconds
      mlx-vlm: unsupported

  runtime_time_per_output_token_seconds:
    layer: runtime
    role: reference
    unit: seconds
    aggregation_unit: request
    otel: gen_ai.server.time_per_output_token
    definition: 첫 토큰 이후 토큰당 생성 시간.
    backends:
      vllm-cuda: vllm:inter_token_latency_seconds
      mlx-vlm: unsupported

  runtime_request_duration_seconds:
    layer: runtime
    role: diagnosis
    unit: seconds
    aggregation_unit: request
    otel: gen_ai.server.request.duration
    definition: 런타임이 요청 하나를 처리한 전체 시간.
    backends:
      vllm-cuda: vllm:e2e_request_latency_seconds
      mlx-vlm: unsupported

  runtime_queue_duration_seconds:
    layer: runtime
    role: diagnosis
    unit: seconds
    aggregation_unit: request
    definition: 런타임 scheduler가 요청을 집기 전 대기 시간.
    backends:
      vllm-cuda: vllm:request_queue_time_seconds
      mlx-vlm: unsupported

  runtime_prefill_duration_seconds:
    layer: runtime
    role: diagnosis
    unit: seconds
    aggregation_unit: request
    definition: prefill 단계 처리 시간.
    backends:
      vllm-cuda: vllm:request_prefill_time_seconds
      mlx-vlm: unsupported

  runtime_decode_duration_seconds:
    layer: runtime
    role: diagnosis
    unit: seconds
    aggregation_unit: request
    definition: decode 단계 처리 시간.
    backends:
      vllm-cuda: vllm:request_decode_time_seconds
      mlx-vlm: unsupported

  runtime_requests_waiting:
    layer: runtime
    role: diagnosis
    unit: count
    aggregation_unit: instant
    definition: 실행 대기 중인 요청 수.
    backends:
      vllm-cuda: vllm_queue_depth
      mlx-vlm: mlx_runtime_request_queue_depth

  runtime_requests_running:
    layer: runtime
    role: diagnosis
    unit: count
    aggregation_unit: instant
    definition: 현재 실행 중인 요청 수.
    backends:
      vllm-cuda: vllm:num_requests_running
      mlx-vlm: mlx_runtime_in_flight

  runtime_kv_cache_usage_ratio:
    layer: runtime
    role: diagnosis
    unit: ratio
    aggregation_unit: instant
    definition: KV cache 사용 비율. 1이 100%다.
    backends:
      vllm-cuda: vllm_kv_cache_usage_ratio
      mlx-vlm: unsupported

  runtime_input_tokens_total:
    layer: runtime
    role: diagnosis
    unit: tokens
    aggregation_unit: counter
    definition: 런타임 기동 이후 처리한 prompt token 누계.
    backends:
      vllm-cuda: vllm:prompt_tokens_total
      mlx-vlm: mlx_runtime_prompt_tokens_total

  runtime_output_tokens_total:
    layer: runtime
    role: diagnosis
    unit: tokens
    aggregation_unit: counter
    definition: 런타임 기동 이후 생성한 token 누계.
    backends:
      vllm-cuda: vllm:generation_tokens_total
      mlx-vlm: mlx_runtime_generated_tokens_total

  # -------------------------------------------------------- infrastructure
  gpu_memory_used_bytes:
    layer: infrastructure
    role: diagnosis
    unit: bytes
    aggregation_unit: instant
    definition: GPU 메모리 사용량.
    targets:
      linux-nvidia-dynamic: gpu_memory_used_bytes
      linux-nvidia-static: unsupported
      macos-metal-static: unsupported

  gpu_memory_headroom_bytes:
    layer: infrastructure
    role: diagnosis
    unit: bytes
    aggregation_unit: instant
    definition: 추가 런타임을 올릴 수 있는 GPU 여유 메모리.
    targets:
      linux-nvidia-dynamic: gpu_memory_headroom_bytes
      linux-nvidia-static: unsupported
      macos-metal-static: unsupported

  gpu_utilization_ratio:
    layer: infrastructure
    role: diagnosis
    unit: ratio
    aggregation_unit: instant
    definition: GPU 연산 사용률.
    targets:
      linux-nvidia-dynamic: gpu_utilization_ratio
      linux-nvidia-static: unsupported
      macos-metal-static: unsupported

# 측정하지 않고 계산하는 값. evaluator가 만든다.
derived:
  client_output_tokens_per_second_per_gpu:
    from: [client_output_tokens_per_second]
    requires_fingerprint: [gpu_count]
    definition: >-
      client_output_tokens_per_second / gpu_count. 통합 메모리 가속기
      (memory_kind: unified)에서는 계산하지 않는다. GPU가 없어서가 아니라 개수가
      항상 1이라 총 처리량과 같은 값이 나와 비교에 아무것도 더하지 않기 때문이다.

  client_total_tokens_per_second_per_gpu:
    from: [client_total_tokens_per_second]
    requires_fingerprint: [gpu_count]
    definition: client_total_tokens_per_second / gpu_count.
