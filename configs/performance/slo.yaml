# 성능 SLO를 단독으로 소유한다(ADR-0026 1·10절).
#
# SLO는 서비스가 제공하려는 품질 목표다. 특정 장비에서 관찰한 baseline이 아니다.
# 관찰값에 여유율을 곱해 만들지 않는다.
#
# 그래서 이 파일은 지금 임계값을 갖지 않는다. 제품 계약이 정해지지 않은 상태에서
# 숫자를 박으면 그 숫자가 곧 제품 계약이 되어버린다. 구조와 enforcement 단계만
# 먼저 고정하고, 임계값은 objectives에 source와 함께 채운다.
version: 1

# 새 SLO는 observe에서 시작한다. 충분한 근거가 모인 뒤 승격한다.
enforcement_levels:
  observe: 판정만 기록하고 아무것도 실패시키지 않는다.
  warn: 경고를 남기되 실행은 성공으로 끝낸다.
  release: 릴리스 자격 검사를 실패시킨다.
  required: 필수 게이트. 통과하지 못하면 진행하지 않는다.

# 임계값이 어디서 왔는지 모르면 6개월 뒤 아무도 바꾸지 못한다. 셋 중 하나를
# 반드시 적는다. baseline은 출처가 될 수 없다.
threshold_sources:
  product_requirement: 사용자에게 약속하는 품질. 서비스 소유자가 정한다.
  declared_limit: >-
    이미 선언된 timeout 같은 한도에서 유도한다. 한도보다 큰 임계값은 요청이 먼저
    끊기므로 의미가 없다.
  regression_guard: >-
    확인된 정상 범위와 실패 모드 사이에 긋는 선. 고쳤던 결함이 되살아나는 것과,
    설정 변화로 성능이 눈에 띄게 나빠지는 것을 잡는다. 목표가 아니라 경보선이며,
    이 선을 통과한다고 해서 제품이 약속한 품질을 만족한다는 뜻은 아니다.
    관찰값에 여유율을 곱해 만드는 것과는 다르다. 여유율은 임의의 배수지만 이 선은
    "정상이면 여기까지, 고장이면 저쪽" 사이의 빈 구간에 놓는다. 그 구간이 비어
    있지 않으면(정상과 고장이 겹치면) 이 유형을 쓸 수 없다.
    scripts/validation/runtime/live_checks.py의 risk detector 지연 예산이 이 유형이다.

# 판정에 쓰는 통계의 계산 방법을 계약이 소유한다. 같은 원시 샘플로 도구마다 다른
# percentile이 나오면 판정이 도구에 달린다.
statistics:
  # p번째 백분위는 정렬 후 ceil(p x n)번째 값이다. 보간하지 않는다.
  # "요청의 95%가 이 값보다 빠르다"는 SLO 문장이 그대로 성립한다.
  percentile_method: nearest_rank
  # p번째 백분위를 구분하려면 최소 1/(1-p)개의 표본이 필요하다. 20개로 p99를 계산하면
  # 사실상 최댓값이고, 그 값을 임계값과 비교하면 표본 수가 판정을 좌우한다.
  # 못 채우면 숫자를 내지 않고 not_evaluated로 남긴다.
  minimum_samples:
    p50: 10
    p95: 20
    p99: 100

# workload마다 목표가 다르다. 모든 profile에 같은 지표를 강제하지 않는다.
slo_classes:
  interactive:
    workload: interactive
    enforcement: observe
    intent: 첫 응답이 빨라야 한다. 처리량을 조금 잃어도 된다.
    objectives:
      client_time_to_first_chunk_seconds:
        percentiles: [p50, p95, p99]
      # chunk 간격이 아니라 요청별 토큰 기준 근사값으로 판정한다. chunk 간격의
      # percentile은 전송 계층의 묶임을 재기 때문이다(metrics.yaml 참고).
      # 이 지표는 요청 하나에 값 하나이므로 요청 간 percentile이 성립한다.
      # 토큰당 시간은 이 배포에서 부하와 무관했다. 0.15/0.25/0.35/0.50 rps 네 지점의
      # p50이 21.0·21.1·21.3·21.2ms로 편차가 2% 미만이다. 큐 대기는 첫 chunk까지의
      # 시간에 들어가고 이 값에는 들어가지 않기 때문이다. 그래서 이 값은 장비의
      # 혼잡도가 아니라 모델과 런타임의 성질이고, 측정으로 선을 그을 수 있다.
      #
      # 30ms는 정상(21ms)보다 40% 위이고 관찰된 편차의 15배 밖이다. 목표가 아니라
      # 경보선이다. 이 값을 바꾸는 것은 모델·양자화·투기적 디코딩 설정이지
      # 그날의 트래픽이 아니다.
      #
      # target마다 모델이 다르므로 숫자도 다르다. 한 숫자를 모두에 걸면 한쪽에서는
      # 반드시 틀린다. 측정하지 않은 target은 비워 두고 not_evaluated로 남긴다.
      client_time_per_output_token_seconds:
        percentiles: [p95]
        source: regression_guard
        thresholds_by_target:
          # mlx-community/gemma-4-26B-A4B-it-qat-4bit, MTP 투기적 디코딩 on
          macos-metal-static: 0.030
      client_request_success_ratio:
        aggregate: min
      client_goodput_requests_per_second:
        aggregate: min
      # 이 플랫폼의 smoke와 readiness 확인이 REQUEST_TIMEOUT_SECONDS에서 요청을
      # 포기한다(configs/model_serving.yaml의 timeouts.gateway_request_seconds=125).
      # 즉 그보다 오래 걸린 요청은 플랫폼 스스로 실패로 취급한다. 그 선을 넘긴
      # 임계값은 의미가 없으므로 한도 자체를 천장으로 삼는다.
      #
      # 목표가 아니라 천장이다. "이 정도면 빠르다"가 아니라 "여기를 넘으면 이미
      # 실패로 세고 있다"는 뜻이다. 실측 최댓값은 포화 상태에서 96초였다.
      client_operation_duration_seconds:
        percentiles: [p99]
        threshold: 125
        source: declared_limit

  batch:
    workload: batch
    enforcement: observe
    intent: 지속 처리량이 목표다. 첫 응답 속도는 판정 기준이 아니다.
    objectives:
      client_output_tokens_per_second:
        aggregate: min
      client_request_success_ratio:
        aggregate: min

  long_context:
    workload: long_context
    enforcement: observe
    intent: 긴 입력에서 실패하지 않고 첫 응답이 허용 범위 안에 들어와야 한다.
    objectives:
      client_time_to_first_chunk_seconds:
        percentiles: [p95]
      client_request_success_ratio:
        aggregate: min

  agentic:
    workload: agentic
    enforcement: observe
    intent: 다중 turn session이 cache 재사용으로 이득을 보는지 확인한다.
    objectives:
      client_time_to_first_chunk_seconds:
        percentiles: [p95]
      client_request_success_ratio:
        aggregate: min
