# `.env*.example`에 빠지면 안 되는 키 목록이다.
# 실제 실행값의 필수 여부와 유효성은 settings·compose preflight·auth 진단이 판단한다.
common_example_keys:
  - APP_ENV
  - LOG_LEVEL
  - GATEWAY_HOST
  - GATEWAY_PORT
  - GATEWAY_BIND_ADDR
  - AUTH_MODE
  - EXPOSURE_MODE
  - COMPOSE_PROJECT_NAME

# 인증 프로필을 선택하거나 설명하는 예시에 포함할 키.
auth_mode_keys:
  - API_KEY_REQUIRED
  - ADMIN_API_KEY_REQUIRED
  - ADMIN_ENDPOINTS_INTERNAL_ONLY
  - INTERNAL_SERVICE_AUTH_REQUIRED

# internal_trusted/custom에서만 조건부로 필요한 증빙 키.
auth_evidence_keys:
  - INTERNAL_TRUSTED_AUTH_EVIDENCE
  - CUSTOM_AUTH_RISK_ACCEPTED
  - CUSTOM_AUTH_RISK_TICKET

# runtime별 override를 예시 파일에서 빠뜨리지 않기 위한 키 조합.
runtime_override_example_keys:
  main_llm:
    env_prefix: MAIN_LLM
    suffixes:
      - BASE_URL
      - MODEL
      - TIMEOUT_SECONDS
      - MAX_CONCURRENCY
      - QUEUE_TIMEOUT_SECONDS
      - BOOT_PROFILE
      - PROFILE_LOCKED
  embedding:
    env_prefix: EMBEDDING
    suffixes:
      - BASE_URL
      - MODEL
      - TIMEOUT_SECONDS
      - MAX_CONCURRENCY
      - QUEUE_TIMEOUT_SECONDS
  embedding_ko:
    env_prefix: EMBEDDING_KO
    suffixes:
      - BASE_URL
      - MODEL
      - TIMEOUT_SECONDS
      - MAX_CONCURRENCY
      - QUEUE_TIMEOUT_SECONDS
  risk_prompt:
    env_prefix: RISK_PROMPT
    suffixes:
      - BASE_URL
      - MODEL
      - TIMEOUT_SECONDS
      - MAX_CONCURRENCY
      - QUEUE_TIMEOUT_SECONDS

# master_open 예시에 필요한 host bind 키.
exposure_mode_requirements:
  master_open:
    - EXPOSURE_AUDIENCE
    - GRAFANA_BIND_ADDR
    - PROMETHEUS_BIND_ADDR
    - RISK_ADAPTER_BIND_ADDR
    - DCGM_EXPORTER_BIND_ADDR
    - CADVISOR_BIND_ADDR
    - MAIN_LLM_VLLM_BIND_ADDR
    - EMBEDDING_VLLM_BIND_ADDR
    - EMBEDDING_KO_VLLM_BIND_ADDR
    - RISK_PROMPT_VLLM_BIND_ADDR

# env_examples: which example files must contain which key sets.
env_examples:
  .env.example:
    required_key_sets:
      - common_example_keys
      - auth_mode_keys
      - auth_evidence_keys
      - runtime_override_example_keys
  .env.local.example:
    required_key_sets:
      - runtime_override_example_keys
  .env.compose.example:
    required_key_sets:
      - common_example_keys
      - auth_mode_keys
      - auth_evidence_keys
      - runtime_override_example_keys
      - exposure_mode_requirements.master_open

# ── sync-env가 기존 .env에서 제거하는 키 ────────────────────────────────
# `make sync-env`(scripts/config/setup_env.py)가 기존 .env에서 지우는 키이자,
# 위 예시 파일에 다시 등장하면 안 되는 키다. 값은 지우는 이유다.
#
# 제거 기준을 "템플릿에 없는 키"로 삼지 않는 것이 ADR-0013의 핵심이다 -- 배포
# 서버 .env에는 템플릿에 존재한 적 없는 서버 전용 설정(MAIN_MODEL_STATE_PATH 등)이
# 정상적으로 들어있고, 배포 스크립트가 이미지 참조 갱신 직후 sync-env를 호출하기
# 때문에 그 기준을 쓰면 배포할 때마다 운영 설정이 사라진다. 그래서 지울 키는
# 여기에 명시적으로 등록한다.
removed_keys:
  MAX_REQUEST_BODY_BYTES: >-
    configs/model_serving.yaml(operational_limits.max_request_body_bytes)이 소유한다.
    .env 템플릿에 중복 정의돼 yaml 값을 가리고, 배포된 .env가 릴리스마다 1.25MB로
    고정되는 문제가 있었다. settings.py는 명시적 env override는 계속 존중한다.
  HTTP_MAX_CONNECTIONS: >-
    configs/model_serving.yaml(operational_limits.http_client.max_connections)이 소유한다.
  HTTP_MAX_KEEPALIVE_CONNECTIONS: >-
    configs/model_serving.yaml(operational_limits.http_client.max_keepalive_connections)이 소유한다.
  PROMTAIL_IMAGE: >-
    Promtail이 Grafana Alloy로 교체됐다. 읽는 코드도 compose 참조도 남아있지 않은데
    기존 .env에는 계속 남아, 실제 로그 수집기와 무관한 이미지 태그를 보여준다.
  RISK_VLLM_BASE_IMAGE: >-
    base image는 configs/vllm_unified_build.yaml의 canonical digest 하나가 소유한다.
    영속 파일에 두면 값이 낡아도 아무도 모른다 -- 실제로 배포 .env에 부팅 실패로
    폐기된 base 태그가 남아 있었다. 필요하면 그 빌드 한 번에만 환경변수로 준다.
  VLLM_BASE_IMAGE: RISK_VLLM_BASE_IMAGE와 같은 이유.
