# `.env*.example`에 빠지면 안 되는 키 목록이다.
# 실제 실행값의 필수 여부와 유효성은 settings·compose preflight·auth 진단이 판단한다.
common_example_keys:
  - APP_ENV
  - ACCESS_PROFILE
  - DEPLOYMENT_TARGET
  - LOG_LEVEL
  - GATEWAY_HOST
  - GATEWAY_PORT
  - GATEWAY_BIND_ADDR
  - AUTH_MODE
  - EXPOSURE_MODE
  - COMPOSE_PROJECT_NAME

auth_mode_keys:
  - API_KEY_REQUIRED
  - ADMIN_API_KEY_REQUIRED
  - ADMIN_ENDPOINTS_INTERNAL_ONLY
  - INTERNAL_SERVICE_AUTH_REQUIRED

auth_evidence_keys:
  - INTERNAL_TRUSTED_AUTH_EVIDENCE
  - CUSTOM_AUTH_RISK_ACCEPTED
  - CUSTOM_AUTH_RISK_TICKET

runtime_override_example_keys:
  main_llm:
    env_prefix: MAIN_MODEL
    suffixes: [BASE_URL, ALIAS, TIMEOUT_SECONDS, MAX_CONCURRENCY, QUEUE_TIMEOUT_SECONDS, CIRCUIT_BREAKER_FAILURE_THRESHOLD, CIRCUIT_BREAKER_RESET_SECONDS, BOOT_PROFILE, PROFILE_LOCKED, STATIC_PROFILE, GPU_MEMORY_UTILIZATION, SWITCH_IDEMPOTENCY_TTL_SECONDS]
  embedding:
    env_prefix: EMBEDDING
    suffixes: [BASE_URL, MODEL, TIMEOUT_SECONDS, MAX_CONCURRENCY, QUEUE_TIMEOUT_SECONDS]
  embedding_ko:
    env_prefix: EMBEDDING_KO
    suffixes: [BASE_URL, MODEL, TIMEOUT_SECONDS, MAX_CONCURRENCY, QUEUE_TIMEOUT_SECONDS]
  risk_prompt:
    env_prefix: RISK_PROMPT
    suffixes: [BASE_URL, MODEL, TIMEOUT_SECONDS, MAX_CONCURRENCY, QUEUE_TIMEOUT_SECONDS]

exposure_mode_requirements:
  master_open:
    - EXPOSURE_AUDIENCE
    - GRAFANA_BIND_ADDR
    - PROMETHEUS_BIND_ADDR
    - RISK_SIGNAL_SERVICE_BIND_ADDR
    - DCGM_EXPORTER_BIND_ADDR
    - CADVISOR_BIND_ADDR
    - MAIN_MODEL_VLLM_BIND_ADDR
    - EMBEDDING_VLLM_BIND_ADDR
    - EMBEDDING_KO_VLLM_BIND_ADDR
    - RISK_PROMPT_VLLM_BIND_ADDR

env_examples:
  .env.local.example:
    required_key_sets: [runtime_override_example_keys]
  .env.compose.example:
    required_key_sets: [common_example_keys, auth_mode_keys, auth_evidence_keys, runtime_override_example_keys, exposure_mode_requirements.master_open]

auth_example_profiles:
  .env.local.example: local_open
  .env.compose.example: local_open

access_example_profiles:
  .env.compose.example: local

service_env_projections:
  static_gateway:
    deployment_targets: [linux-nvidia-static, macos-metal-static]
    required_source_keys: [APP_ENV, MAIN_MODEL_BASE_URL, MAIN_MODEL_STATIC_PROFILE]
    runtime_keys:
      - DEPLOYMENT_TARGET
      - APP_ENV
      - AUTH_MODE
      - EXPOSURE_MODE
      - EXPOSURE_AUDIENCE
      - API_KEY_REQUIRED
      - API_KEYS
      - ADMIN_API_KEY_REQUIRED
      - ADMIN_API_KEY
      - ADMIN_API_KEYS
      - ADMIN_ENDPOINTS_INTERNAL_ONLY
      - INTERNAL_SERVICE_AUTH_REQUIRED
      - STRICT_ADMIN_ENDPOINT_SECURITY
      - FASTAPI_DOCS_ENABLED
      - FASTAPI_DOCS_URL
      - FASTAPI_REDOC_URL
      - OPENAPI_URL
      - CORS_ALLOWED_ORIGINS
      - VLLM_TIMEOUT_SECONDS
      - REQUEST_TIMEOUT_SECONDS
      - MAIN_MODEL_BASE_URL
      - MAIN_MODEL_ALIAS
      - MAIN_MODEL_TIMEOUT_SECONDS
      - MAIN_MODEL_MAX_CONCURRENCY
      - MAIN_MODEL_QUEUE_TIMEOUT_SECONDS
      - MAIN_MODEL_CIRCUIT_BREAKER_FAILURE_THRESHOLD
      - MAIN_MODEL_CIRCUIT_BREAKER_RESET_SECONDS
      - MAIN_MODEL_STATIC_PROFILE
      - DEPLOY_RELEASE_ID
      - LOG_REQUEST_RESPONSE_BODY

renamed_keys:
  ADMIN_SIDECAR_URL: RUNTIME_CONTROLLER_URL
  AUDIO_VLLM_IMAGE: MAIN_MODEL_VLLM_IMAGE_OVERRIDE
  MAIN_LLM_BASE_URL: MAIN_MODEL_BASE_URL
  MAIN_LLM_MODEL: MAIN_MODEL_ALIAS
  MAIN_LLM_TIMEOUT_SECONDS: MAIN_MODEL_TIMEOUT_SECONDS
  MAIN_LLM_MAX_CONCURRENCY: MAIN_MODEL_MAX_CONCURRENCY
  MAIN_LLM_QUEUE_TIMEOUT_SECONDS: MAIN_MODEL_QUEUE_TIMEOUT_SECONDS
  MAIN_LLM_CIRCUIT_BREAKER_FAILURE_THRESHOLD: MAIN_MODEL_CIRCUIT_BREAKER_FAILURE_THRESHOLD
  MAIN_LLM_CIRCUIT_BREAKER_RESET_SECONDS: MAIN_MODEL_CIRCUIT_BREAKER_RESET_SECONDS
  MAIN_LLM_BOOT_PROFILE: MAIN_MODEL_BOOT_PROFILE
  MAIN_LLM_PROFILE_LOCKED: MAIN_MODEL_PROFILE_LOCKED
  MAIN_LLM_STATIC_PROFILE: MAIN_MODEL_STATIC_PROFILE
  MAIN_LLM_GPU_MEMORY_UTILIZATION: MAIN_MODEL_GPU_MEMORY_UTILIZATION
  MAIN_LLM_SWITCH_IDEMPOTENCY_TTL_SECONDS: MAIN_MODEL_SWITCH_IDEMPOTENCY_TTL_SECONDS
  MAIN_LLM_VLLM_BIND_ADDR: MAIN_MODEL_VLLM_BIND_ADDR
  MAIN_LLM_VLLM_PORT: MAIN_MODEL_VLLM_PORT
  RISK_ADAPTER_HOST: RISK_SIGNAL_SERVICE_HOST
  RISK_ADAPTER_PORT: RISK_SIGNAL_SERVICE_PORT
  RISK_ADAPTER_BIND_ADDR: RISK_SIGNAL_SERVICE_BIND_ADDR

removed_keys:
  PACKAGE_NAME: release ZIP 이름을 바꾸는 process override다.
  PYTHON_VERSION: 실행 중인 코드와 image build가 소비하지 않는다.
  PROJECT_VERSION: VERSION 파일이 소유한다.
  MAX_REQUEST_BODY_BYTES: configs/model_serving.yaml이 소유한다.
  HTTP_MAX_CONNECTIONS: configs/model_serving.yaml이 소유한다.
  HTTP_MAX_KEEPALIVE_CONNECTIONS: configs/model_serving.yaml이 소유한다.
  PROMTAIL_IMAGE: Promtail이 Grafana Alloy로 교체됐다.
  RISK_VLLM_BASE_IMAGE: Unified vLLM 통합 전의 legacy override다.
  VLLM_BASE_IMAGE: canonical base digest는 configs/vllm_unified_build.yaml이 소유한다.
  EMBEDDING_KO_VLLM_IMAGE: shared vLLM runtime artifact의 persistent authority는 VLLM_IMAGE다.
  RISK_VLLM_IMAGE: shared vLLM runtime artifact의 persistent authority는 VLLM_IMAGE다.
