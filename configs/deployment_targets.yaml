version: 1
default_target: linux-nvidia-dynamic

targets:
  linux-nvidia-dynamic:
    display_name: Linux NVIDIA Dynamic
    platform: linux
    runtime_backend: vllm-cuda
    main_profile_catalog: configs/main_model_profiles.yaml
    # compose_files는 static target만 선언한다. dynamic 진입점(compose_up.sh)은
    # EXPOSURE_MODE override와 boot override를 실행 시점에 조합하므로 파일 집합의
    # 소유자가 여기가 아니다. 읽는 곳이 없는 값을 두지 않는다.
    #
    # exposure profile의 host_published가 실제 공개 집합을 결정한다.
    exposure_profile_applies: true
    control_mode: sidecar
    lifecycle_owner: platform
    # Gateway가 Sidecar/Risk Adapter 같은 내부 서비스에 인증 호출을 수행한다.
    # 이 값은 auth profile의 정책과 별개로, 해당 target에 token 소비면이 실제로
    # 존재하는지를 선언한다.
    internal_service_token_required: true
    validation_status: verified
    features:
      chat: true
      embeddings: true
      retrieval: true
      risk: true
      runtime_control: true
      model_switching: true
      gpu_admission: true

  linux-nvidia-static:
    display_name: Linux NVIDIA Static Main
    platform: linux
    runtime_backend: vllm-cuda
    main_profile_catalog: configs/main_model_profiles.yaml
    compose_files:
      - ops/compose/static-main.external-runtime.yaml
    # static 진입점은 exposure override를 적용하지 않는다. 공개 집합은 위 Compose
    # 파일이 고정하므로 exposure profile을 실제 공개 기준으로 읽으면 안 된다.
    exposure_profile_applies: false
    control_mode: static
    lifecycle_owner: external
    # external Main runtime만 사용한다. Sidecar/Risk Adapter/Gateway internal control
    # 호출면이 없으므로 INTERNAL_SERVICE_TOKEN을 Gateway에 주입하지 않는다.
    internal_service_token_required: false
    # Gateway static serving 경로는 구현·실측됐지만 장시간/장문맥 qualification은 남아 있다.
    validation_status: implemented
    features:
      chat: true
      embeddings: false
      retrieval: false
      risk: false
      runtime_control: false
      model_switching: false
      gpu_admission: false

  macos-metal-static:
    display_name: macOS Metal Static Main
    platform: macos
    runtime_backend: mlx-vlm
    main_profile_catalog: configs/macos_mlx_runtime.yaml
    compose_files:
      - ops/compose/static-main.external-runtime.yaml
      - ops/compose/overrides/static.macos-metal.yaml
    exposure_profile_applies: false
    control_mode: static
    lifecycle_owner: external
    internal_service_token_required: false
    # Native runtime에 Docker Gateway가 접근할 host다. port는 별도로 복제하지 않고
    # configs/macos_mlx_runtime.yaml의 runtime.port에서 투영한다.
    gateway_runtime_host: host.docker.internal
    # Gateway/Compose/native runtime과 M5 32GB의 text/image/reasoning, 24K input,
    # 최대 8 images 및 8K generation 경계를 고정 runtime 조합으로 확인했다.
    validation_status: verified
    features:
      chat: true
      embeddings: false
      retrieval: false
      risk: false
      runtime_control: false
      model_switching: false
      gpu_admission: false
