# Full 배포에서 DEPLOY_RUNTIME_PROFILE로 선택한다.
# deferred_runtimes의 런타임은 컨테이너를 만들되 초기 상태를 stopped로 기록한다.
profiles:
  # Chat만 즉시 제공하고 embedding·prompt risk는 필요할 때 Admin API로 시작한다.
  main_only:
    deferred_runtimes:
      - embedding
      - embedding_ko
      - risk_prompt

  # Retrieval은 즉시 제공하고 prompt risk만 필요할 때 시작한다.
  retrieval_ready:
    deferred_runtimes:
      - risk_prompt
