# macOS Metal Main runtime와 Gateway serving 계약의 단일 기준이다.
# Linux/CUDA lifecycle catalog(configs/main_model_profiles.yaml)와 섞지 않는다.
version: 1
public_model: local-main
default_profile: gemma4-26b-a4b-qat-4bit-mlx

runtime:
  python: 3.13.12
  # Python dependency 선언과 lock은 실행 설정이 아니라 독립 MLX project가 소유한다.
  project: runtimes/mlx
  environment: .runtime/metal/venv
  host: 127.0.0.1
  port: 9401
  health_path: /health
  # port + metrics_path는 mlx_metrics_exporter가 native runtime에서 JSON metric을
  # 읽어올 upstream URL을 만들 때 사용한다. 컨테이너에서 host를 어떻게 부르는지는
  # 배치 문제라 compose(MLX_RUNTIME_METRICS_HOST)가 소유한다.
  metrics_path: /metrics
  # 24,576 input + 기본·최대 8,192 generation의 Normal 예산이다. 24,576은
  # qualification 기준이지 별도 hard cap이 아니다. runtime은 실제 전처리 뒤
  # prompt + effective max_tokens <= 32,768을 검사하므로 출력 요청을 줄이면 입력을
  # 더 쓸 수 있다. max_tokens 생략 시 --max-tokens에 투영된 8,192를 사용한다.
  # thinking token도 generation 예산 안에서 소비하며 별도 hard budget은 두지 않는다.
  max_kv_size: &metal_context_limit 32768
  max_generation_tokens: &metal_generation_limit 8192
  max_concurrency: 1
  vision_cache_size: 4
  thinking:
    enabled_by_default: true
    hard_budget: null
  speculative_decoding:
    enabled: true
    kind: mtp
    block_size: 4
  turboquant:
    enabled: false

profiles:
  gemma4-26b-a4b-qat-4bit-mlx:
    display_name: Gemma 4 26B A4B QAT 4-bit (MLX)
    model_id: mlx-community/gemma-4-26B-A4B-it-qat-4bit
    revision: 0e3cbab38ce568cf6e23543010d08d03b731910c
    served_model_name: local-main
    assistant:
      model_id: mlx-community/gemma-4-26B-A4B-it-qat-assistant-4bit
      revision: bb94eae1b70a80dac16cbf959bb4b7d56bd1fb8c
    compatibility:
      # M5 32GB에서 text/image/reasoning, 24K input, 최대 8 images와 8K generation
      # 경계를 target/assistant revision 및 MLX-VLM/MTP 고정 조합으로 확인했다.
      status: verified
    capabilities:
      deployed_input: [text, image]
    qualification:
      normal:
        input_tokens: 24576
        generation_tokens: *metal_generation_limit
        images_min: 1
        images_max: 4
      extended:
        images_min: 5
        images_max: 8
    gateway_policy:
      max_concurrency: 1
      max_output_tokens: *metal_generation_limit
      request_limits:
        max_model_len: *metal_context_limit
        input_modalities: [text, image]
        # Normal 권장 범위는 1~4장이지만 5~8장 extended qualification 요청을
        # Gateway가 선제 차단하지 않도록 capability hard limit은 8로 둔다.
        max_image_inputs: 8
        allowed_image_url_schemes: [data]
        max_image_bytes: 25000000
        max_image_pixels: 12845056
        allowed_image_mime_types: [image/jpeg, image/png, image/webp, image/avif, image/jp2, image/gif, image/bmp, image/tiff, image/x-tiff]
      request_parameter_policy:
        allow_unlisted_parameters: false
        # 이 목록은 mlx-vlm server가 파싱할 수 있는 모든 필드가 아니라 이 모델·이
        # 실행 모드에서 확인한 공개 계약이다. 고정된 mlx-vlm 0.6.17은 draft model을
        # 쓰는 speculative decoding과 response_format을 함께 요청하면 명시적으로
        # 거부하므로 MTP를 켠 기본 profile에서는 structured output을 광고하지 않는다.
        # Gemma4 tool parser도 package에는 있지만 target checkpoint의 tool round-trip을
        # qualification하기 전까지 tools/tool_choice를 열지 않는다.
        # stream_options는 생성 동작을 바꾸지 않고 서버가 마지막에 usage 객체를
        # 덧붙일지만 정한다. 고정 mlx-vlm 0.6.17에서 include_usage=true 요청이
        # usage를 실제로 싣는 것을 native runtime에 직접 확인했다. 이것이 없으면
        # streaming 요청의 토큰 수가 요청 로그에 영원히 비어, 같은 request_id로
        # 두 경로를 조회한다는 계약이 Linux에서만 성립한다.
        supported_parameters: [stream, stream_options, temperature, max_tokens, top_p, top_k, min_p, repetition_penalty, reasoning, user]
        drop_upstream_parameters: [user]
        max_n: 1
        reasoning:
          enabled: true
          default: true
          mode: default_on
          upstream_parameter: enable_thinking
