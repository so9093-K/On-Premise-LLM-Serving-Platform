images:
  platform:
    env_key: PLATFORM_IMAGE
    reference_policy: local_build
    default: ai-model-serving-platform:0.0.1
    purpose: 이 저장소에서 빌드하는 Gateway와 Risk Signal Service 애플리케이션 이미지.
    source: 로컬 Docker 빌드
  vllm:
    env_key: VLLM_IMAGE
    reference_policy: local_build
    default: ai-model-serving-vllm-unified:0.0.1
    purpose: 선택 가능한 Main LLM profile과 embedding, embedding-ko, risk-prompt를 위한
      vLLM OpenAI 호환 runtime. 하나의 이미지에 두 patch 집합을 포함하며, 필요 없는 모델에서는
      해당 patch가 동작하지 않는다. 2026-07-24에 기존 vllm-gemma4-audio와 risk-vllm-kanana
      이미지를 통합했다.
    source: ops/images/vllm-unified/Dockerfile을 사용하는 로컬 Docker 빌드
  dcgm_exporter:
    env_key: DCGM_EXPORTER_IMAGE
    reference_policy: immutable_upstream
    default: nvcr.io/nvidia/k8s/dcgm-exporter:4.5.2-4.8.1-distroless@sha256:ed594cf53fe6942e84b07b0740cdcbb249fa4b39cb21feeebf93881ae51f0b5e
    purpose: Prometheus용 NVIDIA GPU metric exporter.
    source: NVIDIA dcgm-exporter 4.5.2-4.8.1 distroless multi-arch manifest
  prometheus:
    env_key: PROMETHEUS_IMAGE
    reference_policy: immutable_upstream
    default: prom/prometheus:v3-distroless@sha256:50c707e96da5ade383cb1707790576480485e93de06aa60ad8802cb5f744bd0a
    purpose: 최소 distroless image variant를 사용하는 Prometheus metrics server.
    source: Docker Hub prom/prometheus v3 distroless multi-arch manifest
  grafana:
    env_key: GRAFANA_IMAGE
    reference_policy: immutable_upstream
    default: grafana/grafana:12.2.8@sha256:4fd3611a33dff4ee61e9f319f00ce050d59108c90f5b643f28871728b4542caf
    purpose: nightly/main tag 대신 안정적인 12.2.8 manifest에 고정한 Grafana dashboard UI.
    source: Grafana 12.2.8 multi-arch manifest
  cadvisor:
    env_key: CADVISOR_IMAGE
    reference_policy: immutable_upstream
    default: gcr.io/cadvisor/cadvisor:v0.49.2@sha256:aea169b3b211216d9d61c33455ec3a85d2b6f63d8889b1ebf41b97163cffbbc5
    purpose: container별 CPU와 system RAM metric을 제공하는 resource advisor.
    source: Google cAdvisor v0.49.2 multi-arch manifest
  loki:
    env_key: LOKI_IMAGE
    reference_policy: immutable_upstream
    default: grafana/loki:3.3.2@sha256:8af2de1abbdd7aa92b27c9bcc96f0f4140c9096b507c77921ffddf1c6ad6c48f
    purpose: Grafana request-log-explorer dashboard용 log aggregation backend. 파일시스템
      저장소와 짧은 보존 기간(LOKI_RETENTION_HOURS)을 사용한다.
    source: Grafana Loki 3.3.2 multi-arch manifest
  alloy:
    env_key: ALLOY_IMAGE
    reference_policy: immutable_upstream
    default: grafana/alloy:v1.18.0@sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308
    purpose: Runtime Controller가 생성한 읽기 전용 target manifest를 사용해 Docker json-file
      container log를 Loki로 전송한다. Alloy에는 Docker API 접근 권한이 없다.
    source: Grafana Alloy v1.18.0 multi-arch manifest
