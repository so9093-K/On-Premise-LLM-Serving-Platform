images:
  platform:
    default: ai-model-serving-platform:0.0.1
    purpose: Gateway and Risk Adapter application image built from this repository.
    mutable: false
    source: local docker build
  vllm:
    default: ai-model-serving-vllm-unified:0.0.1
    purpose: vLLM OpenAI-compatible runtime for all served models (main-LLM 26B/12B,
      embedding, embedding-ko, risk-prompt) -- one image, two independent patch
      sets that are no-ops for the models that don't need them. Merged 2026-07-24
      from the former separate vllm-gemma4-audio and risk-vllm-kanana images.
    mutable: false
    source: local docker build from ops/images/vllm-unified/Dockerfile
    base_image_default: vllm/vllm-openai@sha256:6a090ed9d4a3739813ce355cbd63d4c34c987a25c8409796f24912ba71c2d4a4
    compatibility_pins:
      # Exact packages in base_image_default.  The derived image verifies these
      # values; it does not replace vLLM's curated dependency set.
      transformers: 5.13.1
      huggingface_hub: 1.23.0
      transformers_min: 4.52.4
    patch_lifecycle:
      patches:
      - patch_id: apply_gemma4_multimodal_patches
        removal_condition: upstream vLLM/Transformers fix the patch_dense FP8
          ignore-list mismatch and Gemma4UnifiedAudioFeatureExtractor.fft_length
      - patch_id: transformers_llama_head_dim_guard
        metadata_path: /usr/local/share/ai-model-serving/patches/transformers_llama_head_dim_guard.json
        removal_condition: upstream Transformers/vLLM honors explicit Llama head_dim without image patch
  embedding_ko_vllm:
    default: ai-model-serving-vllm-unified:0.0.1
    purpose: vLLM pooling runtime for local-embed-ko Korean dense retrieval embeddings.
    mutable: false
    source: same image as vllm.default
    base_image_default: vllm/vllm-openai@sha256:6a090ed9d4a3739813ce355cbd63d4c34c987a25c8409796f24912ba71c2d4a4
  risk_vllm:
    default: ai-model-serving-vllm-unified:0.0.1
    purpose: vLLM runtime for Kakao Kanana risk detectors -- same image as vllm.default.
    mutable: false
    source: same image as vllm.default
    base_image_default: vllm/vllm-openai@sha256:6a090ed9d4a3739813ce355cbd63d4c34c987a25c8409796f24912ba71c2d4a4
  dcgm_exporter:
    default: nvcr.io/nvidia/k8s/dcgm-exporter:4.5.2-4.8.1-distroless
    purpose: NVIDIA GPU metrics exporter for Prometheus.
    mutable: true
    source: NVIDIA dcgm-exporter release example
  prometheus:
    default: prom/prometheus:v3-distroless
    purpose: Prometheus metrics server with minimal distroless image variant.
    mutable: true
    source: Docker Hub prom/prometheus v3 distroless tag
  grafana:
    default: grafana/grafana:12.2.8
    purpose: Grafana dashboard UI pinned to stable 12.2.x rather than nightly/main
      tags.
    mutable: true
    source: Grafana 12.2.x Docker tag family
  cadvisor:
    default: gcr.io/cadvisor/cadvisor:v0.49.2
    purpose: Container resource advisor exposing per-container CPU and system RAM metrics.
    mutable: true
    source: Google cAdvisor v0.49.x stable release
  loki:
    default: grafana/loki:3.3.2
    purpose: Log aggregation backend for the Grafana request-log-explorer dashboard.
      Filesystem storage, short retention (LOKI_RETENTION_HOURS).
    mutable: true
    source: Grafana Loki 3.3.x Docker tag family
  promtail:
    default: grafana/promtail:3.3.2
    purpose: Ships docker json-file container logs to Loki. Reads log files directly
      (no docker.sock) to keep that access limited to admin-sidecar. Version paired
      with the loki image above.
    mutable: true
    source: Grafana Promtail 3.3.x Docker tag family
validation_policy:
  require_digest_before_production: true
  generated_by: scripts/config/setup_env.py
