[project]
name = "ai-model-serving-platform"
version = "0.0.1"
description = "Gateway-centered vLLM AI model serving platform with chat, embedding, and risk signal APIs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.128.2",
  "anyio==4.9.0",
  # 애플리케이션은 HTTP/SSE만 제공한다. reload·WebSocket·dotenv bundle 전체가 아닌
  # production 서버에서 실제 사용하는 event loop와 HTTP parser만 명시한다.
  "uvicorn==0.46.0",
  "uvloop==0.22.1",
  "httptools==0.7.1",
  "httpx==0.28.1",
  "huggingface_hub==1.13.0",
  # 전화번호 탐지. Google libphonenumber의 파이썬 포팅으로, 의존성이 없고
  # 순수 파이썬이라 PII 탐지기의 "외부 모델 없이 결정적" 성질을 유지한다.
  # lite 배포판을 쓰는 이유: 전체 배포판은 geocoder/carrier/timezone 메타데이터
  # 때문에 설치 46MB(그중 geodata 38MB)인데, 우리가 쓰는 건 파싱·유효성 판정뿐이라
  # 5.3MB로 충분하다. import 이름은 그대로 `phonenumbers`다.
  "phonenumberslite==9.0.38",
  "prometheus-client==0.25.0",
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
]

[dependency-groups]
quality = [
  "Jinja2==3.1.6",
  "pytest==8.4.2",
]

[tool.uv]
required-version = "==0.12.11"
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]
addopts = "-p no:cacheprovider -p no:ddtrace -p no:asyncio --strict-markers"

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Scalar 문서 번들은 패키지에 같이 실려야 한다. 빠지면 설치된 이미지에서
# /docs의 스크립트가 404가 되고, 외부 CDN도 쓰지 않으므로 문서가 통째로 안 뜬다.
[tool.setuptools.package-data]
ai_model_serving = ["static/*.js"]
