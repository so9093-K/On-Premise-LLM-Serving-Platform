[project]
name = "ai-model-serving-platform"
version = "0.0.1"
description = "Gateway-centered vLLM AI model serving platform with chat, embedding, and risk signal APIs."
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.128.2",
  "anyio==4.9.0",
  "uvicorn[standard]==0.46.0",
  "httpx==0.28.1",
  "huggingface_hub==1.13.0",
  "prometheus-client==0.25.0",
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
contract = [
  "jsonschema==4.26.0",
  "pytest==8.4.2",
]
pii = [
  "presidio-analyzer>=2.2.355",
  "presidio-anonymizer>=2.2.355",
  "spacy>=3.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]
addopts = "-p no:cacheprovider -p no:ddtrace -p no:asyncio --strict-markers"
markers = [
  "unit: hermetic unit test for a decision function or component",
  "contract: deterministic contract or artifact behavior test",
  "governance: source-of-truth, validator, release, or policy invariant test",
  "smoke: deployed service smoke validation",
  "runtime: live service validation requiring a running stack",
  "docker: validation requiring Docker or docker compose",
  "gpu: validation requiring visible GPU runtime capability",
  "slow: deterministic test excluded from the fast default suite",
  "gateway: Gateway app, route, service, or client behavior test",
  "settings: settings loading, dotenv, auth profile, or env contract test",
  "auth: authentication, authorization, or exposure ownership test",
  "openapi: OpenAPI generation, schema reference, or snapshot contract test",
  "docs: documentation structure, stale marker, or generated doc invariant test",
  "compose: Docker Compose, preflight, or compose operational contract test",
  "monitoring: Prometheus, Grafana, dashboard, or observability contract test",
  "package: release package or package hygiene test",
  "model_registry: model registry, modelctl, projection, or runtime asset model test",
  "cli: command registry, CLI wrapper, or operator command behavior test",
]

[tool.ruff]
target-version = "py312"
line-length = 100


[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
