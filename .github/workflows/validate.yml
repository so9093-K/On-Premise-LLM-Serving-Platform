name: Validate and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-contract:
    name: App and contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python_version: "3.12"
          - os: macos-15
            python_version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # 두 job은 공통 Platform lock의 지원 minor를 대표한다. Native runtime
          # exact patch와 image digest qualification은 이 workflow의 책임이 아니다.
          python-version: "${{ matrix.python_version }}"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Prepare developer environment
        run: make setup-dev PYTHON_BIN=python
      - name: Validate configuration and contracts
        run: make validate
      - name: Test application and contracts
        run: make test
