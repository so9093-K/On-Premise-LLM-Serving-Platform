name: Validate and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-contract:
    name: App and contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # app/contract CI는 OS별로 제공되는 3.12 patch를 사용한다. Linux 운영
          # image의 exact patch/digest 검증과는 별도이며 macOS ARM64에는
          # .python-version의 3.12.13 artifact가 제공되지 않는다.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml
      - name: Prepare developer environment
        run: make setup-dev PYTHON_BIN=python
      - name: Validate configuration and contracts
        run: make validate
      - name: Test application and contracts
        run: make test
