name: Validate and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-contract:
    name: App and contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml
      - name: Prepare developer environment
        run: make setup-dev PYTHON_BIN=python
      - name: Validate configuration and contracts
        run: make validate
      - name: Test application and contracts
        run: make test
