name: Validate and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-contract:
    name: App and contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - name: Resolve portable Python minor
        id: python_policy
        shell: bash
        run: |
          python_patch="$(tr -d '[:space:]' < .python-version)"
          if [[ ! "$python_patch" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=.python-version::expected x.y.z, got '$python_patch'"
            exit 2
          fi
          echo "minor=${python_patch%.*}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          # app/contract CI는 .python-version의 major.minor와 같은 OS별 portable
          # patch를 사용한다. Linux 운영 image의 exact patch/digest와는 별도다.
          python-version: "${{ steps.python_policy.outputs.minor }}"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml
      - name: Prepare developer environment
        run: make setup-dev PYTHON_BIN=python
      - name: Validate configuration and contracts
        run: make validate
      - name: Test application and contracts
        run: make test
