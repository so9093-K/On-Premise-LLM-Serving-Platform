version: 0.1.0
version_semantics: runtime validation matrix schema version, not package release version
validation_policy: runtime_validation_required
validation_checks:
- id: gateway-runtime
  owner: gateway
  validation: /health, /ready, /v1/models, chat, and embeddings return schema-valid
    responses.
  artifact_file: reports/runtime/gateway-runtime.md
  runtime_validation_required: true
  operator_action: Inspect Gateway process, upstream URLs, API key configuration,
    and dependency readiness.
  models:
  - local-main
  - local-embed
  - risk-prompt
  - risk-siren
- id: risk-adapter-runtime
  owner: risk-adapter
  validation: Detector and aggregate endpoints return signal-only responses.
  artifact_file: reports/runtime/risk-adapter-runtime.md
  runtime_validation_required: true
  operator_action: Inspect detector model availability, parser output, and forbidden
    response field checks.
  models:
  - risk-prompt
  - risk-siren
- id: vllm-runtime
  owner: model-runtime
  validation: All configured vLLM runtimes load and expose /v1/models or compatible
    readiness.
  artifact_file: reports/runtime/vllm-runtime.md
  runtime_validation_required: true
  operator_action: Inspect model server startup logs, model names, context length
    settings, and GPU allocation.
  models:
  - local-main
  - local-embed
  - risk-prompt
  - risk-siren
  runtime_services:
  - main_llm
  - embedding
  - risk_prompt
  - risk_siren
- id: gpu-capacity
  owner: operations
  validation: Soak run completes without OOM, excessive preemption, or restart loop.
  artifact_file: reports/runtime/gpu-capacity.md
  runtime_validation_required: true
  operator_action: Reduce max_model_len, max_num_seqs, or split models across GPUs
    when measured headroom is below threshold.
  runtime_services:
  - main_llm
  - embedding
  - risk_prompt
  - risk_siren
- id: monitoring-scrape
  owner: operations
  validation: Prometheus scrapes Gateway, Risk Adapter, vLLM runtimes, and DCGM exporter.
  artifact_file: reports/runtime/monitoring-scrape.md
  runtime_validation_required: true
  operator_action: Inspect scrape targets, service ports, and exporter availability.
  runtime_services:
  - main_llm
  - embedding
  - risk_prompt
  - risk_siren
- id: grafana-dashboard-render
  owner: operations
  validation: Reference dashboards render without prompt, user text, or model output
    labels.
  artifact_file: reports/runtime/grafana-dashboard-render.md
  runtime_validation_required: true
  operator_action: Check Grafana data source binding, dashboard imports, and metric
    mapping.
  runtime_services:
  - main_llm
  - embedding
  - risk_prompt
  - risk_siren
